qa:[['Describe the administration of Shivaji.',150,'Shivaji (crowned 1674) built an efficient and centralised administration. At the top was the Chhatrapati, assisted by the Ashtapradhan, a council of eight ministers led by the Peshwa (chief minister) and including the Amatya (finance), Senapati (army) and Nyayadhish (justice). Revenue was based on careful land measurement; Shivaji preferred to collect directly from peasants and reduced the power of hereditary intermediaries. Outside his kingdom he collected chauth, one-fourth of revenue, and sardeshmukhi, an additional tenth, from neighbouring areas in return for protection. His army was well paid in cash, disciplined and mobile, using light cavalry and guerrilla tactics. Forts were the core of defence, and he built a navy to protect the Konkan coast. His policy of respect for all religions and his welfare measures won wide support.'],
['Assess the role of the Marathas in 18th-century Indian politics.',250,'In the 18th century the Marathas were the most powerful Indian force and nearly replaced the Mughals as the paramount power.\n\nTheir rise began with Shivaji, who created an independent kingdom by 1674. After Aurangzeb executed Sambhaji in 1689, the Marathas continued a long guerrilla war that exhausted the Mughals in the Deccan. When Shahu became king in 1708, the Peshwas took real control. Balaji Vishwanath gained Mughal recognition of Maratha rights to chauth and sardeshmukhi in the Deccan; Baji Rao I pushed north into Malwa, Gujarat and Bundelkhand and even raided Delhi in 1737.\n\nBy the mid-18th century, the Maratha confederacy dominated western, central and much of northern India. Chiefs such as the Sindhias, Holkars, Gaikwads and Bhonsles ruled large territories under the Peshwa. They acted as protectors of the Mughal emperor, showing how Mughal symbols still mattered.\n\nThe third battle of Panipat (1761) against Ahmad Shah Abdali was a heavy defeat, killing many leaders. Yet the Marathas recovered: Mahadaji Sindhia restored their power in the north and controlled Delhi in the 1770s–90s, and Ahalya Bai Holkar ruled Indore well.\n\nTheir weaknesses proved decisive. The confederacy lacked unity; chiefs fought each other and the Peshwa. Their revenue depended heavily on chauth from neighbours, which created enemies. They did not modernise their armies as fully as the British. The British used these divisions in three Anglo-Maratha wars, defeating Sindhia in 1803 and ending the Peshwa’s power in 1818.\n\nThus the Marathas filled the Mughal vacuum for much of the century, but disunity prevented them from building a lasting empire.']]});

X('bhakti',{lesson:'NIOS Lesson 14: Cultural Developments in Medieval India (Sufism, Bhakti, Sikhism, literature)',
brief:'NIOS sees medieval Indian culture as a synthesis of Indian and Persian traditions. It describes Sufism, drawing on thinkers such as Al-Ghazali (1059–1111). The Chishti order was brought to India by Muinuddin Chishti, who settled at Ajmer around 1206 and died in 1235; Chishtis believed in love between God and soul, tolerance of all faiths, accepting disciples of any religion and association with Hindu and Jain yogis. The Bhakti movement had a monotheistic (nirguna) stream, with Kabir (c. 1440–1518) as the earliest and most influential north Indian saint, and a Vaishnava stream led by Ramananda, followed by Surdas (1483–1563) and Mira Bai (1503–1573). In Maharashtra, bhakti drew on the Bhagavata Purana and the Nathpanthis; Namdev (1270–1350) was a leading saint. Guru Nanak denounced caste and inequality, and in 1699 Guru Gobind Singh founded the Khalsa. NIOS also notes regional literature, and from Andhra, the Swaramela Kalanidhi (1550) by Ramamatya of Kondavidu, which describes ragas.',
revise:['Tamil Alvars and Nayanars (7th–9th c.) → devotion in people’s language → spread north through Ramanuja and Ramananda.','Rigid caste and costly ritual + new Islamic ideas of one God → nirguna saints (Kabir, Nanak) reject idols, caste and ritual.','Vaishnava saints (Surdas, Mira, Tulsidas, Chaitanya) → love for a personal God (Krishna, Rama) → devotional poetry in Hindi, Bengali, Marathi.','Sufis in India (Chishti, Suhrawardi) → khanqahs open to all, music (sama), tolerance → bridge between communities.','Bhakti + Sufi + vernacular poetry → growth of regional languages and a shared culture (Kabir’s dohas, Amir Khusrau’s Hindavi).','Guru Nanak’s teachings → Sikh community → Adi Granth → Khalsa (1699).'],
analysis:['Did Bhakti reform society? It challenged caste in thought and attracted lower castes and women, but it did not abolish the caste system; most saints sought spiritual, not social, revolution.','Bhakti and Sufism grew in parallel and influenced each other; Kabir’s ideas combine both, which is why both Hindus and Muslims claimed him.','Chishtis kept away from the court and state, while Suhrawardis accepted royal grants; this shows different attitudes to power within Sufism.','The movements made regional languages the vehicles of religion and literature, a lasting contribution.'],
mind:['Bhakti and Sufi',[['South roots',['Alvars','Nayanars','Ramanuja']],['Nirguna',['Kabir','Ravidas','Guru Nanak']],['Saguna',['Ramananda','Tulsidas','Surdas','Mira Bai','Chaitanya']],['Maharashtra',['Jnaneshwar','Namdev','Tukaram']],['Sufi orders',['Chishti – Ajmer','Suhrawardi – Multan','Naqshbandi']],['Impact',['Vernacular literature','Tolerance','Sikhism']]]],
table:['Bhakti saints (NIOS dates where given)',['Saint','Region','Dates','Message'],[['Kabir','Varanasi','c. 1440–1518','One formless God; against caste and ritual'],['Guru Nanak','Punjab','1469–1539','One God, equality, honest work'],['Surdas','Braj','1483–1563','Devotion to Krishna'],['Mira Bai','Rajasthan','1503–1573','Love for Krishna'],['Namdev','Maharashtra','1270–1350','Devotion to Vithoba'],['Chaitanya','Bengal','1486–1534','Kirtan, love for Krishna'],['Annamacharya','Andhra','1408–1503','Sankirtanas to Venkateswara']]],

figs:['fig_14.1','fig_14.2'],
qa:[['What were the main teachings of the Chishti Sufis?',150,'The Chishti order was brought to India by Khwaja Muinuddin Chishti, who settled at Ajmer around 1206, and it became the most popular Sufi order in India. Chishtis taught that love is the bond between God and the human soul and that God can be reached through devotion, not only through formal law. They practised tolerance towards people of all faiths, accepted disciples whatever their religion or caste, and showed kindness to all. They kept away from rulers and refused state grants, living simply in khanqahs that fed the poor through open kitchens. They used music and poetry (sama) to create a spiritual mood, and they mixed with Hindu and Jain yogis. Saints such as Nizamuddin Auliya in Delhi drew huge crowds, making the Chishtis a bridge between communities.'],
['Assess the impact of the Bhakti and Sufi movements on medieval Indian society.',250,'The Bhakti and Sufi movements were the most important religious developments of medieval India, and their impact reached far beyond religion.\n\nIn religion, both stressed personal devotion and love for God over ritual and priestly control. Bhakti saints like Kabir and Guru Nanak taught that God is one and formless and can be reached by anyone, while Vaishnava saints like Surdas, Mira Bai and Tulsidas expressed love for Krishna and Rama. Sufis, especially the Chishtis, taught love, tolerance and service, and their khanqahs welcomed everyone.\n\nSocially, the movements challenged caste and inequality. Many saints came from lower castes, such as Kabir the weaver and Ravidas the leather worker, and women like Mira Bai and Lal Ded found a voice. However, the movements did not abolish caste; their reform was mainly spiritual.\n\nThey also promoted harmony between Hindus and Muslims. Kabir rejected the rituals of both and is claimed by both. Sufi shrines like Ajmer attracted people of all faiths. This helped build a shared, composite culture.\n\nCulturally, their greatest gift was to regional languages. Saints sang in the people’s languages: Hindi, Punjabi, Bengali, Marathi, Gujarati, Kannada and Telugu, where Annamacharya composed thousands of songs. Literature, devotional music (kirtan, qawwali) and new forms of poetry flourished.\n\nPolitically, rulers such as Akbar drew on this spirit of tolerance. The Bhakti tradition also gave birth to Sikhism, which later became a strong political force.\n\nThus the movements softened religious divisions, gave dignity to ordinary people and enriched Indian languages, though they could not fully change the social order.']]});

X('c18',{lesson:'NIOS Lesson 15: Understanding Eighteenth Century India',
brief:'NIOS shows that after Aurangzeb, the later Mughals lost control: Bahadur Shah I (1707–12) tried compromise, Jahandar Shah (1712–13) was weak, Farrukhsiyar (1713–19) was raised and removed by the Sayyid brothers, who were then dislodged by Nizam-ul-Mulk and Muhammad Amin Khan (1720); Muhammad Shah ruled 1719–48. Nizam-ul-Mulk, failing to reform the court, marched south in October 1724 to found Hyderabad. Regional states (about 1700–1850) differed greatly. Saadat Khan made Awadh’s governorship hereditary before 1739; Ali Vardi Khan took Bengal in 1739; Sikh chiefs rose in Punjab; Jai Singh of Jaipur (d. 1743) and Suraj Mal of Bharatpur adopted Mughal-style revenue systems; Martanda Varma (1729–58) built a 50,000-strong army and centralised Travancore; Haidar Ali took power in Mysore in 1761. NIOS stresses that the century was gloomy only from Delhi’s viewpoint: apart from a crisis in 1702–04, there were few famines until the great Bengal famine of 1770; population, production, prices and wages rose gently; Surat (by 1720), Masulipatnam and Dhaka declined, while colonial port cities Bombay, Madras and Calcutta grew; urbanisation was higher in 1800 than in 1700.',
revise:['Aurangzeb’s death (1707) + succession wars + court factions (Sayyid brothers) → emperor becomes a puppet.','Weak centre → governors make offices hereditary → successor states (Hyderabad, Awadh, Bengal) that still use Mughal symbols.','Other groups seize power → Marathas, Sikhs, Jats, Rajputs, Mysore, Travancore → many centres of power.','Invasions (Nadir Shah 1739, Abdali) → Delhi plundered → Mughal prestige collapses.','Regional economies keep growing → but old ports (Surat, Masulipatnam) decline → colonial port cities rise.','Divided Indian states + European companies seeking trade and revenue → Plassey (1757) → British expansion.'],
analysis:['The “dark age” view of the 18th century, based on Delhi’s decline, is replaced by a “regional prosperity” view: many regions grew economically and culturally.','Successor states (Hyderabad, Bengal, Awadh) kept Mughal administration and legitimacy, while “new” states (Marathas, Sikhs, Jats) came from revolt against the Mughals; this typology is useful in answers.','The decline of Indian ports and rise of colonial ports show a shift in commercial power before formal British rule.','The British did not conquer a ruined India; they took over prosperous regions with functioning revenue systems, which made their conquest profitable.'],

qa:[['Was the 18th century a “dark age” in Indian history?',150,'The 18th century was once called a dark age because the Mughal empire collapsed after 1707, emperors became puppets, and Nadir Shah (1739) and Ahmad Shah Abdali plundered Delhi. Viewed from Delhi, it was indeed gloomy. But historians now see it differently. Many regions prospered: Hyderabad, Bengal, Awadh, the Maratha lands, Mysore and Travancore built effective revenue systems and armies. NIOS notes that, apart from a crisis in 1702–04, the first seven decades saw few famines until the Bengal famine of 1770, and population, production, prices and wages rose gently. Urbanisation was higher in 1800 than in 1700. Some old ports declined, but new trade centres grew. The century was therefore one of political decentralisation and regional growth, not general darkness, though divisions later helped the British.'],
['Discuss the nature of the regional states that emerged in the 18th century.',250,'As Mughal power weakened after 1707, many regional states emerged between about 1700 and 1850. They varied greatly in origin, resources and character, but they can be grouped into three types.\n\nThe first were successor states, founded by Mughal governors who made their positions hereditary while still recognising the emperor. Nizam-ul-Mulk founded Hyderabad in 1724; Murshid Quli Khan and later Ali Vardi Khan (1739) ruled Bengal; Saadat Khan made Awadh hereditary. These states kept Mughal administrative practices, issued coins in the emperor’s name and used Mughal titles, but in practice took their own decisions on revenue, appointments and war.\n\nThe second type were states that arose from revolt against the Mughals: the Marathas, the Sikhs and the Jats. The Maratha confederacy under the Peshwas became the strongest power in India, while Sikh chiefs in Punjab and Suraj Mal’s Jat state at Bharatpur built power through armed struggle. Even they, like Mahadaji Sindhia, used Mughal symbols to gain legitimacy.\n\nThe third type were independent kingdoms, old or new, such as the Rajput states (Jai Singh of Jaipur), Mysore under Haidar Ali (from 1761) and Tipu, and Travancore under Martanda Varma, who built a standing army of about 50,000 and curbed the Nayar nobles.\n\nCommon features included revenue farming to collect taxes, reliance on bankers and merchants, attempts to modernise armies, and patronage of regional culture. Their weaknesses were constant rivalry and inability to unite. The English East India Company used these divisions, beginning with Bengal in 1757, to build its own empire.']]});

X('europeans',{lesson:'NIOS Lesson 16: Establishment of British Rule in India till 1857 (European trade)',
brief:'NIOS explains that European companies came to India for trade before they sought rule. Europeans needed Indian goods (spices, textiles, indigo, saltpetre) but had little India wanted, so they paid in silver. The Portuguese, Dutch, English, French and Danes set up trading posts. The English gained a footing in 1612 when Jahangir allowed them to trade, and in their first fifty years they preferred trade to colonies. In 1717 Emperor Farrukhsiyar’s farman let the English Company trade duty-free in Bengal for Rs 3,000 a year, a privilege its servants misused for private trade. When the Seven Years’ War (1756–1763) broke out in Europe, the English and French in India became open enemies; the Carnatic wars ended French hopes after Wandiwash (1760).',
revise:['European demand for spices and textiles + sea route (Vasco da Gama, 1498) → trading posts (factories) on the coasts.','Mughal permission (Jahangir, 1612; Farrukhsiyar’s farman, 1717) → privileges → misuse of dastaks → friction with nawabs.','Rivalry in Europe (Seven Years’ War) → Anglo-French Carnatic wars in India → English victory at Wandiwash (1760).','Companies need security → forts and private armies (sepoys) → join Indian politics as allies of local rulers.','Trading power + army + Indian divisions → Plassey (1757) → from traders to rulers.'],
analysis:['Why did the English win over the French? Better finance and private-company backing, naval supremacy, Bengal’s wealth after 1757 and consistent leadership; Dupleix was recalled.','The Portuguese declined because of religious intolerance, reliance on force, and the union with Spain (1580); trade with India needed partnership.','Mughal grants to European companies show Mughal confidence, but they created privileges (duty-free trade) that later undermined Indian rulers.'],

qa:[['Why did the English succeed over the French in India?',150,'The English and French fought three Carnatic wars between 1746 and 1763, and the English won. Their company was a private body with strong financial backing from merchants, while the French company depended on a government often distracted by wars in Europe. The English navy controlled the seas, allowing them to bring troops and supplies and cut off French reinforcements. After Plassey (1757), the English gained the huge revenue of Bengal, which paid for their wars in the south. Their leaders, such as Clive and Eyre Coote, were capable, while the French recalled Dupleix in 1754 and later commanders quarrelled. The decisive English victory at Wandiwash (1760) and the fall of Pondicherry ended French ambitions, leaving them only a few trading posts. The victory gave the English a monopoly of European influence in India, and the experience of the Carnatic wars taught them how to use Indian rivalries and sepoy armies to gain territory.'],
['How did the East India Company change from a trading body into a territorial power?',250,'For its first century and a half, the English East India Company was mainly a trading body. It received permission to trade from Jahangir in 1612 and built factories at Surat, Masulipatnam, Madras, Bombay and Calcutta, paying for Indian goods with silver.\n\nSeveral changes in the 18th century turned it into a ruling power. First, Mughal decline after 1707 created powerful but rival regional rulers, whose disputes the Company could exploit. Second, the Company gained trade privileges, especially Farrukhsiyar’s farman of 1717 allowing duty-free trade in Bengal. Its servants misused the dastaks (passes) for private trade, which angered nawabs and made conflict likely.\n\nThird, rivalry with the French during the Carnatic wars led both companies to raise armies of Indian sepoys trained in European methods and to back rival claimants to thrones. This showed that small, disciplined forces could decide Indian politics and earn rewards in land and money.\n\nThe turning point came in Bengal. At Plassey in 1757 Clive defeated Siraj-ud-Daulah with the help of Mir Jafar, who paid the Company huge sums. At Buxar in 1764 the Company defeated the combined forces of Mir Qasim, the Nawab of Awadh and the Mughal emperor. The Treaty of Allahabad (1765) gave it the Diwani, the right to collect revenue of Bengal, Bihar and Orissa.\n\nWith land revenue, the Company no longer needed silver from Britain; Indian taxes paid for Indian goods and its army. From then on, expansion through wars and subsidiary alliances followed, and the trader became the ruler.']]});

X('britraj',{lesson:'NIOS Lesson 16: Establishment of British Rule in India till 1857',
brief:'NIOS traces British conquest from Plassey (June 1757), after which Mir Jafar paid the Company about Rs 1.77 crore and large bribes to its officers, to the defeat of Mir Qasim (1763) and the battle of Buxar (22 October 1764) against the Nawab of Bengal, the Nawab of Awadh and the Mughal emperor. Mysore resisted: Haidar Ali, army commander from 1749 and ruler from 1761, fought until his defeat by Eyre Coote in 1781, and Mysore finally fell in 1799. The Marathas were defeated in a series of wars, and Punjab was the last state to be conquered, in 1849; Ranjit Singh had built the second largest modern army in Asia. Subsidiary alliances created princely states such as Cochin (1791), Jaipur (1794), Travancore (1795), Hyderabad (1798) and Mysore (1799). Lord Dalhousie (1848–56) used the Doctrine of Lapse to annex states without natural heirs.',
revise:['Misuse of trade passes + Siraj’s attack on Calcutta → Plassey (1757) won through Mir Jafar’s betrayal → puppet nawab.','Mir Qasim tries to assert power → alliance with Awadh and the Mughal emperor → Buxar (1764) → Diwani (1765).','Bengal revenue → bigger army → wars against Mysore (1767–99), Marathas (1775–1818), Sikhs (1845–49).','Subsidiary alliances → Indian states lose foreign policy and army → princely states.','Doctrine of Lapse + annexation of Awadh (1856) → anger among rulers and soldiers → 1857.'],
analysis:['Plassey was a conspiracy more than a battle; Buxar was a real military victory against three powers and therefore more decisive.','Mysore under Haidar and Tipu was the most modern Indian challenger (western-trained army, rockets, trade policy); its defeat removed the strongest southern rival.','British success came from finance (Indian revenue), discipline, diplomacy and Indian disunity rather than superior numbers.'],
mind:['British conquest',[['Bengal',['Plassey 1757','Buxar 1764','Diwani 1765']],['Mysore',['Haidar Ali','Tipu Sultan','1799']],['Marathas',['1775–82','1803–05','1817–18']],['Punjab',['Ranjit Singh','1845–49']],['Methods',['Subsidiary alliance','Doctrine of Lapse','Annexation']]]],
table:['Major wars of British conquest',['War','Years','Result'],[['Plassey','1757','Mir Jafar made nawab'],['Buxar','1764','Diwani of Bengal, Bihar, Orissa (1765)'],['Anglo-Mysore wars','1767–1799','Tipu killed; Mysore under Wodeyars as subsidiary state'],['Anglo-Maratha wars','1775–1818','Peshwa’s power ended'],['Anglo-Sikh wars','1845–1849','Punjab annexed']]],

qa:[['Why is the battle of Buxar considered more important than Plassey?',150,'Plassey (1757) began British political power in Bengal, but it was won mainly through conspiracy: Mir Jafar and other nobles betrayed Siraj-ud-Daulah, and there was little real fighting. Buxar (22 October 1764) was different. Here the Company defeated the combined armies of three major powers, Mir Qasim of Bengal, Shuja-ud-Daulah of Awadh and the Mughal emperor Shah Alam II, in open battle. This proved British military superiority in north India. Its result, the Treaty of Allahabad (1765), gave the Company the Diwani of Bengal, Bihar and Orissa, legal control of their revenue granted by the emperor himself. That revenue financed further conquests. Plassey opened the door; Buxar made British rule secure and legitimate in Bengal. Buxar also exposed the weakness of the Mughal emperor and the nawabs, and from then on the Company was the strongest power in north-eastern India, ready to expand further.'],
['Explain the Subsidiary Alliance and the Doctrine of Lapse as instruments of British expansion.',250,'The British used both war and diplomacy to expand. Two important diplomatic instruments were the Subsidiary Alliance and the Doctrine of Lapse.\n\nThe Subsidiary Alliance was used systematically by Lord Wellesley from 1798. An Indian ruler who accepted it had to keep a British army in his state and pay for it, either in cash or by giving territory. He had to accept a British Resident at his court, could not employ other Europeans, and could not make war or treaties without British permission. In return, the British promised to protect him. Hyderabad was the first to accept in 1798; Mysore (1799), Awadh, Travancore and many others followed. The result was that states lost their independence in defence and foreign affairs, their armies were disbanded, and many fell into debt, giving the British grounds to annex land. NIOS notes that these alliances created the princely states.\n\nThe Doctrine of Lapse was applied by Lord Dalhousie (1848–56). Indian rulers had long adopted heirs when they had no son. Dalhousie declared that dependent states whose rulers died without a natural heir would “lapse” to the British, refusing to recognise adopted sons. Satara (1848), Jaitpur, Sambalpur, Udaipur, Jhansi (1853) and Nagpur (1854) were annexed this way. He also annexed Awadh in 1856 on the grounds of misgovernance.\n\nBoth instruments extended British power cheaply, without large wars. But they angered rulers, nobles and soldiers. The rani of Jhansi and Nana Saheb, both victims of lapse, became leaders of the Revolt of 1857, and the annexation of Awadh angered many sepoys who came from there.']]});

X('consol',{lesson:'NIOS Lesson 16 (administration) and Lesson 32: Colonial State',
brief:'NIOS describes how the Company organised its rule. The Regulating Act of 1773 created a Supreme Court at Calcutta; Supreme Courts followed at Madras (1801) and Bombay (1823). Lord Cornwallis created a professional civil service and separated executive and judicial duties at district level; Bentinck abolished provincial courts in 1831 and gave their work to Commissioners and Collectors. The Charter Act of 1813 ended the Company’s monopoly of trade with India, and the Act of 1833 ended its China trade monopoly, while Parliament’s control increased. Cornwallis’s Permanent Settlement (1793) fixed revenue with zamindars in Bengal, Bihar and Orissa. NIOS’s lesson on the colonial state adds that early British rule kept Indian administrators, then applied ideas of Utilitarian (Benthamite) reform, and finally, in the 19th century, an imperial ideology that Britain had a duty to “improve” the world; state power had to be made visible through rituals, records and laws. After 1857, the Government of India Act 1858 brought direct Crown rule.',
revise:['Diwani (1765) + corruption + parliamentary concern → Regulating Act 1773 → Governor-General and Supreme Court.','Pitt’s India Act 1784 → Board of Control → dual control by Company and Crown.','Need for revenue and order → Permanent Settlement (1793), civil service and courts (Cornwallis).','British industry wants Indian markets → Charter Act 1813 ends trade monopoly → India becomes a market for British goods.','Utilitarian ideas → codification of law, centralised Governor-General of India (1833) → Macaulay’s education policy (1835).','Annexations and reforms → resentment → 1857 → Crown rule (1858).'],
analysis:['Rule of law or rule by law? British courts introduced uniform procedures, but laws served colonial interests, and Indians were excluded from higher posts and judged differently (Ilbert Bill later).','The colonial state was centralised and bureaucratic, building the foundations of the modern Indian administrative state (civil service, districts, police), a legacy still visible today.','Ideology shifted from Orientalist respect for Indian traditions to Anglicist and Utilitarian “improvement”, which justified intervention in Indian society.'],

qa:[['What were the main features of the Charter Acts of 1813 and 1833?',150,'The Charter Act of 1813 renewed the Company’s charter but ended its monopoly of trade with India, opening India to all British merchants except for trade in tea and with China. This reflected the demand of British industrialists for Indian markets. It asserted the Crown’s sovereignty over Company territories and set aside one lakh rupees a year for education, the first government commitment to education in India. It also allowed Christian missionaries to work in India. The Charter Act of 1833 ended the Company’s remaining trade, including the China monopoly, turning it into a purely administrative body. It made the Governor-General of Bengal the Governor-General of India, with William Bentinck as the first, centralising legislative power. It also declared that no Indian would be barred from office on grounds of religion, birth or colour.'],
['Discuss the nature of the colonial state established by the British in India.',250,'The colonial state built by the British between 1757 and 1858 had features that set it apart from earlier Indian states.\n\nFirst, its main purpose was economic exploitation. The Company’s rule began with the Diwani (1765), and maximising land revenue was its first priority. Settlements such as the Permanent Settlement (1793) and ryotwari were designed to secure steady income, and policies after 1813 turned India into a market for British goods and a source of raw materials.\n\nSecond, it was a highly centralised, bureaucratic state. Cornwallis created a professional civil service; the District Collector became the key official; a regular police and army maintained control. The Charter Act of 1833 centralised law-making under the Governor-General of India.\n\nThird, it introduced a new legal order. Supreme Courts were set up at Calcutta (1773), Madras (1801) and Bombay (1823), codes of law were prepared, and the idea of rule of law was proclaimed. In practice, however, Indians were excluded from higher posts and laws protected British interests.\n\nFourth, it was justified by changing ideologies. Early Orientalists studied Indian languages and laws to rule through Indian traditions. Later Utilitarians and evangelicals argued for reforming Indian society, and in the 19th century an imperial ideology claimed that Britain had a mission to “improve” India. NIOS notes that the state also made its power visible through rituals, records and censuses.\n\nFinally, the state was alien and distant: power lay with a small British elite answerable to London. These features caused deep resentment, expressed in 1857, but also left India institutions of modern administration that survived independence.']]});

X('econ',{lesson:'NIOS Lesson 17: Economic Effects of British Colonialism',
brief:'NIOS divides British economic colonialism into three phases. The first, from 1757, was the phase of plunder and monopoly trade: after the Diwani of Bengal, Bihar and Orissa (1765), maximising revenue was the main aim; Warren Hastings introduced revenue farming in 1772, which proved a disaster, so Cornwallis introduced the Permanent Settlement in 1793; ryotwari followed in the south and west, and the Mahalwari settlement in the north and north-west after 1822. Company officials who made fortunes were called “nabobs”. The second phase, free trade (after 1813), made India a market for British goods and a source of raw materials; from the 1860s production was driven by overseas demand, and jute, food grains, oilseeds and tea replaced indigo and opium. Railways, which Dalhousie decided to build in 1853, served this trade. Commercialisation often used coercive, almost unfree labour and did not create capitalist agriculture; farmers grew cash crops to pay revenue, rent and debt. The jute collapse of the 1930s was followed by the Bengal famine of 1943. Indian industry, especially cotton in western India, grew when Britain faced difficulties, such as in the First World War and the Depression (1929–33).',
revise:['Diwani (1765) → revenue maximisation → revenue farming (1772) → ruin → Permanent Settlement (1793).','Different regions, different settlements → zamindari (Bengal), ryotwari (Madras, Bombay), Mahalwari (north-west) → all with high revenue demand.','High revenue in cash → peasants grow cash crops and borrow → moneylenders, debt and land loss → famines.','Industrial Revolution in Britain + free trade (1813) → cheap machine cloth floods India → handicrafts decline (deindustrialisation).','Railways (from 1853) → raw materials out, British goods in → commercialisation, not industrialisation.','Wealth sent to Britain (home charges, salaries, profits) → drain of wealth → nationalist critique (Naoroji, R.C. Dutt).'],
analysis:['Deindustrialisation debate: some economists argue Indian crafts declined only partly and new industries grew; nationalists stress the ruin of artisans and the shift of population back to agriculture.','Railways had a double effect: they served colonial trade but also unified the market and later the national movement.','The 1943 Bengal famine shows how colonial priorities (war needs, exports, lack of relief) turned food shortage into mass death.','Indian capital grew in gaps (cotton mills, Tata steel), showing that colonial India was not static; but its growth was limited by colonial policy.'],

qa:[['Explain the drain of wealth theory.',150,'The drain of wealth theory was put forward by Dadabhai Naoroji in “Poverty and Un-British Rule in India” and supported by R.C. Dutt and M.G. Ranade. It argued that a large part of India’s wealth was transferred to Britain every year without any return. The drain took several forms: home charges, which included interest on public debt, pensions and expenses of the India Office in London; salaries and savings sent home by British officials; profits of British companies; and payment for military expeditions. India had to export more than it imported to pay these, so its surplus was lost. As a result, capital for Indian investment shrank, poverty deepened and famines worsened. The theory exposed the economic basis of colonial rule and became a central argument of early nationalism.'],
['Analyse the impact of British land revenue policies on Indian agriculture.',250,'British land revenue policies were designed to secure maximum and stable income, and they deeply changed Indian agriculture.\n\nAfter the Diwani of 1765, the Company first tried revenue farming (1772), auctioning collection rights to the highest bidder, which caused oppression and ruin. Cornwallis then introduced the Permanent Settlement (1793) in Bengal, Bihar and Orissa, later extended to parts of Madras such as the Northern Circars. Zamindars became owners of land and paid a fixed revenue for ever. In the south and west, the ryotwari system of Munro and Read settled revenue directly with peasants, revised periodically. In the north-west, the Mahalwari system (after 1822) made the village community responsible.\n\nThe effects were largely harmful. Revenue demands were very high, often half or more of the net produce, and had to be paid in cash by fixed dates, whatever the harvest. Under zamindari, peasants became tenants-at-will, exposed to rack-renting and eviction. Under ryotwari, the state itself became a huge landlord with frequent increases. Land became a saleable commodity, so indebted peasants lost land to moneylenders and traders.\n\nThe need for cash forced commercialisation: farmers grew indigo, cotton, jute, opium and tea for export, often under coercion, as in indigo cultivation. This reduced food crops and made peasants dependent on world prices; when jute collapsed in the 1930s, Bengal was exposed to the 1943 famine.\n\nInvestment in agriculture was low, except for some canals, so productivity stagnated. Frequent famines, rural debt and peasant revolts, from the Deccan riots to the indigo revolt, show the outcome. The policies enriched the state and landlords but impoverished cultivators.']]});

X('reform',{lesson:'NIOS Lesson 18: Social Changes in Modern India',
brief:'NIOS shows two British attitudes: Orientalists such as William Jones (who found links between Sanskrit, Greek and Latin) and institutions like the Calcutta Madrassa and Fort William College (1801) studied Indian culture; Halhed published A Code of Gentoo Laws (1776). Anglicists and Utilitarians wanted to change Indian society. Ram Mohan Roy founded the Atmiya Sabha (1814) and the Brahmo Samaj (1828); after his death (1833), Debendranath Tagore (joined 1842) revived it, and Keshab Chandra Sen’s entry (1858) led to a split in 1866. Vidyasagar, with Bethune, opened girls’ schools and campaigned for the Widow Remarriage Act (1856). Vivekananda spread spiritual Hinduism abroad (1893–97) and founded the Ramakrishna Mission. Bombay had the Manav Dharma Sabha (1844) and Paramhansa Mandali (1849). Dayanand Saraswati wrote Satyarth Prakash and founded the Arya Samaj (1875); after him the DAV movement (Lahore, 1886) and Gurukul Kangri (1902) followed. Muslim reform drew on Shah Waliullah and was led by Sayyid Ahmad Khan. NIOS also covers education (Charter Act 1813, Macaulay, Wood’s Despatch 1854, Hunter Commission 1882) and the press (Hicky’s Bengal Gazette; Wellesley’s censorship 1799; Metcalfe freed the press 1835; Vernacular Press Act 1878).',
revise:['British rule + Western education + Orientalist rediscovery of Indian texts → Indians question social evils.','Rationalism and humanism → Ram Mohan Roy (Brahmo Samaj) → campaign against sati → abolition (1829).','Women’s questions (sati, widow remarriage, education) → Vidyasagar → Widow Remarriage Act (1856).','Revivalist strand → Arya Samaj (“back to the Vedas”) and Ramakrishna Mission → pride in Indian heritage.','Anti-caste movements → Phule, Narayana Guru, Periyar → voice for lower castes.','English education + press → new middle class + public opinion → foundation of political nationalism.'],
analysis:['Reform movements were both rationalist (Brahmo, Prarthana) and revivalist (Arya Samaj); their mix shaped Indian nationalism.','Limits: mostly urban, upper-caste and male in leadership; many reforms (like widow remarriage) had little practical effect for decades.','Colonial state’s role: some reforms needed British laws (1829, 1856), but the initiative came from Indians; later the British became cautious after 1857.','Reform in religion gave confidence against missionary criticism and laid a cultural base for political nationalism.'],

qa:[['Evaluate the contribution of Raja Ram Mohan Roy to modern India.',150,'Raja Ram Mohan Roy (1772–1833) is often called the father of modern India. He combined Indian learning with Western rationalism. In religion he attacked idol worship and ritualism, preached monotheism based on the Upanishads, and founded the Atmiya Sabha (1814) and the Brahmo Samaj (1828). In society he led the campaign against sati, which helped Bentinck abolish it in 1829; he also opposed polygamy and child marriage and supported women’s property rights. He favoured English and scientific education, helped found the Hindu College, and ran newspapers such as Sambad Kaumudi and Mirat-ul-Akhbar. NIOS notes he was among the first to bring political questions into public debate, protesting press restrictions and supporting rights for Indians. His work started the 19th-century renaissance. Rabindranath Tagore called him the inaugurator of the modern age in India, and his combination of reason, humanism and Indian tradition inspired later reformers across the country.'],
['Assess the role of 19th-century social and religious reform movements in the growth of national consciousness.',250,'The reform movements of the 19th century began as efforts to change society and religion, but they also prepared the ground for nationalism.\n\nFirst, they created confidence and pride. Ram Mohan Roy showed that the Upanishads taught monotheism; Dayanand Saraswati called for a return to the Vedas; Vivekananda presented Hindu philosophy to the world at Chicago in 1893. Against missionary attacks, these leaders showed that Indian civilisation was rational and great, which built self-respect.\n\nSecond, they promoted reason and individual dignity. The Brahmo Samaj and Prarthana Samaj questioned blind faith and ritual; reformers fought sati, child marriage and the ban on widow remarriage, achieving laws in 1829 and 1856. Phule, Narayana Guru and later Periyar challenged caste, raising the idea of equality, a value central to democracy.\n\nThird, they spread education and the press. Reformers opened schools, including for girls, as Vidyasagar did with Bethune; Sayyid Ahmad Khan founded Aligarh to modernise Muslim education. Newspapers and journals created public opinion and a common language of debate across regions.\n\nFourth, they built organisations and leaders. Bodies like the Arya Samaj, Brahmo Samaj and Theosophical Society trained people in public work; many national leaders came from these circles.\n\nThere were limits. Movements were largely urban and upper-caste, some revivalist strands sharpened religious identity, and Muslim and Hindu reform often moved on separate tracks, which later fed communal politics.\n\nOverall, by awakening reason, pride and organisation, the reform movements formed the cultural foundation of Indian nationalism.']]});

X('revolts',{lesson:'NIOS Lesson 19: Popular Resistance to Company Rule',
brief:'NIOS explains that the Company cared mainly about collecting high revenues on time, and the Bengal famine of 1770 showed the devastating effect of this policy on the countryside. Popular resistance came from peasants, tribals, deposed rulers and soldiers. Peasants of Rangpur and Dinajpur in Bengal rose in 1783 against oppressive revenue contractors; Jats of western UP and Haryana revolted in 1824. Tribal communities resisted because forest laws, outsiders and moneylenders threatened their land and way of life. These scattered revolts, NIOS says, prepared the ground for 1857, when for the first time people across caste, community and class put up a unified challenge.',
revise:['High revenue + revenue contractors + famine (1770) → peasant anger → Rangpur–Dinajpur revolt (1783).','Forest laws + outsiders (dikus) + moneylenders → loss of tribal land → Kol, Santhal, Munda revolts.','Indigo planters force cultivation on bad terms → Indigo revolt (1859–60) → Neel Darpan.','Debt and land loss to moneylenders → Deccan riots (1875).','Local, scattered revolts → crushed separately → but show deep discontent → build-up to 1857 and later mass movements.'],
analysis:['Revolts were local and led by traditional leaders, with limited aims; they lacked modern organisation, which is why they failed.','Yet they were not “primitive”: they targeted the specific agents of exploitation (planters, moneylenders, officials), showing clear understanding.','Some revolts used religion and messianic leaders (Birsa Munda) to mobilise, mixing faith and politics.','Andhra examples (Rampa 1879 and 1922–24, Uyyalawada 1846) fit this pattern and are useful in AP-oriented answers.'],
mind:['Popular resistance',[['Peasants',['Rangpur–Dinajpur 1783','Indigo 1859–60','Deccan riots 1875']],['Tribals',['Kol 1831','Santhal 1855–56','Munda 1899–1900','Rampa']],['Religious',['Sanyasi–Fakir','Wahabi','Kuka']],['Rulers and chiefs',['Paika 1817','Polygars','Uyyalawada 1846']],['Causes',['High revenue','Forest laws','Moneylenders','Planters']]]],

qa:[['Why did tribal communities revolt against British rule?',150,'Tribal communities lived in forests and hills with their own land rights, customs and chiefs. British rule disturbed this life. Forest laws restricted their access to forests for shifting cultivation, grazing, wood and food, and made forests state property. Land settlements opened tribal areas to outsiders, called dikus, such as moneylenders, traders and landlords, who took over land through debt. Revenue demands and forced labour added to the burden. Missionaries and new courts interfered with tribal customs. In response, tribes such as the Kols (1831), Santhals (1855–56, led by Sidhu and Kanhu) and Mundas (1899–1900, led by Birsa Munda) revolted, and in Andhra the Rampa hill people rose in 1879 and 1922–24. Though crushed, these revolts forced some protective laws for tribal land. These revolts, though crushed, kept alive a spirit of resistance; Birsa Munda and Alluri Sitarama Raju later became national heroes, and tribal welfare became a concern of independent India’s Constitution through the Fifth Schedule.'],
['Assess the nature and significance of popular resistance to Company rule before 1857.',250,'From the start of Company rule in 1757 until 1857, India saw many popular revolts. NIOS stresses that they arose from the Company’s focus on collecting high revenue, which, as the Bengal famine of 1770 showed, devastated rural society.\n\nThe revolts took several forms. Peasant revolts were directed against revenue contractors and zamindars, as in Rangpur and Dinajpur in Bengal (1783). Deposed rulers and chiefs fought to regain lost power, such as the Paikas of Odisha (1817), the poligars of the south and Uyyalawada Narasimha Reddy in Andhra (1846). Tribal revolts, such as the Kol (1831) and Santhal (1855–56) uprisings, defended land and forests against outsiders. Religious movements like the Sanyasi–Fakir and Wahabi movements combined faith with opposition to British rule.\n\nIn nature, these revolts were local and regional, led by traditional leaders, and often lacked coordination or a modern programme. They used traditional weapons against a well-armed state, so they were suppressed one by one. Their aims were often to restore an older order rather than create a new one.\n\nYet their significance was great. They revealed the depth of popular anger against colonial exploitation. They targeted the real agents of oppression, planters, moneylenders, revenue officials, which shows political awareness. They forced the British to make some concessions, such as tenancy and tribal land protections. They also created traditions of resistance and local heroes who inspired later generations.\n\nMost importantly, they formed the background to the Revolt of 1857, when, for the first time, soldiers, peasants, artisans and rulers across castes and communities rose together against British rule.']]});

X('r1857',{lesson:'NIOS Lesson 19: Revolt of 1857 – causes, course, nature and consequences',
brief:'NIOS lists economic, political, social and military causes: high land revenue, annexations, and soldiers (mostly from peasant families) unhappy with new land settlements. Rumours of bone dust in flour and the greased cartridges inflamed feelings. In May 1857 sepoys at Meerut shot their officers, freed comrades and went to Delhi to appeal to Bahadur Shah Zafar, who became the symbol of the revolt. Leaders included Nana Saheb, Tantia Tope, the Rani of Jhansi, Begum Hazrat Mahal and Kunwar Singh. On the nature of the revolt, NIOS presents the debate: some call it the first war of Indian independence; others point out that rebel leaders did not try to build a new social order; recent studies stress popular participation, making it a popular uprising. It failed for want of unity, planning and modern arms, but it compelled the British to re-examine their policies, leading to the Royal Proclamation and Crown rule in 1858.',
revise:['Annexations (Lapse, Awadh 1856) → angry rulers (Nana Saheb, Rani of Jhansi) → leadership for revolt.','High revenue + land loss + ruined artisans → peasants and artisans join.','Sepoys from peasant families + service grievances (overseas service, low pay) + greased cartridges → Meerut, 10 May 1857.','Rebels march to Delhi → Bahadur Shah Zafar as symbol → revolt spreads in the north and centre.','Lack of unity, plan and arms + loyal princes and south + British resources → revolt crushed by 1858.','Result → Crown rule (1858), army reorganised, policy of non-interference and alliance with princes and landlords.'],
analysis:['Nature debate: sepoy mutiny (British view), first war of independence (Savarkar), feudal reaction, or popular uprising (recent research, NIOS). A balanced answer: began as a mutiny but became a popular revolt in many areas.','Hindu–Muslim unity in 1857 alarmed the British and led to a later policy of divide and rule.','Its limits (no common programme, loyal princes, little support in the south and east) explain failure but do not reduce its symbolic importance for later nationalism.'],
mind:['Revolt of 1857',[['Causes',['Political – Lapse, Awadh','Economic – revenue, artisans','Social – reforms, missionaries','Military – cartridges, pay']],['Course',['Barrackpore','Meerut 10 May','Delhi','Kanpur, Lucknow, Jhansi']],['Leaders',['Bahadur Shah','Nana Saheb','Rani Lakshmibai','Begum Hazrat Mahal','Kunwar Singh']],['Failure',['No unity','Loyal princes','Poor arms']],['Results',['Act of 1858','Proclamation','Army changes']]]],

qa:[['Why did the Revolt of 1857 fail?',150,'Despite wide participation, the Revolt of 1857 failed for several reasons. It was limited in area, mainly to north and central India; Punjab, Bengal and most of the south stayed quiet. Many princes, such as the Sikh chiefs, Scindia and the Nizam, and many zamindars supported the British. The rebels lacked unity and a common programme: leaders fought for local aims, often to restore their own positions, and Bahadur Shah Zafar was only a symbol. There was no coordinated planning or single command. The British had better weapons such as the Enfield rifle, the telegraph to coordinate, control of the railways and sea, and huge resources from India and Britain. Able commanders and loyal Sikh and Gurkha regiments helped them recapture Delhi, Kanpur and Lucknow by 1858.'],
['Discuss the nature of the Revolt of 1857.',250,'Historians have long debated the nature of the Revolt of 1857, and NIOS presents the main views.\n\nBritish officials called it a sepoy mutiny, a revolt of soldiers caused by the greased cartridges. It certainly began with sepoys at Barrackpore and Meerut. But the mutiny view cannot explain why peasants, artisans, landlords and rulers joined in large areas such as Awadh and Bihar.\n\nNationalists, notably V.D. Savarkar, called it the first war of Indian independence. Supporters point to the wide participation of different groups, the unity of Hindus and Muslims, and the common target, British rule. Rebels proclaimed Bahadur Shah Zafar emperor, showing a desire to replace the Company. Critics answer that there was no idea of an Indian nation, large regions stayed aloof, and many leaders fought to recover personal kingdoms.\n\nSome Marxist and other historians saw it as a feudal reaction, a last attempt by old rulers and landlords to restore their privileges. NIOS notes that rebel leaders did not try to establish a new social order.\n\nRecent research, as NIOS stresses, focuses on popular participation. In many districts peasants attacked moneylenders and revenue records, and villages acted on their own grievances. This makes 1857 a popular uprising with deep social roots, not just a soldiers’ or princes’ revolt.\n\nA balanced view is that 1857 began as a military mutiny but became a widespread popular revolt against colonial rule in north and central India. It lacked a national vision, but cutting across caste, community and class, it was the first large unified challenge to British rule and became an inspiration for the national movement.']]});

X('nm1',{lesson:'NIOS Lesson 20: Nationalism; Lesson 21: Indian National Movement (to 1915)',
brief:'NIOS explains that nationalism grew primarily as a response to British rule, but at first Indians did not act as one people; even in 1857 groups fought together without a shared national idea. Nationalism took several forms: cultural nationalism; economic nationalism, as in Dadabhai Naoroji’s argument that India’s resources were drained to England through trade and high taxes; and religious nationalism, as when Bankim Chandra Chattopadhyay and Dayanand drew on religion, and Tilak introduced the public Ganapati festival in 1893 to spread nationalist ideas. The Indian National Congress was formed in December 1885 by 72 educated Indians. The Moderates (1885–1905) petitioned for reforms. Curzon’s partition of Bengal (1905) provoked protest; the Swadeshi movement was formally proclaimed on 7 August 1905 with the boycott resolution at the Calcutta Town Hall. Moderates and Extremists split at Surat (1907); the Morley–Minto reforms (1909) disappointed both. Revolutionaries acted, as when Khudiram Bose and Prafulla Chaki attacked a carriage at Muzaffarpur (1908), and abroad Shyamji Krishnavarma’s India House (London, 1905) and the Ghadar movement worked for freedom. The Komagata Maru incident (1914) inflamed feelings, and Tilak’s and Besant’s Home Rule Leagues followed.',
revise:['Colonial rule + English education + press + railways → educated middle class + all-India communication → political associations → INC (1885).','Moderates’ economic critique (drain theory) → exposes exploitation → but petitions bring little result → frustration.','Partition of Bengal (1905) → Swadeshi and boycott → mass participation, national education, swadeshi industries.','Moderate–Extremist differences on methods → Surat split (1907) → government repression → revolutionaries.','Morley–Minto (1909) separate electorates → communal politics grows (Muslim League, 1906).','First World War → Home Rule Leagues (1916) → Lucknow Pact (1916) → stage set for Gandhi.'],
analysis:['Moderates are often underrated: their economic critique destroyed the myth of benevolent British rule and gave nationalism its intellectual base.','Extremist use of religious symbols (Ganapati, Shivaji festivals) mobilised people but may have alienated Muslims, a debated legacy.','Swadeshi was a rehearsal for Gandhian mass movements: boycott, national education, constructive work and mass mobilisation.','Was the Congress a “safety valve” created by Hume? Modern historians reject this: Indian leaders used Hume as a “lightning conductor” to avoid suspicion.'],

qa:[['What was the significance of the Swadeshi movement?',150,'The Swadeshi movement began as a protest against Curzon’s partition of Bengal and was formally proclaimed on 7 August 1905 with the boycott resolution at the Calcutta Town Hall. It called on Indians to boycott British goods, especially cloth and salt, and to use Indian-made goods. Bonfires of foreign cloth, picketing and public meetings spread from Bengal to other regions. Swadeshi industries, banks and stores were started, and national schools and colleges were founded. Rabindranath Tagore’s songs and Rakhi Bandhan symbolised unity. The movement drew students, women and the lower middle class into politics for the first time on a large scale. It strengthened the Extremists, led to the Surat split (1907), and, together with continued protest, forced the annulment of the partition in 1911. It was a rehearsal for later Gandhian mass movements.'],
['Assess the contribution of the Moderates to the Indian national movement.',250,'The Moderates led the Indian National Congress from its foundation in December 1885 until about 1905. Leaders such as Dadabhai Naoroji, Gopal Krishna Gokhale, Pherozeshah Mehta and Surendranath Banerjee believed in constitutional methods: petitions, resolutions, speeches and memoranda, and they trusted British sense of justice.\n\nTheir greatest contribution was an economic critique of colonial rule. Naoroji’s drain theory, supported by R.C. Dutt and Ranade, showed that Indian poverty resulted from British policies: the drain of wealth through home charges, high land revenue, destruction of handicrafts and one-sided trade. This destroyed the myth of benevolent British rule and gave nationalism a solid intellectual base.\n\nSecond, they provided political education. Through the Congress’s annual sessions and the press, they spread ideas of democracy, civil liberties and representative government across India and created a common national platform for people of different regions.\n\nThird, they demanded specific reforms: expansion of legislative councils, Indianisation of the civil services with simultaneous examinations, reduction of military expenditure, and protection of civil rights. The Indian Councils Act of 1892 was partly a response.\n\nThe Moderates also had limits. Their base was the urban educated elite; they did not mobilise the masses; and their faith in British justice made their methods slow, which frustrated younger nationalists and led to the rise of the Extremists.\n\nYet their work laid the foundation of the national movement. They built an all-India organisation, created a national consciousness and produced the arguments on which later leaders, including Gandhi, built mass struggle.']]});

X('nm2',{lesson:'NIOS Lesson 21: Indian National Movement (1915–1947)',
brief:'NIOS shows that the post-war years (after 1918) saw unrest as the war’s economic impact grew. Gandhi, who arrived in India in 1915, harnessed these forces through satyagraha, first at Champaran (enquiry in 1917 against indigo planters), Ahmedabad and Kheda. The Rowlatt bills (February 1919) curbing civil liberties led to a satyagraha with a hartal fixed for 6 April 1919 (observed on 30 March in Delhi). On Baisakhi, 13 April 1919, General Dyer fired on a gathering at Jallianwala Bagh, Amritsar; martial law followed in Punjab, and the Montagu–Chelmsford reforms (1919) frustrated hopes. The call for non-cooperation came from the All India Khilafat Conference (Delhi, November 1919), led by the Ali brothers, and the Calcutta special session (September 1920) adopted it. The Prince of Wales’s visit (November 1921) was met by hartals. After the movement, the Swarajists entered the councils (elections of 1924), while revolutionaries such as the Hindustan Republican Association acted in the north. The all-party boycott of the Simon Commission was followed by the Purna Swaraj pledge, taken across India on 26 January 1930, and the Civil Disobedience Movement on the issue of salt, with Gandhi’s march from 12 March 1930.',
revise:['Post-war economic hardship + Rowlatt Act → Gandhi’s first all-India satyagraha → Jallianwala Bagh (1919) → loss of faith in British justice.','Khilafat grievance + Punjab wrongs → Non-Cooperation (1920–22) → Hindu–Muslim unity and mass participation → withdrawn after Chauri Chaura.','Lull → Swarajists in councils + constructive work + revolutionaries (HRA/HSRA, Bhagat Singh).','All-white Simon Commission → national boycott → Nehru Report → Purna Swaraj (Lahore 1929).','Salt satyagraha (1930) → Civil Disobedience → Gandhi–Irwin Pact, Round Table Conferences, Poona Pact.','Act of 1935 → provincial ministries (1937) → war → Quit India (1942), INA → negotiations → independence and partition (1947).'],
analysis:['Gandhian strategy is often described as Struggle–Truce–Struggle (Bipan Chandra): mass movements followed by pauses for consolidation, which kept the movement alive.','Non-violence was both a moral and a practical choice: it allowed mass participation, including women, and denied the British justification for repression.','Communal politics, the British policy of divide and rule, and Congress–League failures to agree led to partition; this was a major limitation of the movement.','Revolutionaries and the INA complemented, rather than opposed, the Gandhian mass struggle in creating pressure on the British.'],

qa:[['Explain the significance of the Jallianwala Bagh massacre.',150,'On Baisakhi day, 13 April 1919, a peaceful crowd gathered at Jallianwala Bagh in Amritsar to protest the arrest of leaders during the Rowlatt satyagraha. General Dyer blocked the exit and ordered firing without warning, killing hundreds and wounding many more. Martial law and humiliating punishments followed in Punjab. The massacre shocked India. Rabindranath Tagore returned his knighthood, and Gandhi lost his faith in British justice. The Hunter Committee’s mild treatment of Dyer and his praise in Britain deepened Indian anger. Together with the Rowlatt Act and the Khilafat issue, it led directly to the Non-Cooperation Movement of 1920. The massacre turned many moderate Indians against British rule and became a lasting symbol of colonial brutality. The massacre is remembered every year and stands as a turning point after which demands moved from reforms within the empire towards full self-government and, later, complete independence.'],
['Evaluate the role of Gandhi in transforming the Indian national movement into a mass movement.',250,'When Gandhi returned to India in 1915, the national movement was largely led by the educated middle class. Within a few years he turned it into a mass movement, as NIOS describes.\n\nFirst, he introduced a new method, satyagraha, or non-violent resistance. It allowed ordinary people, including women and the poor, to take part without arms, and it put the moral burden on the government. He tested it in local struggles: Champaran (1917) against indigo planters, the Ahmedabad mill strike and Kheda (1918) for peasants.\n\nSecond, he linked national politics to people’s everyday grievances. The Rowlatt satyagraha (1919) became the first all-India protest. He joined the Khilafat issue with Punjab wrongs and swaraj in the Non-Cooperation Movement (1920–22), bringing Hindus and Muslims together. In 1930 he chose salt, a need of every Indian, for the Dandi March, which made civil disobedience a nationwide campaign.\n\nThird, he reorganised the Congress into a mass party with village-level committees, membership open to all at a low fee, and provincial units based on languages. Constructive work, khadi, village industries, Hindu–Muslim unity and the removal of untouchability, kept people involved between movements.\n\nFourth, his personal style, simple dress, use of Indian languages and religious idiom, made him accessible to peasants.\n\nThere were limits. His sudden withdrawals, as after Chauri Chaura, frustrated some; his methods could not prevent communal division and partition; and other forces, revolutionaries, socialists, the INA, peasants’ and workers’ movements, also contributed.\n\nStill, by giving the movement a mass base, a method and an organisation, Gandhi made independence a people’s cause.']]});

X('facts',{lesson:'NIOS Lessons 16, 18 and 21 (Acts, press, Congress sessions); standard facts for Prelims',
brief:'This chapter gathers facts that NIOS spreads across several lessons. On the press, NIOS notes that James Augustus Hicky published India’s first newspaper, the Bengal Gazette; early English papers served Europeans; Wellesley imposed the Censorship of the Press Act (1799); Charles Metcalfe (1835–36) removed restrictions and was called the liberator of the Indian press; the Vernacular Press Act of 1878 targeted Indian-language papers. On institutions, the Regulating Act (1773) created the Supreme Court at Calcutta and the Hunter Commission (1882) reviewed education. On the Congress, NIOS records its formation in December 1885 by 72 delegates and its key sessions: Surat 1907 (split), Calcutta special session 1920 (non-cooperation) and Lahore 1929 (Purna Swaraj, pledge taken on 26 January 1930).',
revise:['Press grows (Hicky 1780) → British control (1799 censorship, 1823 licensing) → Metcalfe frees (1835) → Indian papers spread nationalism → Vernacular Press Act (1878) → repealed by Ripon (1882).','Congress sessions mark turning points: 1885 founding → 1906 Calcutta swaraj → 1907 Surat split → 1916 Lucknow pact → 1920 non-cooperation → 1929 Purna Swaraj → 1931 Karachi rights.','Governor-General line: Bengal (1773) → India (1833) → Viceroy (1858) → shows growing centralisation and Crown control.','Commissions often triggered protest: Simon (1927) → boycott → Nehru Report → Purna Swaraj.'],
analysis:['Learning facts as cause-and-effect chains is more useful than isolated lists; examiners link sessions to movements.','The press was both a tool of colonial information and of nationalist mobilisation, which explains repeated controls.','Ripon’s liberal measures (local self-government, repeal of VPA) contrast with Lytton and Curzon; Viceroys’ personalities shaped policy within imperial limits.'],

qa:[['Trace the growth of the Indian press and British attempts to control it.',150,'The Indian press began when James Augustus Hicky published the Bengal Gazette in 1780; early papers served mainly Europeans. Fearing criticism, Wellesley imposed the Censorship of the Press Act (1799), requiring papers to be checked before publication, and in 1823 licences were required. Charles Metcalfe removed these restrictions in 1835, earning the title liberator of the Indian press, and papers multiplied. Indian-owned papers such as Amrita Bazar Patrika, The Hindu, Kesari and Mahratta spread nationalist ideas and criticised policies. Alarmed, Lytton passed the Vernacular Press Act (1878) against Indian-language papers; Ripon repealed it in 1882. Later laws, like the Newspapers Act of 1908, targeted revolutionary writing. Despite controls, the press became a key tool of political education and nationalism. Even under restrictions, the press educated public opinion, exposed injustices such as famine mismanagement and police excesses, and connected readers across regions, building a sense of a shared nation.'],
['Explain how Congress sessions reflected the changing goals of the national movement from 1885 to 1931.',250,'The annual sessions of the Indian National Congress mark the stages through which the national movement passed.\n\nIn its early years, starting with the Bombay session of 1885 with 72 delegates under W.C. Bonnerjee, the Congress was led by Moderates. Sessions passed resolutions asking for reforms such as expanded councils, Indianisation of services and lower military spending, and they built political education.\n\nThe Calcutta session of 1906 under Dadabhai Naoroji declared swaraj as the goal and supported swadeshi, boycott and national education, reflecting the anger over the partition of Bengal. The Surat session of 1907 saw the split between Moderates and Extremists over methods.\n\nThe Lucknow session of 1916 reunited the two groups and signed the Lucknow Pact with the Muslim League, showing a joint demand for self-government during the First World War. The Calcutta session of 1917 had Annie Besant as the first woman president, reflecting the Home Rule movement.\n\nGandhi’s leadership changed the Congress into a mass organisation. The special Calcutta session (1920) and the Nagpur session (1920) adopted non-cooperation and reorganised the party on linguistic provinces with a mass membership. Gandhi presided over only one session, at Belgaum in 1924, and Sarojini Naidu became the first Indian woman president at Kanpur in 1925.\n\nThe Lahore session of 1929 under Jawaharlal Nehru declared Purna Swaraj as the aim, and the pledge was taken across India on 26 January 1930. The Karachi session of 1931 under Vallabhbhai Patel adopted the Fundamental Rights and Economic Policy resolution, outlining the kind of free India the movement sought.\n\nThus the sessions show a journey from reforms to complete independence and social democracy.']]});

X('postind',{lesson:'Not covered in the NIOS book (it ends at 1947). Based on standard sources (Bipan Chandra, India After Independence).',
brief:'The NIOS history book stops at independence, so this chapter uses standard sources. After 1947, India faced partition’s refugees and violence, and the integration of over 560 princely states, achieved by Sardar Patel and V.P. Menon through the Instrument of Accession; Junagadh, Hyderabad (Operation Polo, 1948) and Kashmir (accession, 26 October 1947) were difficult cases. The Constitution came into force on 26 January 1950, and the first general election (1951–52) established democracy. Planning began with the First Five Year Plan (1951). Linguistic states followed the creation of Andhra State (1953) and the States Reorganisation Act (1956). In foreign policy, India followed non-alignment and Panchsheel (1954). Wars with China (1962) and Pakistan (1965, 1971) tested the nation. The Green Revolution, bank nationalisation (1969), the Emergency (1975–77), nuclear tests (1974, 1998), the economic reforms of 1991 and the 73rd and 74th Amendments (1992) marked later turning points.',
revise:['Partition + princely states → urgent need for unity → integration under Patel → political map of India.','Constituent Assembly → Constitution (1950) → universal adult franchise → first elections (1951–52) → democracy rooted.','Language movements (Andhra, 1952–53) → SRC → States Reorganisation Act (1956) → linguistic states.','Poverty and low growth → planning and mixed economy → industrial base; food crisis → Green Revolution.','External threats (1962, 1965, 1971) → defence build-up, Bangladesh liberation, Simla Agreement.','Economic crisis (1991) → liberalisation, privatisation, globalisation; democratic decentralisation (1992).'],
analysis:['Integration was achieved mostly through diplomacy and incentives (privy purses), with force used only where needed; Hyderabad’s case is key for AP history.','Linguistic states were feared to divide India but instead strengthened federal unity by meeting regional aspirations.','Planning built heavy industry and institutions but also led to licence-raj inefficiencies, which the 1991 reforms addressed.','The Emergency showed the fragility of democratic institutions; its defeat in 1977 showed their strength.'],

qa:[['Discuss the integration of princely states into the Indian Union.',150,'At independence there were over 560 princely states covering about two-fifths of India. Sardar Vallabhbhai Patel, as States Minister, with his secretary V.P. Menon, persuaded most rulers to sign the Instrument of Accession, surrendering defence, foreign affairs and communications, and a Standstill Agreement. He used patriotism, the fear of popular movements and incentives such as privy purses and titles. By 15 August 1947 nearly all states had acceded. Three were difficult. Junagadh’s nawab acceded to Pakistan, but a popular revolt and a plebiscite brought it to India. Hyderabad’s Nizam sought independence while Razakars terrorised people; Operation Polo (September 1948) ended this. Kashmir’s ruler acceded on 26 October 1947 after a tribal invasion. Later, states were merged into larger units, completing India’s political unification. The princes were compensated with privy purses, which were abolished in 1971 by the 26th Amendment. Integration gave India a unified political map and was Patel’s greatest achievement.'],
['How did the reorganisation of states on a linguistic basis strengthen Indian unity?',250,'After independence, national leaders feared that creating states on the basis of language might weaken the unity of a newly partitioned country. The JVP Committee (1948) advised caution. But popular demand, especially from Telugu speakers, forced change. The death of Potti Sriramulu after a 58-day fast in December 1952 led to the creation of Andhra State on 1 October 1953. The government then appointed the States Reorganisation Commission under Fazl Ali, and the States Reorganisation Act of 1956 created fourteen states and six union territories largely on linguistic lines. Later Bombay was divided into Maharashtra and Gujarat (1960), and Punjab and Haryana were formed (1966).\n\nThe fear of division proved wrong. Linguistic states strengthened unity in several ways.\n\nFirst, they met genuine regional aspirations. People felt that their language and culture were respected, which reduced resentment against the centre and the danger of separatism.\n\nSecond, administration became closer to the people. Government, courts and education in the local language made democracy more meaningful, allowing ordinary citizens to participate.\n\nThird, they gave political stability. Regional leaders could pursue their goals within the federal system rather than against it, and regional parties became part of national politics.\n\nFourth, they promoted regional languages and literature while English and Hindi served as link languages, reflecting unity in diversity.\n\nThere were problems: disputes over boundaries and river waters, and demands for further division, as in Telangana. Yet, overall, linguistic reorganisation showed that recognising diversity can strengthen national unity rather than weaken it.']]});

X('caves',{lesson:'NIOS Lessons 5–8 (Mauryan, post-Mauryan, Gupta and early medieval art) and Lesson 14: Cultural Developments in Medieval India (architecture, painting)',
brief:'NIOS traces Indian architecture through stages. Mauryan art gave the earliest examples: polished pillars like Sarnath, the Barabar caves and the Didarganj Yakshi. Post-Mauryan times brought stupas such as Bharhut (mid-2nd century BC) and Sanchi, and the Gandhara, Mathura and Amaravati schools. NIOS notes that structural temples were first built in north India in the Gupta period (Deogarh), that the Pallavas built stone temples in the 7th and 8th centuries (the rathas of Mahabalipuram), and that three temple styles developed in 750–1200: Nagara in the north, Dravida in the south with high gopurams, and Vesara, found at Pattadakal near Badami. In the medieval lesson, NIOS describes Sultanate buildings (Qutb Minar, Alai Darwaza), the distinct Deccani style of the Bahmanis, Babur’s mosques at Sambhal and Panipat (1526), Akbar’s use of red sandstone and decorative arches, Jahangir’s tombs of Akbar (Sikandara) and Itmad-ud-Daula, and Shah Jahan’s Red Fort, Moti Masjid, Jama Masjid and the Taj Mahal (1632–1643). Mughal and Rajput painting developed alongside.',
revise:['Mauryan state power → polished stone pillars and rock-cut caves (Barabar) → beginning of stone architecture.','Buddhist patronage by traders and kings → stupas and chaityas (Sanchi, Bharhut, Amaravati, Ajanta, Karle).','Gupta Puranic religion → first structural temples (Deogarh) → square sanctum plus shikhara.','Regional dynasties → regional temple styles: Nagara (Khajuraho, Konark), Dravida (Thanjavur), Vesara (Pattadakal, Hoysala).','Turkish rule → true arch and dome, minarets, calligraphy (Qutb Minar, Alai Darwaza).','Mughal synthesis → Persian garden-tomb plus Indian details → Humayun’s Tomb → Taj Mahal.'],
analysis:['Architecture reflects patronage: Buddhist art came from merchants and guilds, temple art from kings and land grants, Indo-Islamic art from Sultans and Mughals.','The Indo-Islamic style is a true synthesis: Indian craftsmen built Islamic forms, adding lotus motifs, brackets and chhatris.','Andhra’s contribution (Amaravati, Nagarjunakonda, Undavalli, Lepakshi, Golconda) shows the state’s place in national art history; useful for APPSC answers.','Temple styles are not rigid categories; Pattadakal shows Nagara and Dravida side by side, which is why Vesara is called a blend.'],

qa:[['Distinguish between the Nagara, Dravida and Vesara styles of temple architecture.',150,'Indian temple architecture developed three main styles between about 750 and 1200. The Nagara style of north India, seen at Khajuraho, Konark and the Lingaraja temple, has a square sanctum topped by a tall, curved tower (shikhara) crowned by an amalaka, and usually no high boundary wall. The Dravida style of the south, seen in the Brihadeeswara temple at Thanjavur and the Shore Temple at Mahabalipuram, has a pyramid-shaped tower (vimana) of storeys, large gateways called gopurams, and high enclosure walls with tanks inside. The Vesara style of the Deccan, seen at Pattadakal and in Hoysala temples at Belur and Halebidu, blends features of both, often with star-shaped plans and rich carving. Patronage of regional dynasties shaped each style. Temples were also centres of economy, education and art, employing priests, artisans, dancers and musicians, so their styles reflect the wealth and ambition of the dynasties that built them.'],
['Discuss the main features of Mughal architecture and its significance.',250,'Mughal architecture, developed between the 16th and 17th centuries, was a synthesis of Persian, Central Asian and Indian traditions.\n\nIt began modestly with Babur, who built mosques at Panipat and Sambhal in 1526 and laid out gardens. The real foundation was Humayun’s Tomb in Delhi, built under Akbar, which introduced the Persian double dome and the char-bagh, a garden divided into four parts, with the tomb at the centre.\n\nUnder Akbar, NIOS notes, indigenous styles were encouraged. Red sandstone became common, arches were used mainly for decoration, and buildings were carved or inlaid with bold patterns. Fatehpur Sikri, with the Buland Darwaza, Panch Mahal and Jodha Bai’s palace, combined Hindu brackets, chhatris and Islamic arches. The Agra Fort is another example.\n\nJahangir preferred gardens and built Akbar’s tomb at Sikandara; Nur Jahan built the tomb of Itmad-ud-Daula, the first major building faced entirely in white marble with pietra dura inlay of semi-precious stones.\n\nUnder Shah Jahan, Mughal architecture reached its height: white marble, delicate inlay, bulbous domes and perfect symmetry. The Taj Mahal (1632–1643), the Red Fort and Jama Masjid in Delhi, and the Moti Masjid at Agra are his masterpieces. Under Aurangzeb building declined, though the Badshahi Mosque at Lahore is notable; later works like Safdarjung’s tomb show the end of the tradition.\n\nThe significance of Mughal architecture lies in its synthesis of cultures, its influence on Rajput, Sikh and regional styles, and its role in projecting imperial power. Its monuments, several of them UNESCO World Heritage Sites, remain symbols of India’s composite heritage.']]});

X('music',{lesson:'NIOS Lesson 14 (music in medieval India) and Cultural Lesson: Cultural Communication (music and dance as expressions of culture)',
brief:'NIOS treats music as a key medium of cultural communication, with both folk and classical forms enriching Indian culture. In the medieval period, music flourished at royal courts and in devotional movements. NIOS highlights the Swaramela Kalanidhi (1550) by Ramamatya of Kondavidu in Andhra, which describes 20 janaka (parent) and 64 janya (derived) ragas, an early step towards the systematic classification of Carnatic ragas. Sufi music (sama, qawwali) and Bhakti singing spread devotion among ordinary people.',
revise:['Samaveda chants → Natya Shastra’s theory → early Indian music.','Persian contact in the Sultanate and Mughal courts → Hindustani music (Khayal, Qawwali, new instruments) in the north.','Southern temple and court traditions + bhakti poetry → Carnatic music.','Raga classification (Ramamatya’s Swaramela Kalanidhi, 1550; later Venkatamakhin’s 72 melakartas) → systematic Carnatic theory.','Bhakti saints (Annamacharya, Purandara Dasa, Tyagaraja) → kritis in Telugu and Kannada → Carnatic repertoire.'],
analysis:['Hindustani and Carnatic music grew from common roots but diverged because of Persian influence in the north and temple-centred devotion in the south.','Andhra’s contribution is central to Carnatic music: Telugu is its main language (Tyagaraja, Annamacharya, Kshetrayya), and Ramamatya of Kondavidu shaped its theory.','Patronage shifted from temples and courts to public concerts and radio in the 20th century, democratising classical music.'],
mind:['Indian music',[['Roots',['Samaveda','Natya Shastra']],['Hindustani',['Dhrupad','Khayal','Thumri','Gharanas']],['Carnatic',['Kritis','Melakarta','Trinity']],['Andhra',['Ramamatya 1550','Annamacharya','Tyagaraja','Kshetrayya']],['Devotional',['Bhajan','Qawwali','Kirtan']]]],
table:['Hindustani vs Carnatic',['Point','Hindustani','Carnatic'],[['Region','North India','South India'],['Influence','Persian and Central Asian','Indigenous, temple-centred'],['Focus','Improvisation, raga elaboration','Fixed compositions (kritis)'],['Instruments','Sitar, sarod, tabla, shehnai','Veena, mridangam, nadaswaram, violin'],['Key names','Tansen, Amir Khusrau, gharanas','Purandara Dasa, Tyagaraja, Dikshitar, Syama Sastri']]],
