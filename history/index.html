<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#243b36">
<title>Itihasam – Indian & AP History</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-title" content="Itihasam">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
:root{--bg:#f6f3ea;--panel:#fffdf7;--ink:#2b2a26;--muted:#6b675c;--accent:#2f6b5e;--accent2:#c9a227;--line:#e4dfd0;--ok:#2f7d4a;--bad:#a33b3b;--side:#243b36;--sideText:#eae6d8}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,"Segoe UI","Noto Sans Telugu",sans-serif;background:var(--bg);color:var(--ink);font-size:17px;line-height:1.65}
.app{display:flex;min-height:100vh}
aside{width:290px;background:var(--side);color:var(--sideText);position:sticky;top:0;height:100vh;overflow-y:auto;padding:16px 12px 30px;flex-shrink:0}
aside .brand{font-size:1.25rem;font-weight:700;padding:4px 10px 8px;color:#fff}
aside .brand .te{font-weight:400;opacity:.8}
aside .brand small{display:block;font-size:.75rem;font-weight:400;opacity:.7}
.search{width:100%;margin:4px 0 8px;padding:9px 12px;border-radius:10px;border:0;font:inherit;font-size:.92rem;background:rgba(255,255,255,.12);color:#fff}
.search::placeholder{color:rgba(255,255,255,.55)}
aside details{margin-top:4px}
aside summary{cursor:pointer;font-size:.78rem;letter-spacing:.07em;text-transform:uppercase;opacity:.8;padding:10px 10px 6px;list-style:none}
aside summary::-webkit-details-marker{display:none}
aside summary::before{content:"▸ "}
aside details[open]>summary::before{content:"▾ "}
.cnt{float:right;opacity:.6;font-size:.72rem}
aside button.nav{display:block;width:100%;text-align:left;background:none;border:0;color:inherit;padding:7px 12px;border-radius:8px;font:inherit;font-size:.92rem;cursor:pointer;line-height:1.35}
aside button.nav:hover{background:rgba(255,255,255,.08)}
aside button.nav.on{background:var(--accent);color:#fff}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:8px;border:1px solid rgba(255,255,255,.45);vertical-align:middle}
.dot.done{background:#6fbf9f;border-color:#6fbf9f}
aside .credit{font-size:.75rem;opacity:.6;padding:20px 10px 0}
main{flex:1;min-width:0;padding:18px clamp(14px,4vw,44px) 60px;max-width:920px}
.top{display:flex;align-items:center;gap:10px;margin-bottom:12px;position:sticky;top:0;background:var(--bg);padding:8px 0;z-index:5}
.burger{display:none;background:var(--accent);color:#fff;border:0;border-radius:8px;font-size:20px;padding:5px 12px;cursor:pointer}
.crumb{color:var(--muted);font-size:.9rem;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lang{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:5px 14px;cursor:pointer;font:inherit;font-size:.9rem;color:inherit}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px 22px;margin-bottom:14px}
.hero{background:linear-gradient(135deg,#2f6b5e,#243b36);color:#fff;border:0}
.hero p{opacity:.9}
.center{text-align:center}
h1{font-size:1.45rem;margin:.1rem 0 .3rem;line-height:1.3}
h2{font-size:1.1rem;margin:.2rem 0 .5rem;color:var(--accent)}
h2.q{color:var(--ink);font-size:1.15rem}
.te-title{color:var(--muted);font-size:1.05rem}
.muted{color:var(--muted)}
.hero .muted{color:#dfe9e4}
.tag{display:inline-block;font-size:.75rem;padding:2px 10px;border-radius:999px;background:#e9e4d4;color:var(--muted);margin:0 6px 6px 0}
.hook{background:#fbf1d6;border-left:4px solid var(--accent2);padding:10px 14px;border-radius:8px}
.chain{font-weight:600;color:var(--accent)}
ul,ol{padding-left:1.3rem;margin:.3rem 0}
li{margin-bottom:4px}
.btns{display:flex;justify-content:space-between;gap:10px;margin-top:8px;flex-wrap:wrap;align-items:center}
.btn{background:var(--accent);color:#fff;border:0;padding:10px 18px;border-radius:10px;cursor:pointer;font:inherit}
.btn.alt{background:#e9e4d4;color:var(--ink)}
.btn.wide{width:100%;margin-top:10px}
.btn[disabled]{opacity:.4;cursor:default}
.pick{font:inherit;padding:9px 10px;border-radius:10px;border:1px solid var(--line);background:#fff;max-width:100%;color:inherit}
.opt{display:block;width:100%;text-align:left;margin:8px 0;padding:11px 14px;border:1px solid var(--line);border-radius:10px;background:#fff;cursor:pointer;font:inherit;color:inherit}
.opt.right{border-color:var(--ok);background:#e6f4ea}
.opt.wrong{border-color:var(--bad);background:#f8e5e5}
.qhead{display:flex;justify-content:space-between;gap:8px;color:var(--muted);font-size:.9rem;flex-wrap:wrap}
.bar{height:8px;background:var(--line);border-radius:6px;overflow:hidden;margin:6px 0 12px}
.bar span{display:block;height:100%;background:var(--accent)}
textarea{width:100%;min-height:240px;font:inherit;padding:12px;border:1px solid var(--line);border-radius:10px;background:#fff;color:inherit}
.big{font-size:1.9rem;font-weight:700;color:var(--accent)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:14px}
.tile{display:flex;flex-direction:column;gap:2px;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;cursor:pointer;font:inherit;color:inherit}
.tile:hover{border-color:var(--accent)}
.ti{font-size:1.6rem}
.tl{border-left:3px solid var(--accent);padding-left:16px}
.tl div{margin-bottom:9px}
.tl div.ap{color:#1f5e3c;font-weight:600}
.tl b{color:var(--accent);display:inline-block;min-width:130px}
.list button{display:block;width:100%;text-align:left;background:#fff;border:1px solid var(--line);border-radius:10px;padding:11px 14px;margin:8px 0;font:inherit;cursor:pointer;color:inherit}
.flow{margin:10px 0}
.fl{display:flex;gap:12px;align-items:center;padding:8px 0;border-bottom:1px dashed var(--line)}
.fl .n{flex-shrink:0;width:30px;height:30px;border-radius:50%;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.85rem}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.chip{background:#fff;border:1px solid var(--accent);color:var(--accent);border-radius:999px;padding:8px 14px;font:inherit;cursor:pointer}
.chip.bad{border-color:var(--bad);background:#f8e5e5;color:var(--bad);animation:shake .3s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.badge{font-size:.72rem;padding:2px 8px;border-radius:999px;background:#e9e4d4;color:var(--muted);font-weight:400}
.badge.ok{background:#e6f4ea;color:var(--ok)}
details.dyn summary{cursor:pointer;list-style:none}
details.dyn summary::-webkit-details-marker{display:none}
details.dyn summary::before{content:"▸ ";color:var(--accent)}
details.dyn[open] summary::before{content:"▾ "}
table.kt{width:100%;border-collapse:collapse;font-size:.92rem;margin:8px 0;display:block;overflow-x:auto}
.kt th,.kt td{border-bottom:1px solid var(--line);padding:7px 8px;text-align:left;vertical-align:top}
.kt th{color:var(--muted);font-weight:600;font-size:.82rem}
.scrim{display:none}
@media (max-width:820px){
 aside{position:fixed;left:0;top:0;z-index:20;transform:translateX(-105%);transition:transform .25s;box-shadow:4px 0 20px rgba(0,0,0,.2)}
 body.menu-open aside{transform:none}
 body.menu-open .scrim{display:block;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:10}
 .burger{display:inline-block}
 body{font-size:16px}
 .card{padding:15px 16px}
}
</style>
</head>
<body>
<div class="app">
  <aside id="side"></aside>
  <div class="scrim" id="scrim"></div>
  <main>
    <div class="top">
      <button class="burger" id="burger" aria-label="Menu">☰</button>
      <div class="crumb" id="crumb"></div>
      <button class="lang" id="langBtn">తెలుగు</button>
    </div>
    <div id="view"></div>
  </main>
</div>
<script>
/* Chapter content: Indian history. C(id, intro, points, chain, hook, persons, places, mainsQ, mainsPoints) */
const CONTENT = {};
function C(id,intro,points,chain,hook,persons,places,mq,ma){CONTENT[id]={intro,points,chain,hook,persons,places,mq,ma};}

C('prehistory','The long period before writing, known from stone tools, cave paintings and bones. It is divided into the Palaeolithic (Old Stone Age), Mesolithic (Middle Stone Age) and Neolithic (New Stone Age).',
['Palaeolithic: hunting and gathering with hand axes and cleavers; sites include the Soan valley, Attirampakkam (Tamil Nadu) and the Kurnool caves (AP)',
 'Bhimbetka rock shelters (Madhya Pradesh) have prehistoric paintings and are a UNESCO World Heritage Site',
 'Mesolithic: small stone tools called microliths; early animal domestication at Bagor (Rajasthan) and Adamgarh (MP)',
 'Neolithic: farming and polished stone tools begin',
 'Mehrgarh (Baluchistan) has some of the earliest evidence of farming in the subcontinent',
 'Burzahom (Kashmir) is known for pit dwellings; Chirand (Bihar) for bone tools'],
'Hunting and gathering → microliths and first herding → farming, pottery and village life',
'“Old hunts, Middle shrinks, New farms” — Palaeo hunts, Meso tools shrink to microliths, Neo starts farming.',
'Not applicable (no written records)','Bhimbetka, Soan valley, Attirampakkam, Mehrgarh, Burzahom, Chirand, Kurnool caves',
'How did the Neolithic period change human life in the Indian subcontinent?',
['Intro: define the Neolithic as the age of farming and polished tools','Settled villages and food production (Mehrgarh)','Domestication of animals and pottery','Regional sites: Burzahom pit houses, Chirand bone tools, south Indian ash mounds','Conclusion: the base for later Chalcolithic and urban cultures']);

C('chalco','The Chalcolithic (copper–stone) age saw the first use of copper alongside stone. In the south, the Megalithic age is known for large stone burials and iron tools.',
['Chalcolithic cultures: Ahar–Banas (Rajasthan), Kayatha and Malwa (MP), Jorwe (Maharashtra)',
 'Inamgaon and Daimabad (Jorwe culture) are major sites; Daimabad is known for bronze figures',
 'Ochre Coloured Pottery (OCP) and copper hoards are found in the Ganga–Yamuna doab',
 'Painted Grey Ware (PGW) is linked with Later Vedic settlements',
 'Megaliths: burials marked by big stones, common in south India, with iron tools and Black-and-Red Ware',
 'Megalithic sites: Brahmagiri (Karnataka), Adichanallur (Tamil Nadu); many in Andhra and Telangana'],
'Copper with stone → rural farming villages → iron tools and megalithic burials in the south',
'“Copper first, Iron later, Big stones mark the grave.”',
'Not applicable','Ahar, Inamgaon, Daimabad, Navdatoli, Brahmagiri, Adichanallur',
'Describe the main features of the Megalithic culture of south India.',
['Intro: Megaliths as burial monuments of large stones','Iron tools and weapons','Black-and-Red Ware pottery','Spread across Andhra, Karnataka, Tamil Nadu, Kerala','Conclusion: link to the early historic and Sangam period']);

C('indus','A city-based Bronze Age civilisation in the north-west of the subcontinent. Harappa was among the first sites excavated, so it is also called the Harappan civilisation.',
['Mature phase about 2600–1900 BCE',
 'Harappa (on the Ravi) was excavated by Daya Ram Sahni in 1921; Mohenjo-daro (on the Indus) by R.D. Banerji in 1922',
 'Planned towns with grid roads, burnt-brick houses and covered drains',
 'Mohenjo-daro: Great Bath, granary, “dancing girl” bronze, “priest-king” figure',
 'Lothal (Gujarat): a dockyard; Kalibangan (Rajasthan): ploughed field, fire altars; Dholavira (Gujarat): water reservoirs, UNESCO site (2021)',
 'Standard weights, seals (unicorn motif) and trade with Mesopotamia (called Meluhha there)',
 'The script is not deciphered; iron and horses are not part of the mature phase'],
'Planned cities → drainage and trade → decline about 1900 BCE (climate, rivers shifting, trade decline)',
'“Grid, Drain, Trade” — the three things Harappans did best. The script is still a mystery: “Seal, no deal.”',
'Excavators: Daya Ram Sahni, R.D. Banerji, John Marshall','Harappa, Mohenjo-daro, Lothal, Kalibangan, Dholavira, Rakhigarhi',
'Discuss the town planning of the Harappan civilisation.',
['Intro: Harappan cities as the first urban centres of India','Grid layout, citadel and lower town','Drainage and burnt-brick houses','Public buildings: Great Bath, granaries, Lothal dockyard','Conclusion: shows strong civic administration']);

C('vedic','The period when the four Vedas were composed in Sanskrit. Early Vedic life (about 1500–1000 BCE) was mainly pastoral; Later Vedic life (about 1000–600 BCE) moved to settled farming in the Ganga plains.',
['Rigveda is the oldest Veda; it has 10 mandalas; the Gayatri mantra is in it',
 'Four Vedas: Rig, Sama (music), Yajur (rituals), Atharva (charms and medicine)',
 'Sabha and Samiti were assemblies; the king (rajan) was a tribal chief in early times',
 'Rigvedic gods: Indra, Agni, Varuna; cattle was the main wealth',
 'Later Vedic: iron (krishna ayas), larger kingdoms, varna became rigid, rituals grew',
 'Texts: Brahmanas, Aranyakas, Upanishads (philosophy); Satyameva Jayate is from the Mundaka Upanishad'],
'Rigvedic pastoral life → iron and farming in the Ganga plains → larger kingdoms (Mahajanapadas)',
'“R-S-Y-A” — Rig, Sama, Yajur, Atharva: the four Vedas in order.',
'Rishis such as Vishwamitra and Vasishtha','Sapta Sindhu region, then the Ganga plains',
'Compare the Early Vedic and Later Vedic periods.',
['Intro: two phases of the Vedic age','Economy: pastoral → agricultural with iron','Polity: tribal chief → territorial king','Society and religion: flexible → rigid varna, more rituals','Conclusion: laid the base for the Mahajanapadas']);

C('sixth','In the 6th century BCE, new teachers questioned costly Vedic rituals. Jainism and Buddhism grew in this period along with the sixteen Mahajanapadas.',
['Sixteen Mahajanapadas are listed in the Anguttara Nikaya; Magadha became the strongest',
 'Asmaka was the only Mahajanapada south of the Vindhyas, on the Godavari',
 'Mahavira (24th Tirthankara): born at Kundagrama near Vaishali; Rishabhanatha was the first Tirthankara',
 'Jain triratna: right faith, right knowledge, right conduct; five vows including ahimsa',
 'Buddha: born at Lumbini, enlightened at Bodh Gaya, first sermon at Sarnath, died (mahaparinirvana) at Kushinagara',
 'Four Noble Truths and the Eightfold Path (the Middle Path)',
 'Buddhist councils: 1st Rajagriha, 2nd Vaishali, 3rd Pataliputra (Ashoka), 4th Kashmir (Kanishka)',
 'Magadha rulers: Bimbisara and Ajatashatru (Haryanka), then Shishunagas and Nandas'],
'Costly rituals and social rigidity → new teachers → monks, monasteries and wide spread',
'Buddha’s life, L-B-S-K: “Lumbini Born, Bodh Gaya woke, Sarnath spoke, Kushinagara rest.” Councils, R-V-P-K: “Raja Visits Patna, Kashmir.”',
'Mahavira, Gautama Buddha, Bimbisara, Ajatashatru','Lumbini, Bodh Gaya, Sarnath, Kushinagara, Vaishali, Rajagriha',
'Why did Buddhism and Jainism spread rapidly in the 6th century BCE?',
['Intro: rise of new religious movements','Reaction against costly rituals and varna rigidity','Use of people’s languages (Pali, Prakrit)','Support of traders and kings','Conclusion: lasting effect on Indian ethics and art']);

C('maurya','The first large empire of India, founded by Chandragupta Maurya about 322 BCE, with its capital at Pataliputra.',
['Chandragupta Maurya defeated the Nandas with Kautilya’s help; he defeated Seleucus Nicator',
 'Megasthenes, the Greek envoy, wrote Indica about Pataliputra',
 'Kautilya’s Arthashastra is a text on statecraft',
 'Bindusara followed; then Ashoka (about 268–232 BCE)',
 'The Kalinga war (about 261 BCE) turned Ashoka to Dhamma',
 'Ashoka’s edicts are mostly in Brahmi script; Kharosthi in the north-west; Erragudi (Kurnool, AP) has Ashokan edicts',
 'Sarnath Lion Capital is India’s national emblem',
 'Last Mauryan ruler Brihadratha was killed by Pushyamitra Shunga (about 185 BCE)'],
'Chandragupta conquers → Bindusara → Ashoka’s Kalinga war → Dhamma and edicts → decline after Ashoka',
'“C-B-A” in order: Chandragupta, Bindusara, Ashoka. Kalinga = “Kill-then-kindness.”',
'Chandragupta Maurya, Kautilya, Bindusara, Ashoka, Megasthenes','Pataliputra, Kalinga, Sarnath, Erragudi',
'What was Ashoka’s Dhamma? How far did it help the empire?',
['Intro: Kalinga war as turning point','Dhamma as a moral code: tolerance, non-violence, respect for elders','Spread through edicts and Dhamma Mahamattas','Effect: unity of a diverse empire; critics link it to weak military','Conclusion: lasting ideal of welfare kingship']);

C('postmaurya','After the Mauryas, many dynasties ruled India: Shungas, Kanvas, Indo-Greeks, Shakas, Kushanas and Satavahanas, with the Sangam kingdoms in the far south.',
['Shungas: Pushyamitra Shunga (about 185 BCE); Kanvas followed',
 'Indo-Greeks: Menander (Milinda) discussed Buddhism with Nagasena (Milindapanho); first coins with king’s portraits',
 'Shakas: Rudradaman I’s Junagadh inscription is the first long inscription in Sanskrit; repaired Sudarshana lake',
 'Kushanas: Kanishka started the Saka era (78 CE), held the 4th Buddhist council; Mahayana grew',
 'Gandhara (Greek style) and Mathura (Indian style) art schools grew in this period',
 'Kharavela of Kalinga: Hathigumpha inscription at Udayagiri',
 'Sangam age: Cheras, Cholas and Pandyas; Karikala Chola; Sangam literature in Tamil'],
'Mauryan decline → foreign and local dynasties → trade, new art schools and Mahayana Buddhism',
'Foreigners in order, “I-S-K”: Indo-Greeks, Shakas, Kushanas — “I See Kings.”',
'Pushyamitra Shunga, Menander, Rudradaman, Kanishka, Kharavela, Karikala','Taxila, Mathura, Gandhara, Junagadh, Ujjain',
'Compare the Gandhara and Mathura schools of art.',
['Intro: both rose under the Kushanas','Gandhara: Greek-Roman style, grey schist, realistic Buddha','Mathura: Indian style, red sandstone, Buddhist, Jain and Hindu figures','Both helped create the Buddha image','Conclusion: a meeting of cultures']);

C('gupta','The Gupta period (about 320–550 CE) is often called the golden age of ancient India, for its literature, science and art.',
['Chandragupta I founded Gupta power (about 320 CE); married a Lichchhavi princess',
 'Samudragupta is praised in the Allahabad (Prayag) pillar inscription by Harisena; called the “Napoleon of India” by V.A. Smith',
 'Chandragupta II (Vikramaditya) defeated the Shakas; Fa-Hien visited in his reign',
 'Kumaragupta I is linked to the founding of Nalanda',
 'Skandagupta fought the Huns',
 'Aryabhata (Aryabhatiya), Varahamihira, Kalidasa (Abhijnana Shakuntalam)',
 'Vakatakas of the Deccan: Prabhavati Gupta (daughter of Chandragupta II) married into them; Ajanta caves partly of this time'],
'Samudragupta’s conquests → Chandragupta II’s expansion → science, literature and art flourish → Hun invasions weaken the empire',
'Order “C-S-C-K-S”: “Clever Samudra Chose Kind Skanda” — Chandragupta I, Samudragupta, Chandragupta II, Kumaragupta, Skandagupta.',
'Samudragupta, Chandragupta II, Kalidasa, Aryabhata, Fa-Hien','Pataliputra, Ujjain, Nalanda, Prayag pillar',
'Why is the Gupta period called the golden age?',
['Intro: political unity under strong kings','Literature: Kalidasa and Sanskrit','Science: Aryabhata, Varahamihira','Art and temples: Deogarh, Ajanta influence','Conclusion: golden for culture, though trade and towns declined later']);

C('postgupta','After the Guptas, power was divided. Harsha ruled the north; the Chalukyas of Badami and the Pallavas of Kanchi ruled the south.',
['Harsha (606–647 CE) of the Pushyabhuti dynasty moved his capital from Thanesar to Kanauj',
 'Banabhatta wrote Harshacharita; Hiuen Tsang visited Harsha and also Andhra',
 'Harsha was defeated by Pulakesin II on the Narmada',
 'Badami Chalukyas: Pulakesin II; Aihole inscription by Ravikirti',
 'Pallavas: Mahendravarman I, Narasimhavarman I (Mamalla) built Mahabalipuram rathas',
 'Kubja Vishnuvardhana, brother of Pulakesin II, founded the Eastern Chalukyas of Vengi (624 CE)'],
'Gupta collapse → regional kingdoms → Chalukya–Pallava rivalry in the south',
'“Harsha North, Pulakesin Narmada, Pallava sea-shore.”',
'Harsha, Banabhatta, Hiuen Tsang, Pulakesin II, Narasimhavarman I','Kanauj, Thanesar, Badami, Aihole, Kanchi, Mahabalipuram',
'Assess Harsha’s reign with the help of Hiuen Tsang’s account.',
['Intro: Harsha as the last great king of north India before the Rajputs','Administration and charity (Prayag assembly)','Support to Buddhism and Nalanda','Limits: defeat by Pulakesin II','Conclusion: important but not all-India']);

C('earlymed','From about 750 to 1200 CE, the Palas, Pratiharas and Rashtrakutas fought over Kanauj, while the Cholas built a strong empire in the south and Turkish invasions began.',
['Tripartite struggle for Kanauj: Palas (Bengal), Gurjara-Pratiharas (Rajasthan), Rashtrakutas (Deccan)',
 'Palas: Gopala (elected), Dharmapala founded Vikramashila university',
 'Rashtrakutas: Dantidurga founded; Krishna I built the Kailasa temple at Ellora; Amoghavarsha wrote Kavirajamarga (Kannada)',
 'Cholas: Rajaraja I built the Brihadeeswara temple (Thanjavur); Rajendra I took a naval expedition to South-East Asia',
 'Uttaramerur inscriptions (Parantaka I) describe village self-government',
 'Mahmud of Ghazni raided India 17 times; Somnath in 1025',
 'Muhammad Ghori: lost the First Battle of Tarain (1191), won the second (1192) against Prithviraj Chauhan'],
'Kanauj contest → regional powers weaken each other → Turkish invasions succeed',
'Tripartite = “P-P-R: Palas, Pratiharas, Rashtrakutas — Pull, Push, Rule over Kanauj.”',
'Dharmapala, Krishna I, Amoghavarsha, Rajaraja I, Rajendra I, Mahmud of Ghazni, Prithviraj Chauhan','Kanauj, Ellora, Thanjavur, Gangaikondacholapuram, Tarain',
'Describe the local self-government of the Cholas.',
['Intro: Chola administration','Ur, Sabha and Nagaram assemblies','Uttaramerur inscriptions: election by lots (kudavolai)','Committees (variyams) for tanks, gardens, justice','Conclusion: an early model of grassroots democracy']);

C('c13','The Delhi Sultanate began in 1206. The Slave (Mamluk), Khalji and Tughlaq dynasties ruled most of the 13th and 14th centuries.',
['Qutbuddin Aibak (1206) founded the Slave dynasty; began the Qutb Minar',
 'Iltutmish: iqta system, silver tanka and copper jital, group of forty (Chahalgani)',
 'Razia Sultan was the first and only woman ruler of Delhi',
 'Balban: “blood and iron” policy, sijda and paibos',
 'Alauddin Khalji: market reforms, branding of horses (dagh), large army; Malik Kafur’s campaigns in the south, including Warangal',
 'Muhammad bin Tughlaq: moved capital to Daulatabad, token currency; his general Ulugh Khan took Warangal in 1323',
 'Firoz Shah Tughlaq: canals, jizya as a separate tax'],
'Turkish conquest → strong central control (Balban, Alauddin) → over-reach under Muhammad bin Tughlaq',
'Five Sultanate dynasties, “S-K-T-S-L”: “Some Kings Took Sweet Lassi” — Slave, Khalji, Tughlaq, Sayyid, Lodi.',
'Aibak, Iltutmish, Razia, Balban, Alauddin Khalji, Muhammad bin Tughlaq, Firoz Shah','Delhi, Daulatabad, Warangal',
'Evaluate the market reforms of Alauddin Khalji.',
['Intro: need for a large army at low cost','Fixed prices of grain and goods; separate markets','Officers (shahna-i-mandi) and spies','Effect: stable prices; ended after his death','Conclusion: bold but tied to one ruler']);

C('c14','The late 14th and 15th centuries saw the Delhi Sultanate weaken, Timur’s invasion, the Sayyids and Lodis, and the rise of regional kingdoms like the Bahmanis and Vijayanagara.',
['Timur invaded and sacked Delhi in 1398',
 'Sayyids (1414–1451), then Lodis: Bahlul Lodi, Sikandar Lodi (founded Agra, 1504), Ibrahim Lodi',
 'Ibrahim Lodi lost to Babur at the First Battle of Panipat (1526)',
 'Bahmani kingdom founded in 1347 by Alauddin Hasan Bahman Shah; minister Mahmud Gawan',
 'The Bahmani kingdom split into five Deccan Sultanates: Bijapur, Golconda, Ahmadnagar, Berar, Bidar',
 'Regional kingdoms: Bengal, Gujarat, Malwa, Kashmir (Zain-ul-Abidin, “Budshah”), Mewar (Rana Kumbha’s Vijay Stambha)',
 'Vijayanagara was founded in 1336 (see AP chapter)'],
'Tughlaq decline → Timur’s blow → regional kingdoms rise → Babur’s entry in 1526',
'Five Deccan Sultanates, “B-G-A-B-B”: Bijapur, Golconda, Ahmadnagar, Berar, Bidar.',
'Timur, Sikandar Lodi, Ibrahim Lodi, Mahmud Gawan, Zain-ul-Abidin, Rana Kumbha','Delhi, Agra, Gulbarga, Bidar, Golconda',
'Why did the Bahmani kingdom break up?',
['Intro: founding in 1347','Conflict between Deccanis and Afaqis (newcomers)','Execution of Mahmud Gawan (1481)','Wars with Vijayanagara','Conclusion: split into five Deccan Sultanates']);

C('mughal','The Mughal empire began with Babur’s victory at Panipat in 1526 and reached its height under Akbar, Jahangir, Shah Jahan and Aurangzeb.',
['Babur: Panipat I (1526), Khanwa (1527) against Rana Sanga; wrote Baburnama in Turki',
 'Humayun lost to Sher Shah at Chausa (1539) and Kannauj (1540); returned in 1555',
 'Sher Shah Suri: rupiya coin, Grand Trunk Road, land survey',
 'Akbar: Panipat II (1556); mansabdari system; abolished jizya (1564); Ibadat Khana at Fatehpur Sikri; Din-i-Ilahi (1582); Todar Mal’s land revenue (zabt)',
 'Jahangir: Nur Jahan’s influence; Thomas Roe visited his court',
 'Shah Jahan: Taj Mahal, Red Fort, Peacock Throne',
 'Aurangzeb: reimposed jizya (1679); annexed Bijapur (1686) and Golconda (1687); died in 1707'],
'Babur founds → Akbar builds the system → Shah Jahan’s splendour → Aurangzeb’s over-reach → decline after 1707',
'Six great Mughals, “B-H-A-J-S-A”: “Black Horse Ate Juicy Sweet Apples” — Babur, Humayun, Akbar, Jahangir, Shah Jahan, Aurangzeb.',
'Babur, Humayun, Sher Shah, Akbar, Jahangir, Nur Jahan, Shah Jahan, Aurangzeb','Panipat, Agra, Fatehpur Sikri, Delhi',
'Explain the mansabdari system of Akbar.',
['Intro: need for a graded nobility','Zat (rank) and sawar (horsemen)','Payment by jagir; transfers to stop local power','Merits and weaknesses','Conclusion: backbone of Mughal administration']);

C('maratha','The Marathas under Shivaji and the Peshwas, and the Sikhs under their Gurus and Ranjit Singh, became major powers as the Mughals declined.',
['Shivaji crowned at Raigad in 1674; Treaty of Purandar (1665) with Jai Singh',
 'Ashtapradhan (council of eight ministers); chauth (one-fourth) and sardeshmukhi (one-tenth) taxes',
 'Peshwas: Balaji Vishwanath, Baji Rao I, Balaji Baji Rao (Nana Saheb)',
 'Third Battle of Panipat (1761): Marathas lost to Ahmad Shah Abdali',
 'Sikh Gurus: Nanak (founder), Angad (Gurmukhi), Arjan (compiled Adi Granth, 1604), Tegh Bahadur (executed 1675), Gobind Singh (Khalsa, 1699)',
 'Ranjit Singh built the Sikh kingdom of Punjab; Treaty of Amritsar (1809) with the British'],
'Mughal pressure → Maratha and Sikh resistance → regional power → defeat by Abdali (Marathas) and British (both)',
'Ten Sikh Gurus: “Nanak Angad Amar Ram, Arjan Hargobind Har Rai, Har Krishan Tegh Gobind.” Say it as a rhythm.',
'Shivaji, Baji Rao I, Guru Nanak, Guru Arjan, Guru Gobind Singh, Ranjit Singh','Raigad, Pune, Panipat, Amritsar, Lahore',
'Describe the administration of Shivaji.',
['Intro: founding of the Maratha state','Ashtapradhan council','Revenue: chauth and sardeshmukhi; ryotwari-like assessment','Forts and navy','Conclusion: strong, centralised and people-oriented']);

C('bhakti','The Bhakti movement stressed personal devotion to God over rituals and caste. Sufism was its mystical Islamic counterpart. Both brought people together across religions.',
['Started with the Alvars (Vishnu) and Nayanars (Shiva) in Tamil Nadu',
 'Philosophers: Ramanuja (Vishishtadvaita), Madhva (Dvaita), Basavanna (Virashaiva, Anubhava Mantapa)',
 'North India: Kabir (dohas), Ravidas, Guru Nanak, Tulsidas (Ramcharitmanas), Surdas, Mirabai',
 'Bengal: Chaitanya; Assam: Shankaradeva; Maharashtra: Jnaneshwar, Namdev, Tukaram',
 'Andhra: Annamacharya (Tallapaka) and Vemana',
 'Sufi orders (silsilas): Chishti (Moinuddin at Ajmer, Nizamuddin Auliya at Delhi), Suhrawardi (Multan), Naqshbandi, Qadiri',
 'Amir Khusrau, disciple of Nizamuddin Auliya, wrote in Persian and Hindavi'],
'Ritual and caste rigidity → devotion in people’s languages → social harmony and new literature',
'“Kabir Weaves, Mira Sings, Tulsi Writes Rama, Nanak Unites.”',
'Ramanuja, Basavanna, Kabir, Guru Nanak, Mirabai, Tulsidas, Chaitanya, Moinuddin Chishti, Nizamuddin Auliya','Ajmer, Delhi, Varanasi, Pandharpur, Puri',
'How did the Bhakti and Sufi movements shape medieval Indian society?',
['Intro: two devotional streams','Use of regional languages and growth of literature','Challenge to caste and ritual','Hindu–Muslim cultural meeting','Conclusion: lasting tradition of tolerance']);

C('c18','After Aurangzeb’s death in 1707, the Mughal empire weakened and successor states rose. Foreign invasions by Nadir Shah and Ahmad Shah Abdali drained Delhi.',
['Successor states: Hyderabad (Nizam-ul-Mulk, 1724), Awadh (Saadat Khan), Bengal (Murshid Quli Khan)',
 'Mysore rose under Haidar Ali and Tipu Sultan',
 'Nadir Shah invaded in 1739 and took the Peacock Throne and Koh-i-noor',
 'Ahmad Shah Abdali invaded many times; defeated the Marathas at Panipat (1761)',
 'Rajput states, Jats (Suraj Mal) and Sikhs also became independent',
 'Debate: decline was due to weak successors, jagirdari crisis, wars and invasions'],
'Weak successors and jagir crisis → provinces break away → invasions → space for the British',
'Successor states “H-A-B”: Hyderabad, Awadh, Bengal — “Has All Broken.”',
'Nizam-ul-Mulk, Saadat Khan, Murshid Quli Khan, Nadir Shah, Ahmad Shah Abdali','Delhi, Hyderabad, Lucknow, Murshidabad',
'What were the causes of the decline of the Mughal empire?',
['Intro: 1707 as turning point','Weak successors and court factions','Jagirdari crisis and finances','Revolts and invasions (Nadir Shah)','Conclusion: decline opened the door for the British']);

C('europeans','European traders came to India by sea from 1498. The Portuguese, Dutch, English, Danes and French set up trading posts and fought each other.',
['Vasco da Gama reached Calicut in 1498',
 'Albuquerque captured Goa in 1510',
 'Dutch East India Company (VOC) formed 1602; factory at Masulipatnam (1605)',
 'English East India Company formed 1600; factory at Masulipatnam (1611) and Surat (1613)',
 'Danes at Tranquebar (1620); French East India Company 1664, Pondicherry (1674)',
 'Carnatic Wars (1746–1763) between the English and French; Battle of Wandiwash (1760) ended French hopes'],
'Sea route → trading posts → rivalry → English victory over the French',
'Arrival order “P-D-E-D-F”: “Please Don’t Eat Dry Fish” — Portuguese, Dutch, English, Danes, French.',
'Vasco da Gama, Albuquerque, Dupleix, Robert Clive, Eyre Coote','Calicut, Goa, Masulipatnam, Surat, Pondicherry, Madras',
'Why did the English succeed over the French in India?',
['Intro: Carnatic Wars','Stronger navy and finance','Company structure and home support','Leadership (Clive vs recalled Dupleix)','Conclusion: Wandiwash settled the contest']);

C('britraj','The British took political power through battles at Plassey and Buxar and wars against Mysore, the Marathas and the Sikhs.',
['Battle of Plassey (1757): Clive defeated Siraj-ud-Daulah',
 'Battle of Buxar (1764): defeated Mir Qasim, Shuja-ud-Daulah and Shah Alam II',
 'Treaty of Allahabad (1765): the Company got the Diwani (revenue rights) of Bengal; dual government',
 'Four Anglo-Mysore wars (1767–1799): Tipu Sultan died at Srirangapatna (1799)',
 'Three Anglo-Maratha wars (1775–1818)',
 'Two Anglo-Sikh wars; Punjab annexed in 1849'],
'Plassey → Buxar → Diwani → wars with Mysore, Marathas, Sikhs → British paramountcy',
'“Plassey Planted, Buxar Built” — Plassey began British rule, Buxar made it firm.',
'Robert Clive, Siraj-ud-Daulah, Mir Jafar, Tipu Sultan, Haidar Ali','Plassey, Buxar, Srirangapatna',
'Why is Buxar more important than Plassey?',
['Intro: two battles','Plassey won by conspiracy','Buxar won against three powers by arms','Led to Diwani of Bengal','Conclusion: Buxar made British power real']);

C('consol','The British strengthened their rule through policies like the Subsidiary Alliance and Doctrine of Lapse, and through Acts that organised the government.',
['Regulating Act 1773: Warren Hastings became Governor-General of Bengal; Supreme Court at Calcutta',
 'Pitt’s India Act 1784: Board of Control',
 'Wellesley’s Subsidiary Alliance (1798): Hyderabad was the first to accept',
 'Dalhousie’s Doctrine of Lapse: Satara (1848), Jhansi, Nagpur; Awadh annexed (1856) for misgovernance',
 'Charter Act 1813: ₹1 lakh for education; 1833: Governor-General of India (Bentinck)',
 'Macaulay’s Minute (1835) and Wood’s Despatch (1854) on English education',
 'Cornwallis organised the civil services and police'],
'Treaties and annexations → paramountcy → administrative Acts → resentment that fed 1857',
'Policies by man: “Wellesley Subsidised, Dalhousie Lapsed.”',
'Warren Hastings, Cornwallis, Wellesley, Bentinck, Dalhousie, Macaulay','Calcutta, Hyderabad, Satara, Jhansi, Awadh',
'How did the Subsidiary Alliance help expand British rule?',
['Intro: Wellesley’s policy','Terms: British troops, resident, no other Europeans','Effect on Indian states: loss of independence, financial burden','Hyderabad as first, Mysore and Awadh follow','Conclusion: expansion without war']);

C('econ','British economic policies changed land, trade and industry, and drained wealth from India.',
['Permanent Settlement (1793, Cornwallis) in Bengal: fixed revenue with zamindars',
 'Ryotwari system (Thomas Munro, Alexander Read) in Madras: revenue directly from peasants',
 'Mahalwari system (Holt Mackenzie) in north-west India: village as unit',
 'Drain of wealth theory: Dadabhai Naoroji, “Poverty and Un-British Rule in India”',
 'Deindustrialisation: decline of handloom and crafts due to British machine goods',
 'First railway: Bombay to Thane (1853); railways served raw-material export',
 'Frequent famines; famine commissions'],
'Revenue pressure → peasant debt and famines; British goods → decline of crafts; export surplus → drain',
'Land systems: “P-R-M” — Permanent (Bengal), Ryotwari (Madras), Mahalwari (North-West).',
'Cornwallis, Thomas Munro, Dadabhai Naoroji, R.C. Dutt','Bengal, Madras, Bombay',
'Explain the Drain of Wealth theory.',
['Intro: Dadabhai Naoroji and R.C. Dutt','Home charges, salaries and pensions sent to Britain','Export surplus without return','Effects: poverty and lack of capital','Conclusion: economic basis of nationalism']);

C('reform','In the 19th century, Indian reformers worked against social evils like sati, child marriage and caste discrimination, and for education and women’s rights.',
['Raja Ram Mohan Roy: Brahmo Samaj (1828); sati abolished by Bentinck (1829)',
 'Ishwar Chandra Vidyasagar: Hindu Widow Remarriage Act (1856)',
 'Dayananda Saraswati: Arya Samaj (1875), Satyarth Prakash, “Go back to the Vedas”',
 'Swami Vivekananda: Chicago speech (1893), Ramakrishna Mission (1897)',
 'Jyotiba Phule: Satyashodhak Samaj (1873), Gulamgiri; with Savitribai Phule, schools for girls',
 'Sir Syed Ahmad Khan: Aligarh (MAO College, 1875); Theosophical Society (1875), at Adyar from 1886',
 'Narayana Guru (Kerala, SNDP 1903); Periyar (Self-Respect Movement, 1925)'],
'Social evils and new ideas → reform movements → confidence and national awakening',
'Year pairs: “1828 Brahmo, 1875 Arya, 1897 Mission.”',
'Ram Mohan Roy, Vidyasagar, Dayananda, Vivekananda, Jyotiba Phule, Sir Syed, Narayana Guru','Calcutta, Bombay, Aligarh, Adyar',
'Assess the contribution of Raja Ram Mohan Roy.',
['Intro: “father of modern India”','Brahmo Samaj and monotheism','Campaign against sati','Support for English and scientific education, press','Conclusion: pioneer of reform']);

C('revolts','Peasants and tribal people revolted many times against British policies, landlords and moneylenders.',
['Sanyasi–Fakir revolt in Bengal (late 18th century)',
 'Paika rebellion in Odisha (1817)',
 'Santhal Hul (1855–56): led by Sidhu and Kanhu',
 'Munda Ulgulan (1899–1900): Birsa Munda',
 'Indigo revolt (1859–60) in Bengal; play Neel Darpan by Dinabandhu Mitra',
 'Deccan riots (1875) against moneylenders',
 'Rampa rebellions in Andhra (1879; 1922–24 under Alluri Sitarama Raju)'],
'Land loss and forest laws → exploitation → revolts → laws and later mass movements',
'“S-M-I”: Santhal, Munda, Indigo — the three most asked.',
'Sidhu, Kanhu, Birsa Munda, Alluri Sitarama Raju','Bengal, Jharkhand, Odisha, Rampa (AP)',
'Why did tribal revolts break out under British rule?',
['Intro: tribal life and land','Forest laws and loss of land','Moneylenders and outsiders (dikus)','Religious and cultural interference','Conclusion: early resistance to colonial rule']);

C('r1857','The Revolt of 1857 began at Meerut and spread over north and central India. It ended Company rule.',
['Mangal Pandey at Barrackpore (29 March 1857)',
 'The revolt began at Meerut on 10 May 1857; rebels declared Bahadur Shah Zafar emperor',
 'Leaders: Nana Saheb and Tatya Tope (Kanpur), Rani Lakshmibai (Jhansi), Begum Hazrat Mahal (Lucknow), Kunwar Singh (Bihar)',
 'Immediate cause: greased Enfield rifle cartridges',
 'Governor-General at the time: Lord Canning',
 'Government of India Act 1858: rule passed to the Crown; Queen Victoria’s Proclamation (1 November 1858)'],
'Annexations, economic distress, army grievances → cartridges spark → revolt → Crown rule',
'Leaders by place: “Kanpur Nana, Jhansi Rani, Lucknow Begum, Bihar Kunwar.”',
'Mangal Pandey, Bahadur Shah Zafar, Nana Saheb, Tatya Tope, Rani Lakshmibai, Begum Hazrat Mahal, Kunwar Singh','Meerut, Delhi, Kanpur, Jhansi, Lucknow',
'Was the Revolt of 1857 the first war of independence?',
['Intro: different views','Arguments for: wide participation, Hindu–Muslim unity','Arguments against: limited area, no common aim, princes stayed loyal','Results: Crown rule, army reorganised','Conclusion: a major uprising that inspired later nationalism']);

C('nm1','From 1857 to 1915, the national movement grew from moderate petitions to the Swadeshi movement and revolutionary activity.',
['Indian National Congress founded 1885 at Bombay; first president W.C. Bonnerjee; A.O. Hume helped',
 'Moderates (Dadabhai Naoroji, Gokhale, Pherozeshah Mehta): petitions and reforms',
 'Extremists: Lal–Bal–Pal (Lala Lajpat Rai, Bal Gangadhar Tilak, Bipin Chandra Pal)',
 'Partition of Bengal (16 October 1905, Curzon) → Swadeshi and boycott',
 'Muslim League founded at Dhaka (1906); Surat split (1907)',
 'Morley–Minto reforms (1909): separate electorates for Muslims',
 'Partition annulled and capital moved to Delhi (1911); Ghadar Party (1913)'],
'Economic critique → moderate politics → partition of Bengal → Swadeshi and extremism → split and repression',
'“1885 born, 1905 torn, 1907 split, 1911 refit.”',
'W.C. Bonnerjee, Dadabhai Naoroji, Gokhale, Tilak, Lajpat Rai, Bipin Chandra Pal, Curzon','Bombay, Calcutta, Dhaka, Surat',
'Assess the contribution of the Moderates.',
['Intro: early Congress','Economic critique and drain theory','Political education and demands','Limits: elite base, petitions','Conclusion: laid the base for mass nationalism']);

C('nm2','From 1915 to 1947, Gandhi led mass movements that brought independence, alongside revolutionary and constitutional streams.',
['Gandhi returned from South Africa (1915): Champaran (1917), Kheda (1918), Ahmedabad mill strike (1918)',
 'Rowlatt Act and Jallianwala Bagh massacre (13 April 1919)',
 'Non-Cooperation and Khilafat (1920–22), withdrawn after Chauri Chaura (February 1922)',
 'Simon Commission (1928), Nehru Report (1928), Purna Swaraj at Lahore (1929)',
 'Civil Disobedience: Dandi March (12 March–6 April 1930), Gandhi–Irwin Pact (1931), Poona Pact (1932)',
 'Government of India Act 1935; Cripps Mission (1942); Quit India (8 August 1942)',
 'INA (Subhas Chandra Bose); Cabinet Mission (1946); Mountbatten Plan (3 June 1947); independence 15 August 1947'],
'Gandhi’s local satyagrahas → NCM → CDM → Quit India → negotiations → independence and partition',
'Gandhi’s big three “N-C-Q” every ~10 years: Non-Cooperation 1920, Civil Disobedience 1930, Quit India 1942.',
'Gandhi, Nehru, Patel, Subhas Chandra Bose, Bhagat Singh, Ambedkar, Jinnah','Champaran, Amritsar, Dandi, Lahore, Bombay',
'Evaluate the role of the Civil Disobedience Movement.',
['Intro: Purna Swaraj and the Salt March','Mass participation, including women','Boycott, no-tax and forest satyagraha','Gandhi–Irwin Pact and Round Table Conferences','Conclusion: brought the national movement to villages']);

C('facts','This chapter gathers the facts often asked in exams: newspapers, press laws, Congress sessions, commissions and Governors-General.',
['Hicky’s Bengal Gazette (1780) was the first newspaper in India',
 'Tilak: Kesari (Marathi) and Mahratta (English); Gandhi: Young India and Harijan',
 'Vernacular Press Act (1878) under Lytton; repealed by Ripon (1882)',
 'Congress sessions: 1887 Madras (Badruddin Tyabji, first Muslim president), 1917 Calcutta (Annie Besant, first woman), 1924 Belgaum (Gandhi), 1925 Kanpur (Sarojini Naidu, first Indian woman), 1929 Lahore (Nehru, Purna Swaraj), 1931 Karachi (Patel, Fundamental Rights resolution), 1938 Haripura and 1939 Tripuri (Bose)',
 'First Governor-General of Bengal: Warren Hastings; of India: William Bentinck; first Viceroy: Canning; last Viceroy: Mountbatten',
 'C. Rajagopalachari: first and last Indian Governor-General',
 'Ripon: local self-government (1882), called the father of local self-government in India'],
'Key facts are best learnt as pairs: person + year + event',
'First firsts: “Hastings–Bengal, Bentinck–India, Canning–Viceroy.”',
'Warren Hastings, Bentinck, Canning, Ripon, Lytton, Curzon, Mountbatten, Rajagopalachari','Calcutta, Madras, Lahore, Karachi',
'How did the Indian press contribute to the national movement?',
['Intro: rise of Indian newspapers','Spread of political ideas and criticism','Role of Kesari, Amrita Bazar Patrika, The Hindu','British repression: Vernacular Press Act','Conclusion: press as a tool of awakening']);

C('postind','After 1947, India integrated princely states, adopted a Constitution, reorganised states and built its economy and foreign policy.',
['Integration of princely states by Sardar Patel and V.P. Menon; Junagadh, Hyderabad (Operation Polo, September 1948) and Kashmir (Instrument of Accession, 26 October 1947)',
 'Constitution adopted 26 November 1949, came into force 26 January 1950',
 'First general election 1951–52; First Five Year Plan 1951',
 'States Reorganisation Commission (Fazl Ali) and Act of 1956',
 'Panchsheel (1954); Non-Aligned Movement (Belgrade, 1961)',
 'Wars: 1962 (China), 1965 (Pakistan; Tashkent 1966), 1971 (Bangladesh; Simla Agreement 1972)',
 'Green Revolution, bank nationalisation (1969), Emergency (1975–77), Pokhran tests (1974, 1998), economic reforms (1991)'],
'Integration → Constitution → planning and reorganisation → wars and reforms',
'“Integrate, Constitute, Reorganise, Liberalise” — the four big steps after 1947.',
'Sardar Patel, V.P. Menon, Nehru, Ambedkar, Lal Bahadur Shastri, Indira Gandhi, P.V. Narasimha Rao','Hyderabad, Junagadh, Kashmir, Pokhran',
'Discuss the integration of princely states after independence.',
['Intro: 560-plus princely states','Instrument of Accession and Standstill Agreement','Difficult cases: Junagadh, Hyderabad, Kashmir','Role of Patel and V.P. Menon','Conclusion: political unity of India']);

/* Chapter content: Art and Culture */
C('caves','India’s art history runs from rock-cut caves to great temples and Indo-Islamic buildings. Temple styles are Nagara (north), Dravida (south) and Vesara (mixed, Deccan).',
['Barabar caves (Bihar): Mauryan, given to the Ajivikas',
 'Ajanta (Maharashtra): Buddhist caves with famous paintings; Ellora: Buddhist, Hindu and Jain caves, with the Kailasa temple (Rashtrakuta Krishna I)',
 'Elephanta (near Mumbai): Trimurti (Maheshamurti) sculpture; Udayagiri–Khandagiri (Odisha): Jain caves',
 'Undavalli caves (Guntur, AP) are rock-cut caves',
 'Nagara: Khajuraho (Chandelas), Konark Sun Temple (Narasimhadeva I, Eastern Ganga); Dravida: Brihadeeswara (Rajaraja I), Mahabalipuram (Pallavas)',
 'Vesara: Hoysala temples at Belur and Halebidu (UNESCO, 2023)',
 'Lepakshi Veerabhadra temple (Anantapur, AP) is known for Vijayanagara paintings and the hanging pillar',
 'Indo-Islamic: Qutb Minar, Humayun’s Tomb, Taj Mahal; Golconda fort and Charminar (Qutb Shahi)'],
'Rock-cut caves → structural temples → regional styles → Indo-Islamic synthesis',
'Temple styles by direction: “Nagara North, Dravida Down-south, Vesara in-between.”',
'Krishna I, Rajaraja I, Narasimhadeva I, Shah Jahan','Ajanta, Ellora, Elephanta, Khajuraho, Konark, Thanjavur, Lepakshi, Undavalli',
'Compare the Nagara and Dravida styles of temple architecture.',
['Intro: two main styles','Nagara: curved shikhara, no boundary wall','Dravida: pyramid vimana, gopuram, enclosure wall','Examples of each','Conclusion: Vesara as a blend']);

C('music','Indian classical music has two traditions: Hindustani (north) and Carnatic (south). Its roots are traced to the Samaveda.',
['Hindustani forms: Dhrupad (oldest), Khayal, Thumri, Tappa, Ghazal',
 'Tansen was in Akbar’s court; Amir Khusrau is linked by tradition to Qawwali and new ragas',
 'Carnatic music is based on kritis; Purandara Dasa is called the father of Carnatic music',
 'Carnatic trinity: Tyagaraja, Muthuswami Dikshitar, Syama Sastri',
 'Tyagaraja composed mainly in Telugu; Annamacharya composed thousands of Telugu sankirtanas',
 'Instruments: veena, sitar, sarod, tabla, mridangam, nadaswaram; Bobbili veena (AP) has a GI tag'],
'Samaveda chant → regional styles → two classical traditions',
'Carnatic trinity “T-D-S”: “Telugu Daily Sings” — Tyagaraja, Dikshitar, Syama Sastri.',
'Tansen, Amir Khusrau, Purandara Dasa, Tyagaraja, Annamacharya','Tanjore, Tirupati, Gwalior',
'Compare Hindustani and Carnatic music.',
['Intro: common roots','Hindustani: Persian influence, improvisation, gharanas','Carnatic: composition-based, devotional kritis','Instruments and forms','Conclusion: two branches of one tree']);

C('dance','India has eight classical dances recognised by the Sangeet Natak Akademi, each from a region, plus many folk dances.',
['Bharatanatyam (Tamil Nadu), Kathak (north India), Kathakali (Kerala), Kuchipudi (Andhra Pradesh)',
 'Odissi (Odisha), Manipuri (Manipur), Mohiniyattam (Kerala), Sattriya (Assam)',
 'Kuchipudi is named after a village in Krishna district; Siddhendra Yogi shaped it',
 'Natya Shastra by Bharata Muni is the basic text on dance and drama',
 'Folk dances of AP: Dhimsa (tribal, Araku), Kolatam, Butta Bommalu; Telangana: Perini Shivatandavam',
 'Kathak was shaped in Mughal and Lucknow courts'],
'Temple ritual and Natya Shastra → regional classical styles → modern revival',
'Eight dances, “B-K-K-K-O-M-M-S”: “Big Kites Keep Kids Outdoors, Mother Makes Snacks.”',
'Bharata Muni, Siddhendra Yogi, Rukmini Devi Arundale','Kuchipudi, Thanjavur, Lucknow, Kerala, Manipur, Assam',
'Describe the features of Kuchipudi.',
['Intro: classical dance of AP','Origin in Kuchipudi village, Siddhendra Yogi','Dance-drama with speech and song','Tarangam on a brass plate','Conclusion: Telugu cultural identity']);

C('crafts','Indian handicrafts are linked to regions and many have Geographical Indication (GI) tags.',
['Kalamkari (Srikalahasti and Machilipatnam, AP): hand-painted or block-printed cloth',
 'Kondapalli toys (AP) of light wood; Etikoppaka lacquer toys (AP)',
 'Pochampally ikat (Telangana); Bidriware (Bidar, Karnataka); Channapatna toys (Karnataka)',
 'Madhubani (Bihar), Warli (Maharashtra), Pattachitra (Odisha) paintings',
 'Dhokra: lost-wax metal casting by tribal artisans',
 'Banarasi and Kanchipuram silks; Pashmina (Kashmir)'],
'Local skill and materials → regional identity → GI tags protect them',
'AP crafts “K-K-E”: Kalamkari, Kondapalli, Etikoppaka.',
'Not applicable','Srikalahasti, Machilipatnam, Kondapalli, Etikoppaka, Pochampally, Bidar',
'Why are GI tags important for Indian handicrafts?',
['Intro: what a GI tag is','Protects names from copying','Helps artisans earn more','Promotes tourism and exports','Conclusion: preserves heritage']);

C('theatre','India has classical Sanskrit drama and many folk theatre forms tied to regions.',
['Sanskrit drama: Kalidasa, Bhasa, Shudraka (Mrichchhakatika)',
 'Koodiyattam (Kerala) is a Sanskrit theatre form on the UNESCO intangible heritage list',
 'Yakshagana (Karnataka), Jatra (Bengal), Nautanki (Uttar Pradesh), Tamasha (Maharashtra), Bhavai (Gujarat)',
 'Ramlila is on the UNESCO intangible heritage list',
 'AP and Telangana: Burrakatha (story with drums), Veedhi Natakam (street play), Harikatha',
 'Surabhi drama troupes kept Telugu stage drama alive'],
'Sanskrit drama → regional folk forms → modern stage',
'Theatre by state: “Yaksha-Karnataka, Jatra-Bengal, Tamasha-Maharashtra, Burra-Andhra.”',
'Kalidasa, Bhasa, Shudraka','Kerala, Karnataka, Bengal, Andhra',
'Discuss the role of folk theatre in spreading social messages.',
['Intro: folk theatre forms','Use in freedom movement (Burrakatha)','Literacy and health campaigns','Threats from modern media','Conclusion: needs support']);

C('puppet','India has four types of puppetry: string, shadow, rod and glove.',
['String: Kathputli (Rajasthan), Kundhei (Odisha), Bommalattam (Tamil Nadu)',
 'Shadow: Tholu Bommalata (Andhra Pradesh), Togalu Gombeyaata (Karnataka), Ravanachhaya (Odisha)',
 'Rod: Putul Nachh (West Bengal)',
 'Glove: Pavakoothu (Kerala)',
 'Tholu Bommalata uses coloured leather puppets and tells Ramayana and Mahabharata stories'],
'Story-telling tradition → regional puppet forms → revival efforts',
'Four types “S-S-R-G”: “Strings Show Rods, Gloves.” AP = shadow (Tholu = leather).',
'Not applicable','Rajasthan, Andhra Pradesh, Karnataka, Odisha, Bengal, Kerala',
'Describe the shadow puppet traditions of India.',
['Intro: shadow puppetry','Tholu Bommalata (AP)','Togalu Gombeyaata and Ravanachhaya','Themes from epics','Conclusion: fading art needing support']);

C('martial','India has many traditional martial arts, each tied to a region.',
['Kalaripayattu (Kerala), often called one of the oldest martial arts',
 'Silambam (Tamil Nadu): stick fighting',
 'Gatka (Punjab): Sikh martial art',
 'Thang-ta (Manipur): sword and spear',
 'Mardani Khel (Maharashtra), Pari-khanda (Bihar), Lathi (many states)',
 'Several were added to the National Games and Khelo India'],
'Warrior traditions → regional schools → sport revival',
'“Kerala Kalari, Tamil Silambam, Punjab Gatka, Manipur Thang-ta.”',
'Not applicable','Kerala, Tamil Nadu, Punjab, Manipur',
'How can traditional martial arts be promoted?',
['Intro: heritage value','Include in school sports','Tourism and festivals','Training centres and funding','Conclusion: health and heritage together']);

C('unesco','India has many UNESCO World Heritage Sites and Intangible Cultural Heritage elements.',
['Recent world heritage sites: Dholavira and Ramappa temple (2021), Santiniketan and Hoysala temples (2023), Moidams of Assam (2024)',
 'Ramappa (Rudreswara) temple in Telangana was built in the Kakatiya period (1213 CE)',
 'Intangible heritage includes Vedic chanting, Ramlila, Koodiyattam, Yoga, Kumbh Mela, Durga Puja in Kolkata, Garba',
 'Andhra Pradesh has sites on UNESCO’s tentative list, such as Lepakshi',
 'GI tags from AP: Tirupati laddu, Kondapalli toys, Bobbili veena, Machilipatnam Kalamkari, Srikalahasti Kalamkari, Uppada Jamdani saree',
 'The list keeps growing — check the latest count on the UNESCO site before the exam'],
'Heritage value → nomination → listing → protection and tourism',
'Telugu link: “Ramappa 2021” — the only Kakatiya UNESCO site.',
'Recharla Rudra (Ramappa’s builder, a Kakatiya general)','Ramappa, Dholavira, Santiniketan, Belur, Halebidu, Lepakshi',
'What is the importance of UNESCO heritage status for India?',
['Intro: world and intangible lists','Global recognition and tourism','Conservation funds and rules','Local pride and jobs','Conclusion: balance tourism and protection']);

C('lang','India’s languages belong to several families. Scripts grew from Brahmi. Eleven languages have classical status.',
['Language families: Indo-Aryan, Dravidian, Austro-Asiatic, Tibeto-Burman',
 'Brahmi is the parent of most Indian scripts; Kharosthi was written right to left',
 'Classical languages: Tamil (2004), Sanskrit (2005), Telugu and Kannada (2008), Malayalam (2013), Odia (2014), and Marathi, Pali, Prakrit, Assamese and Bengali (2024)',
 'Eighth Schedule of the Constitution lists 22 languages',
 'Telugu: earliest Telugu inscription is the Kalamalla inscription (Kadapa, Renati Cholas, 6th century)',
 'Nannaya is called the Adikavi (first poet) of Telugu'],
'Brahmi → regional scripts → literature in many languages → classical status',
'Telugu got classical status in “2008 — the year Telugu got its crown.”',
'Nannaya, Kalidasa, Tiruvalluvar, Pampa','Kalamalla, Bhattiprolu',
'What is the significance of classical language status?',
['Intro: criteria (antiquity, literature, originality)','Grants for research and chairs','Pride and preservation','Telugu’s case','Conclusion: protects linguistic heritage']);

C('philo','Indian philosophy has six orthodox (astika) schools that accept the Vedas and heterodox (nastika) schools that do not.',
['Nyaya (Gautama): logic; Vaisheshika (Kanada): atoms',
 'Samkhya (Kapila): dualism of purusha and prakriti; Yoga (Patanjali): Yoga Sutras',
 'Mimamsa (Jaimini): ritual; Vedanta (Badarayana): Upanishads',
 'Advaita (Shankaracharya), Vishishtadvaita (Ramanuja), Dvaita (Madhva)',
 'Heterodox: Buddhism, Jainism, Charvaka (Lokayata, materialism), Ajivika (Makkhali Gosala)',
 'Nagarjuna (Madhyamaka Buddhism) is linked to Andhra (Nagarjunakonda region)'],
'Vedic thought → debates → six schools and heterodox schools → Vedanta dominant later',
'Six schools in pairs: “Nyaya–Vaisheshika, Samkhya–Yoga, Mimamsa–Vedanta.”',
'Gautama, Kanada, Kapila, Patanjali, Jaimini, Badarayana, Shankara, Ramanuja, Madhva, Nagarjuna','Kaladi, Sriperumbudur, Udupi, Nagarjunakonda',
'Compare Advaita and Vishishtadvaita.',
['Intro: Vedanta traditions','Advaita: Brahman alone is real, world is maya','Vishishtadvaita: qualified non-dualism, devotion','Influence on Bhakti','Conclusion: different paths to the same goal']);

C('scitech','Ancient and medieval India made major advances in mathematics, astronomy, medicine and metallurgy.',
['Aryabhata: Aryabhatiya; earth rotates on its axis; value of pi',
 'Varahamihira: Brihat Samhita, Pancha Siddhantika',
 'Brahmagupta: rules for zero; Bhaskara II: Lilavati',
 'Baudhayana’s Sulba Sutra: early geometry',
 'Medicine: Charaka (Charaka Samhita), Sushruta (surgery, Sushruta Samhita)',
 'Iron Pillar at Mehrauli (Gupta) has resisted rust; Wootz steel',
 'Sawai Jai Singh II built Jantar Mantar observatories'],
'Ritual geometry → astronomy and mathematics → medicine and metallurgy',
'“A-V-B-B”: Aryabhata, Varahamihira, Brahmagupta, Bhaskara — in time order.',
'Aryabhata, Varahamihira, Brahmagupta, Bhaskara II, Charaka, Sushruta, Sawai Jai Singh II','Ujjain, Kusumapura, Mehrauli, Jaipur',
'Describe the contribution of ancient India to mathematics.',
['Intro: Sulba Sutras','Decimal place value and zero','Aryabhata, Brahmagupta, Bhaskara','Spread to Arabs and Europe','Conclusion: lasting global impact']);

C('fest','India’s festivals are linked to seasons, harvests and faiths. Many are region-specific.',
['Harvest festivals: Sankranti (AP), Pongal (Tamil Nadu), Bihu (Assam), Onam (Kerala), Lohri (Punjab)',
 'Ugadi: Telugu and Kannada new year',
 'Bathukamma and Bonalu: Telangana',
 'Hornbill festival: Nagaland; Losar: Ladakh and Sikkim; Chhath: Bihar',
 'Kumbh Mela, Durga Puja (Kolkata) and Garba are on the UNESCO intangible heritage list',
 'Tirupati Brahmotsavam is the main festival of the Venkateswara temple'],
'Seasons and harvest → regional festivals → national culture',
'Harvest quartet “S-P-B-O”: Sankranti, Pongal, Bihu, Onam — same season, different states.',
'Not applicable','Tirupati, Kolkata, Prayagraj, Kerala, Assam',
'How do festivals reflect India’s unity in diversity?',
['Intro: variety of festivals','Same harvest, different names','Shared celebration across faiths','Economic and social role','Conclusion: unity in diversity']);

C('coins','Coins are a key source of history. They tell us about rulers, trade, religion and economy.',
['Punch-marked coins (silver karshapana) are the earliest Indian coins',
 'Indo-Greeks issued the first coins bearing kings’ portraits',
 'Kushanas issued many gold coins; Guptas issued the largest number of gold coins (dinaras)',
 'Satavahanas issued lead and potin coins; some show ships, indicating sea trade',
 'Iltutmish: silver tanka and copper jital; Muhammad bin Tughlaq: token currency',
 'Sher Shah Suri introduced the rupiya'],
'Punch-marked → portrait coins → gold coins → Sultanate tanka → Sher Shah’s rupiya',
'“Punch, Portrait, Gold, Tanka, Rupiya” — five stages in order.',
'Kanishka, Samudragupta, Iltutmish, Muhammad bin Tughlaq, Sher Shah','Taxila, Mathura, Pratishthana',
'How are coins useful as a source of history?',
['Intro: numismatics','Rulers, dates and titles','Trade and economy (Roman coins in the south)','Religion and art','Conclusion: fill gaps where texts are silent']);

C('travellers','Foreign travellers left valuable accounts of India in different periods.',
['Megasthenes (Greek): Chandragupta Maurya; wrote Indica',
 'Fa-Hien (Chinese): Chandragupta II',
 'Hiuen Tsang (Chinese): Harsha; visited Andhra (Dhanyakataka); wrote Si-Yu-Ki',
 'Al-Biruni: came with Mahmud of Ghazni; Kitab-ul-Hind',
 'Marco Polo (Venetian): visited Motupalli port in Rudramadevi’s time',
 'Ibn Battuta (Moroccan): Muhammad bin Tughlaq; Rihla',
 'Nicolo Conti (Devaraya I), Abdur Razzaq (Devaraya II), Domingo Paes and Fernao Nuniz (Krishnadevaraya) visited Vijayanagara',
 'Thomas Roe (Jahangir), Bernier (Shah Jahan, Aurangzeb), Tavernier (Golconda diamonds)'],
'Each traveller pairs with one ruler — learn them as pairs',
'Pairs “Mega–Chandra, Fa–Vikram, Hiuen–Harsha, Marco–Rudrama, Battuta–Tughlaq, Paes–Krishna.”',
'Megasthenes, Fa-Hien, Hiuen Tsang, Al-Biruni, Marco Polo, Ibn Battuta, Paes, Nuniz, Thomas Roe, Bernier','Pataliputra, Kanauj, Motupalli, Delhi, Vijayanagara, Golconda',
'Assess the value of foreign travellers’ accounts for Indian history.',
['Intro: outside view','Detail on cities, trade, customs','Examples: Megasthenes, Hiuen Tsang, Paes','Limits: language, bias, short stay','Conclusion: useful when checked with Indian sources']);

/* Chapter content: Andhra Pradesh history */
C('ap-geo','Andhra’s history is shaped by its geography: the Krishna and Godavari deltas, the Eastern Ghats, Rayalaseema’s dry plateau and a long coast. Its history is known from literature, inscriptions, coins and monuments.',
['Three regions: Coastal Andhra, Rayalaseema, and (until 2014) Telangana',
 'The Aitareya Brahmana is the earliest text to mention the Andhras',
 'Megasthenes wrote that the Andhras had many walled towns and a large army',
 'Ashokan edicts at Erragudi (Kurnool) and Rajula Mandagiri',
 'Bhattiprolu (old Guntur district, now Bapatla) inscriptions on a stupa relic casket',
 'The Kalamalla inscription (Kadapa, Renati Chola king Dhananjaya) is the earliest known Telugu inscription',
 'Coins of the Satavahanas and Roman coins show trade'],
'Rivers and coast → farming and trade → kingdoms; sources: texts → inscriptions → coins → monuments',
'Sources, “A-M-E-B-K”: Aitareya, Megasthenes, Erragudi, Bhattiprolu, Kalamalla — oldest to newest.',
'Megasthenes, Renati Chola Dhananjaya','Erragudi, Bhattiprolu, Kalamalla, Amaravati',
'Describe the sources for the early history of Andhra.',
['Intro: need for many sources','Literary: Aitareya Brahmana, Puranas, Megasthenes','Inscriptions: Erragudi, Bhattiprolu, Kalamalla','Coins and monuments: Amaravati, Nagarjunakonda','Conclusion: together they build the story']);

C('ap-pre','Andhra has rich prehistoric sites from the Old Stone Age to the Megalithic age.',
['Palaeolithic tools found in the Kurnool region, including the Billa Surgam and Betamcherla caves',
 'Nagarjunakonda area has evidence from many prehistoric phases',
 'Mesolithic microliths are found across Rayalaseema and the coast',
 'Neolithic farming sites in the Krishna–Tungabhadra region',
 'Megalithic burials (stone circles, dolmens) are widely found, with iron tools',
 'Rock art is found in Kurnool and Kadapa districts'],
'Stone Age hunters → Neolithic farmers → Megalithic iron users → early historic Andhra',
'“Kurnool’s caves keep the oldest Andhra tools.”',
'Not applicable','Kurnool caves, Betamcherla, Nagarjunakonda, Kadapa',
'Trace the prehistoric cultures of Andhra Pradesh.',
['Intro: rich prehistoric record','Palaeolithic sites in Kurnool','Neolithic farming','Megalithic burials and iron','Conclusion: base of early historic Andhra']);

C('ap-sata','The Satavahanas rose in the Deccan after the Mauryan decline. They are the first major dynasty of Andhra history; the Puranas call them Andhras or Andhrabhrityas.',
['Founder: Simuka',
 'Capitals: Pratishthana (Paithan, Maharashtra); Dhanyakataka (Dharanikota/Amaravati) was important later',
 'Hala compiled the Gathasaptasati in Prakrit',
 'Gautamiputra Satakarni (about 106–130 CE) is the greatest ruler; Nasik inscription of his mother Gautami Balasri praises him',
 'Kings used metronymics (named after mothers), such as Gautamiputra and Vasishthiputra',
 'Yajna Sri Satakarni was the last strong ruler',
 'Coins in lead and potin; ship-type coins show sea trade',
 'Amaravati Stupa became a great Buddhist centre; land grants to Brahmins and Buddhist monks began'],
'Mauryan decline → Satavahana rise → trade, Buddhist art and coins → decline in the 3rd century CE',
'Kings “S-H-G-Y”: “Simuka Started, Hala Helped poetry, Gautamiputra Greatest, Yajna Sri last.”',
'Simuka, Hala, Gautamiputra Satakarni, Gautami Balasri, Vasishthiputra Pulumavi, Yajna Sri Satakarni','Pratishthana, Dhanyakataka, Amaravati, Nasik',
'Assess the achievements of Gautamiputra Satakarni.',
['Intro: greatest Satavahana','Defeated the Shakas (Nahapana)','Nasik inscription and titles','Social order and welfare','Conclusion: restored Satavahana power']);

C('ap-ikshvaku','The Ikshvakus ruled the Krishna valley after the Satavahanas, from Vijayapuri (Nagarjunakonda), in the 3rd–4th century CE.',
['Founder: Vasishthiputra Santamula (Chantamula), who performed Vedic sacrifices like Ashvamedha',
 'Virapurushadatta: Buddhism flourished; many stupas and viharas built',
 'Royal women, such as Chantisri, gave large gifts to Buddhism',
 'Ehuvala Chantamula and Rudrapurushadatta were later rulers',
 'Nagarjunakonda was excavated; many monuments were moved before the Nagarjuna Sagar dam flooded the valley',
 'Acharya Nagarjuna is linked to this region'],
'Satavahana decline → Ikshvakus in the Krishna valley → Buddhist art at Nagarjunakonda → decline',
'“Santa Started, Vira Built, Ehuvala, Rudra ended” — S-V-E-R order.',
'Santamula, Virapurushadatta, Chantisri, Ehuvala Chantamula, Rudrapurushadatta','Vijayapuri, Nagarjunakonda',
'Describe the contribution of the Ikshvakus to Buddhism.',
['Intro: Ikshvakus at Vijayapuri','Royal women’s patronage','Stupas, viharas and sculptures at Nagarjunakonda','Coexistence with Vedic rituals','Conclusion: a high point of Buddhist art in Andhra']);

C('ap-postik','After the Ikshvakus, several small dynasties ruled parts of Andhra before the Vishnukundins united much of it.',
['Brihatphalayanas: Jayavarma (Kodur grant)',
 'Anandagotrikas ruled in Guntur area (Kandara)',
 'Salankayanas: capital Vengi (Pedavegi, near Eluru)',
 'Vishnukundins (about 5th–6th century to 624 CE): Indra Varma founder; Madhava Varma II greatest; early capital Indrapalanagara (Nalgonda region), later shifted towards the coast',
 'Vishnukundins supported Vedic religion; Undavalli caves are linked to them',
 'Pallavas held parts of southern Andhra; Renati Cholas ruled Rayalaseema'],
'Ikshvaku end → small dynasties → Vishnukundin unity → Chalukyan conquest (624)',
'“B-A-S-V”: Brihatphalayanas, Anandagotrikas, Salankayanas, Vishnukundins — “Brave Andhras Stay Victorious.”',
'Jayavarma, Indra Varma, Madhava Varma II','Kodur, Vengi, Indrapalanagara, Undavalli',
'Discuss the achievements of the Vishnukundins.',
['Intro: rise after small dynasties','Madhava Varma II’s conquests','Vedic religion and Ashvamedhas','Undavalli caves','Conclusion: prepared ground for Eastern Chalukyas']);

C('ap-chalukya','The Eastern Chalukyas of Vengi ruled coastal Andhra for about 450 years from 624 CE. Telugu literature began under them.',
['Founder: Kubja Vishnuvardhana (624 CE), brother of Pulakesin II of Badami',
 'Capital: Vengi; later Rajamahendravaram (Rajahmundry)',
 'Gunaga Vijayaditya III was a great warrior',
 'Long wars with the Rashtrakutas',
 'Rajaraja Narendra (1019–1061): Nannaya began the Telugu Mahabharatam in his court',
 'Marriage ties with the Cholas; Kulottunga I (Rajendra Chalukya) united Vengi with the Chola empire (1070)',
 'Temples at Biccavolu and Draksharama; many land grants'],
'Chalukyan conquest → Vengi kingdom → Rashtrakuta wars → Chola alliance → Telugu literature → merger with Cholas',
'“Kubja Began, Gunaga Fought, Raja Wrote (Nannaya), Kulottunga Merged.”',
'Kubja Vishnuvardhana, Gunaga Vijayaditya III, Rajaraja Narendra, Nannaya, Kulottunga I','Vengi, Rajahmundry, Draksharama, Biccavolu',
'Explain the cultural contribution of the Eastern Chalukyas.',
['Intro: 450 years of rule','Telugu literature: Nannaya','Temples at Biccavolu and Draksharama','Land grants and agrarian growth','Conclusion: shaped Telugu identity']);

C('ap-kakatiya','The Kakatiyas united Telugu-speaking lands under one rule for the first time. They ruled from Hanumakonda and Orugallu (Warangal).',
['Early rulers were feudatories of the Kalyani Chalukyas: Beta I, Prola I, Beta II, Prola II',
 'Rudradeva (Prataparudra I) declared independence; built the Thousand Pillar temple at Hanumakonda (1163)',
 'Ganapatideva (1199–1262): moved capital to Orugallu; promoted Motupalli port and trade',
 'Ramappa temple (1213) built by his general Recharla Rudra; UNESCO site (2021)',
 'Rudramadevi (1262–1289): one of India’s few women rulers; Marco Polo visited Motupalli',
 'Prataparudra II (1289–1323): defeated by Ulugh Khan (Muhammad bin Tughlaq) in 1323',
 'Nayankara system (military fiefs); large tanks like Ramappa, Pakhal and Laknavaram',
 'Kakatiya Thoranam (gateway) is a famous symbol'],
'Feudatories → independence under Rudradeva → peak under Ganapatideva and Rudramadevi → fall in 1323',
'Order “R-M-G-R-P”: “Rudra Made Ganapati’s Rudrama Proud” — Rudradeva, Mahadeva, Ganapatideva, Rudramadevi, Prataparudra II.',
'Rudradeva, Ganapatideva, Rudramadevi, Prataparudra II, Recharla Rudra','Hanumakonda, Orugallu (Warangal), Ramappa, Motupalli',
'Describe the administration and economy of the Kakatiyas.',
['Intro: first Telugu unification','Nayankara system','Tank irrigation and agriculture','Trade through Motupalli','Conclusion: golden age of Telugu land']);

C('ap-reddi','After the fall of the Kakatiyas in 1323, local Telugu chiefs drove out the Delhi Sultanate. The Musunuri Nayakas, Reddis and Recharla Velamas ruled parts of Andhra.',
['Musunuri Prolaya Nayaka led the resistance; Kapaya Nayaka recaptured Warangal (about 1336)',
 'Reddi kingdom founded by Prolaya Vema Reddi (1325); capital Addanki, later Kondaveedu',
 'Kumaragiri Reddi and Pedakomati Vema Reddi were patrons of literature',
 'Srinatha was the court poet of Pedakomati Vema Reddi',
 'Rajahmundry branch of the Reddis: Kataya Vema, Allaya Vema',
 'Recharla Velamas ruled from Rachakonda and Devarakonda; Sarvajna Singabhupala was a scholar-king',
 'Reddi rule ended about 1424–1448, absorbed by the Gajapatis and Vijayanagara'],
'Kakatiya fall → Nayaka resistance → Reddi and Velama kingdoms → absorbed by bigger powers',
'“After Kakatiya came the 3 R’s: Resistance (Musunuri), Reddis, Rachakonda (Velamas).”',
'Prolaya Nayaka, Kapaya Nayaka, Prolaya Vema Reddi, Pedakomati Vema Reddi, Srinatha, Sarvajna Singabhupala','Warangal, Addanki, Kondaveedu, Rajahmundry, Rachakonda',
'Assess the role of the Musunuri Nayakas in Andhra history.',
['Intro: after 1323','United Nayaka resistance','Recapture of Warangal','Paved the way for Reddis and Vijayanagara','Conclusion: saved Telugu independence']);

C('ap-vijay','The Vijayanagara empire (1336–about 1646) was the great Hindu empire of the south. Krishnadevaraya made it the high point of Telugu culture.',
['Founded in 1336 by Harihara I and Bukka I (Sangama dynasty), with Vidyaranya’s guidance',
 'Four dynasties: Sangama, Saluva, Tuluva, Aravidu',
 'Devaraya II was the greatest Sangama ruler',
 'Krishnadevaraya (Tuluva, 1509–1529): wrote Amuktamalyada in Telugu; called Andhra Bhoja; Ashtadiggajas in his court',
 'Allasani Peddana (Andhra Kavita Pitamaha) and Tenali Ramakrishna were among the Ashtadiggajas',
 'Battle of Talikota (Rakkasa–Tangadi), 1565: defeat by the Deccan Sultanates; Aliya Rama Raya killed',
 'After Talikota, capitals moved to Penukonda and Chandragiri (Aravidu dynasty)',
 'Nayankara and ayagar systems; Hampi ruins are a UNESCO site'],
'Founding in 1336 → wars with Bahmanis → peak under Krishnadevaraya → Talikota 1565 → decline at Penukonda and Chandragiri',
'Four dynasties “S-S-T-A”: “Some Sweet Tasty Apples” — Sangama, Saluva, Tuluva, Aravidu.',
'Harihara I, Bukka I, Vidyaranya, Devaraya II, Krishnadevaraya, Allasani Peddana, Tenali Ramakrishna, Aliya Rama Raya','Hampi, Penukonda, Chandragiri, Talikota, Lepakshi',
'Assess Krishnadevaraya as a ruler and patron of culture.',
['Intro: greatest Vijayanagara king','Military success: Raichur, Gajapatis','Administration: Amuktamalyada’s ideas','Literature: Ashtadiggajas, Telugu golden age','Conclusion: Andhra Bhoja']);

C('ap-qutb','The Qutb Shahis ruled Golconda from 1518 to 1687. They founded Hyderabad and patronised Telugu.',
['Founder: Sultan Quli Qutb Shah (1518)',
 'Ibrahim Qutb Shah (called Malki Bharama by Telugu poets) supported Telugu literature',
 'Muhammad Quli Qutb Shah founded Hyderabad and built the Charminar (1591); wrote Urdu poetry',
 'Abul Hasan Tana Shah was the last ruler; ministers Madanna and Akkanna',
 'Kancherla Gopanna (Bhakta Ramadasu) built the Bhadrachalam temple in this period',
 'Golconda was famous for diamonds (Kollur mines); Tavernier described them',
 'Aurangzeb annexed Golconda in 1687'],
'Bahmani split → Golconda kingdom → Hyderabad founded → Telugu–Persian culture → Mughal conquest 1687',
'“Quli founded, Ibrahim loved Telugu, Muhammad built Hyderabad, Tana Shah lost.”',
'Sultan Quli, Ibrahim Qutb Shah, Muhammad Quli Qutb Shah, Abul Hasan Tana Shah, Madanna, Akkanna, Bhakta Ramadasu','Golconda, Hyderabad, Bhadrachalam, Kollur',
'Describe the cultural contribution of the Qutb Shahis.',
['Intro: Golconda kingdom','Patronage of Telugu and Persian','Architecture: Charminar, Golconda fort, tombs','Composite culture (Deccani)','Conclusion: lasting legacy in Hyderabad']);

C('ap-asaf','The Asaf Jahis (Nizams) ruled Hyderabad State from 1724 to 1948. Coastal Andhra and Rayalaseema passed from them to the British.',
['Founder: Nizam-ul-Mulk Asaf Jah I (1724)',
 'Northern Circars given to the French (1753), then to the British (Mughal grant 1765; treaties of 1766 and 1768)',
 'Nizam Ali Khan accepted the Subsidiary Alliance (1798), the first ruler to do so',
 'Ceded Districts (1800): Bellary, Cuddapah, Kurnool and Anantapur given to the British — later called Rayalaseema',
 'Salar Jung I was a reforming prime minister',
 'Mir Osman Ali Khan (Asaf Jah VII, 1911–1948) was the last Nizam; Osmania University (1918)',
 'Hyderabad joined India after Operation Polo (September 1948)'],
'Mughal governor turns independent → loses Circars and Ceded Districts to the British → Hyderabad State → Operation Polo 1948',
'“Circars to French then British, Ceded to British 1800, Osman last, Polo ends it.”',
'Nizam-ul-Mulk, Nizam Ali Khan, Salar Jung I, Mir Osman Ali Khan','Hyderabad, Northern Circars, Ceded Districts',
'How did coastal Andhra and Rayalaseema come under British rule?',
['Intro: Nizam’s territories','Northern Circars: French, then British (1765–68)','Subsidiary Alliance (1798)','Ceded Districts (1800)','Conclusion: Andhra split between British and Nizam']);

C('ap-british','British rule in Andhra brought new land systems, irrigation works and resistance.',
['English factory at Masulipatnam (1611); Golconda’s “Golden Farman” (1632) gave trade privileges',
 'Battle of Bobbili (1757): Bobbili fought Vizianagaram and the French under Bussy',
 'Permanent zamindari settlement in the Northern Circars (1802)',

/* ============ QUIZ ENGINE ============ */
function makeQuiz(ids){ return {ids:ids, i:0, score:0, answered:null, order:ids.map(() => shuffle([0,1,2,3])), wrongIds:[]}; }
function quizHTML(z, title){
 const n = z.ids.length, qi = z.ids[z.i], q = BANK[qi];
 let h = '<div class="card"><div class="qhead"><span>'+esc(title)+'</span><span>'+T('Q','ప్ర')+' '+(z.i+1)+' / '+n+' · ✅ '+z.score+'</span></div>';
 if(z.end) h += '<div class="muted" id="clock"></div>';
 h += '<div class="bar"><span style="width:'+(z.i/n*100)+'%"></span></div>';
 h += '<span class="tag">'+esc(chName(q[0]))+'</span><h2 class="q">'+esc(q[1])+'</h2>';
 z.order[z.i].forEach(oi => {
  let cls = 'opt';
  if(z.answered !== null){ if(oi === 0) cls += ' right'; else if(oi === z.answered) cls += ' wrong'; }
  h += '<button class="'+cls+'" data-ans="'+oi+'">'+esc(q[2][oi])+'</button>';
 });
 if(z.answered !== null){
  h += '<p class="hook">'+(z.answered === 0 ? '✅ ' : '❌ ')+esc(q[3])+'</p>';
  h += '<div class="btns"><button class="btn alt" data-go="ch:'+q[0]+'">'+T('Read chapter','అధ్యాయం చదవండి')+'</button><button class="btn" data-next="1">'+T('Next','తదుపరి')+' →</button></div>';
 }
 return h + '</div>';
}
function resultHTML(z, title, note){
 const n = z.ids.length;
 let h = '<div class="card center"><h1>'+esc(title)+'</h1><div class="big">'+z.score+' / '+n+'</div><p class="muted">'+Math.round(z.score/n*100)+'%</p><p>'+esc(note)+'</p></div>';
 if(z.wrongIds.length){
  h += '<div class="card"><h2>'+T('Review your mistakes','మీ తప్పులు చూడండి')+'</h2><ul>'+z.wrongIds.map(i => '<li><b>'+esc(BANK[i][1])+'</b><br>✅ '+esc(BANK[i][2][0])+' — <span class="muted">'+esc(BANK[i][3])+'</span></li>').join('')+'</ul></div>';
 }
 return h;
}
function answerZ(z, oi){
 if(z.answered !== null) return;
 const qi = z.ids[z.i];
 z.answered = oi;
 if(oi === 0){ z.score++; delete S.wrong[qi]; } else { S.wrong[qi] = (S.wrong[qi]||0)+1; z.wrongIds.push(qi); }
 if(!S.seen.includes(qi)) S.seen.push(qi);
 save();
}
function currentQuiz(){ return R === 'daily' ? S.today : Z; }
function answer(oi){ const z = currentQuiz(); if(!z) return; answerZ(z, oi); render(); }
function nextQ(){ const z = currentQuiz(); if(!z) return; z.i++; z.answered = null; save(); render(); window.scrollTo(0,0); }

/* Daily: 30 a day; up to 10 past mistakes, then unseen, then least recent */
function todaySession(){
 const d = todayStr();
 if(S.today && S.today.date === d && S.today.ids.length) return S.today;
 const all = BANK.map((_,i) => i);
 const wrong = shuffle(Object.keys(S.wrong).map(Number).filter(i => i < BANK.length)).slice(0,10);
 const unseen = shuffle(all.filter(i => !S.seen.includes(i) && !wrong.includes(i)));
 const old = S.seen.filter(i => !wrong.includes(i) && i < BANK.length);
 S.today = Object.assign(makeQuiz(wrong.concat(unseen, old).slice(0, DAILY)), {date:d});
 save(); return S.today;
}
function renderDaily(){
 crumb(T('Daily Prelims','రోజువారీ ప్రిలిమ్స్'));
 const t = todaySession();
 if(t.i >= t.ids.length){
  S.days[t.date] = {score:t.score, total:t.ids.length}; save();

}

function orderBadge(k){ const o = S.orders[k]; return o ? ' <span class="badge'+(o.best===0?' ok':'')+'">'+(o.best===0?'✓ ':'')+T('best','ఉత్తమ')+': '+o.best+' '+T('mistakes','తప్పులు')+'</span>' : ''; }
function orderItems(key){
 if(key === 'ap-main') return {title:T('AP kingdoms in order','ఆంధ్ర రాజ్యాల క్రమం'), items:['Satavahanas','Ikshvakus','Salankayanas','Vishnukundins','Eastern Chalukyas','Kakatiyas','Musunuri Nayakas','Reddis','Vijayanagara','Qutb Shahis','Mughals','Asaf Jahis']};
 const d = DYN_AP.concat(DYN_IN).find(x => x.id === key);
 return d ? {title:T(d.name,d.te), items:d.kings.map(k => k[0])} : null;
}
function renderOrder(){
 const key = R.slice(6), def = orderItems(key);
 if(!def) return go('kings');
 crumb(T('Order game','క్రమ ఆట')+' › '+def.title);
 if(!G || G.key !== key) G = {key, items:def.items, pool:shuffle(def.items.map((_,i) => i)), done:[], miss:0, flash:null};
 let h = '<div class="card"><h1>'+esc(def.title)+'</h1><p class="muted">'+T('Tap them from first to last.','మొదటి నుండి చివరి వరకు నొక్కండి.')+' ❌ '+G.miss+'</p>';
 h += '<div class="flow">'+G.done.map((i,n) => '<div class="fl"><span class="n">'+(n+1)+'</span><b>'+esc(G.items[i])+'</b></div>').join('')+'</div>';
 if(G.done.length < G.items.length){
  h += '<div class="chips">'+G.pool.filter(i => !G.done.includes(i)).map(i => '<button class="chip'+(G.flash===i?' bad':'')+'" data-pick="'+i+'">'+esc(G.items[i])+'</button>').join('')+'</div>';
 } else {
  h += '<p class="hook">'+(G.miss === 0 ? '🎉 '+T('Perfect order!','సరైన క్రమం!') : T('Done with','పూర్తయింది')+' '+G.miss+' '+T('mistakes. Play again until you get zero.','తప్పులతో. సున్నా వచ్చే వరకు మళ్లీ ఆడండి.'))+'</p>';
  h += '<div class="btns"><button class="btn alt" data-go="kings">← '+T('Kings & Kingdoms','రాజులు, రాజ్యాలు')+'</button><button class="btn" data-replay="1">'+T('Play again','మళ్లీ ఆడండి')+'</button></div>';
 }
 view(h + '</div>');
}
function pick(i){
 if(!G) return;
 if(i === G.done.length){ G.done.push(i); G.flash = null;
  if(G.done.length === G.items.length){ const o = S.orders[G.key]; if(!o || G.miss < o.best) S.orders[G.key] = {best:G.miss}; save(); }
 } else { G.miss++; G.flash = i; }
 renderOrder();
}

document.addEventListener('click', e => {
 const t = e.target;
 const g = t.closest('[data-go]'); if(g && !g.disabled){ if(g.dataset.go.startsWith('order:')) G = null; go(g.dataset.go); return; }
 const a = t.closest('[data-ans]'); if(a){ answer(Number(a.dataset.ans)); return; }
 if(t.closest('[data-next]')){ nextQ(); return; }
 const cq = t.closest('[data-cquiz]'); if(cq){ startChapterQuiz(cq.dataset.cquiz); return; }
 if(t.closest('[data-startmock]')){ startMock(); return; }
 const tg = t.closest('[data-target]'); if(tg){ S.target = Number(tg.dataset.target); save(); renderMains(); return; }
 const mn = t.closest('[data-mains]'); if(mn){ S.mainsCh = mn.dataset.mains; go('mains'); return; }
 if(t.closest('[data-mainsreset]')){ S.mainsCh = null; save(); renderMains(); return; }
 const kt = t.closest('[data-ktab]'); if(kt){ S.ktab = kt.dataset.ktab; save(); renderKings(); return; }
 const pk = t.closest('[data-pick]'); if(pk){ pick(Number(pk.dataset.pick)); return; }
 if(t.closest('[data-replay]')){ G = null; renderOrder(); return; }
 if(t.closest('[data-reset]')){ if(confirm(T('Delete all progress on this phone?','ఈ ఫోన్‌లో మొత్తం ప్రగతి తొలగించాలా?'))){ S = {seen:[],wrong:{},days:{},read:{},orders:{},lang:LANG}; save(); go('home'); } return; }
});
document.addEventListener('input', e => {
 if(e.target.id === 'ans'){ const id = S.mainsCh || MAINS_IDS[dayNum() % MAINS_IDS.length]; S.drafts = S.drafts || {}; S.drafts[id+':'+(S.target||150)] = e.target.value; save(); countWords(); }
 if(e.target.id === 'q'){ S.q = e.target.value; save(); if(S.q.trim().length >= 2){ R = 'search'; S.route = R; renderSearch(); } }
});
document.addEventListener('change', e => { if(e.target.id === 'mpick' && e.target.value){ S.mainsCh = e.target.value; save(); renderMains(); } });
