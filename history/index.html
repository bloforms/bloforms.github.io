X('prehistory',{lesson:'NIOS Lessons 1–2: Understanding Indian History; Geographical Setting and Prehistoric Cultures',
brief:'NIOS begins by explaining that “itihasa” means “thus it was” and that a historian must cross-check sources: for example, Harsha’s biographer Banabhatta is silent on his defeat, while Pulakesin II’s inscription claims it. Sources are literary (Vedas, epics, Jatakas, Sangam poems), inscriptions (Ashoka was the first to issue them; James Prinsep read Brahmi in 1837), coins, archaeology and foreign accounts. Geography shaped history: the Himalayas protected the north but its north-western passes let in traders and invaders, and the three river systems fed settled life. Prehistory runs from the Palaeolithic (about 5,00,000–10,000 BC: hand axes, then flakes, then blades and burins), through the Mesolithic (from about 10,000 BC: microliths, warmer climate), to the Neolithic (from about 8000 BC: polished tools, farming, pit dwellings at Burzahom, early farming at Mehrgarh). Pollen analysis suggests farming in Kashmir and Rajasthan around 7000–6000 BC.',
revise:['Climate change after the Ice Age (c. 10,000 BC) → warmer weather → more plants and small animals → small, sharp microliths for hunting (Mesolithic).','Microliths fixed on handles → arrows and sickles → first herding (Bagor, Adamgarh) → step towards farming.','Farming (Mehrgarh) → surplus food → settled villages, pottery, polished axes (Neolithic).','Settled villages → copper use → Chalcolithic cultures → base for Harappan cities.','Sources link: tools tell us about technology; rock art (Bhimbetka) tells us about beliefs and social life; pollen tells us about climate and crops.','Geography link: passes in the north-west → contacts with Central Asia → migrations, trade and later invasions.'],
analysis:['Prehistory is known only from material remains, so every conclusion is an interpretation; new excavations keep pushing dates back.','Colonial historians (e.g. V.A. Smith, 1904) described India as unchanging and despotic; nationalist historians (Bhandarkar, Raychaudhuri) answered by showing strong ancient institutions; Marxist historians (Kosambi) shifted focus to economy and society. A Mains answer can mention this change in history writing.','Geography is a strong influence but not destiny: the same Himalayan passes that brought invaders also brought Buddhism to Central Asia and Chinese pilgrims to India.','The shift from hunting to farming was slow and uneven; hunter-gatherers lived beside farmers for thousands of years.'],
mind:['Prehistoric India',[['Sources',['Tools','Rock art','Pollen','Bones']],['Palaeolithic',['Hand axes','Flakes','Blades','Belan valley, Kurnool']],['Mesolithic',['Microliths','Herding','Bagor, Adamgarh']],['Neolithic',['Polished tools','Farming','Mehrgarh, Burzahom, Chirand']],['Geography',['Himalaya and passes','River plains','Peninsula']]]],
table:['Stone Ages at a glance',['Age','Time (NIOS)','Tools','Way of life','Key sites'],[['Palaeolithic','5,00,000–10,000 BC','Hand axes, cleavers, flakes, burins','Hunting, gathering','Belan valley, Bhimbetka, Kurnool, Attirampakkam'],['Mesolithic','From c. 10,000 BC','Microliths','Hunting, fishing, early herding','Bagor, Adamgarh'],['Neolithic','From c. 8000 BC','Polished axes, bone tools','Farming, pit houses','Mehrgarh, Burzahom, Chirand, Nagarjunakonda']]],
places:[['Bhimbetka',77.61,22.94],['Mehrgarh',67.6,29.4],['Burzahom',74.87,34.17],['Chirand',84.85,25.75],['Belan valley',82.2,25.0],['Kurnool caves',78.16,15.47],['Attirampakkam',79.86,13.23],['Bagor',74.37,25.36],['Nagarjunakonda',79.31,16.52]],
figs:['map_2.1','map_2.2','fig_2.1','fig_2.2','fig_2.3','map_2.3','fig_2.4','fig_2.5','fig_2.6','map_2.4','fig_2.7'],
qa:[['How does geography explain the course of early Indian history?',150,'Geography set the stage for early Indian history. The Himalayas, about 2,400 km long, shielded the north from cold winds and large invasions, yet passes in the north-west such as the Khyber and Bolan linked India with Iran and Central Asia; through them came traders, missionaries and later invaders. The Indus, Ganga and Brahmaputra plains, with fertile alluvium and water, supported dense farming populations, which is why the first cities and later empires rose there. The Deccan plateau, broken by the Vindhyas and Satpuras, developed separate regional kingdoms, while the long coast encouraged sea trade with Rome and South-East Asia. Even prehistoric sites follow geography: Palaeolithic camps lie near hills and rivers, and Neolithic farming began on fertile, well-watered land. Geography therefore explains both India’s regional diversity and its contacts with the outside world.'],
['Trace the transition from hunting-gathering to food production in prehistoric India.',250,'Early humans in India lived for hundreds of thousands of years as hunter-gatherers. In the Palaeolithic age (about 5,00,000–10,000 BC) they used heavy hand axes and cleavers, later flakes and blades, and lived near hills and rivers in places like the Belan valley, Bhimbetka and the Kurnool caves. Food depended entirely on what nature offered.\n\nThe end of the Ice Age around 10,000 BC brought a warmer climate. Grasslands and forests spread, and smaller, faster animals became common. People responded with the Mesolithic tool kit of microliths, tiny stone blades set into wooden or bone handles to make arrows and sickles. This made hunting more efficient and allowed harvesting of wild grains. At Bagor in Rajasthan and Adamgarh in Madhya Pradesh we find the first signs of domesticated animals, showing that herding was beginning.\n\nThe decisive change came in the Neolithic age, from about 8000 BC. At Mehrgarh in Baluchistan people grew wheat and barley and kept cattle, sheep and goats. Polished stone axes cleared land, pottery stored grain, and permanent houses appeared, such as the pit dwellings of Burzahom in Kashmir. Chirand in Bihar shows bone tools, and south Indian sites such as Nagarjunakonda show farming communities too.\n\nThis transition was slow and uneven: hunters and farmers lived side by side for a long time. Yet food production created surplus, larger villages and new skills, and it laid the foundation for the Chalcolithic cultures and, finally, the Harappan cities.']]});

X('chalco',{lesson:'NIOS Lesson 3 (non-Harappan Chalcolithic cultures) and Lesson 6 (Megalithic cultures)',
brief:'Outside the Harappan zone, NIOS describes rural Chalcolithic cultures that used both copper and stone tools between about 2000 and 700 BC. These include the Banas culture of south-east Rajasthan (2600–1900 BC; Ahar and Gilund), the Kayatha culture of the Chambal region (2100–2000 BC), the Malwa culture (1700–1400 BC; Navdatoli) and the Jorwe culture of Maharashtra (1400–700 BC; Inamgaon and Chandoli), which has more than 200 sites. People farmed and kept cattle, lived in villages of mud houses, and made painted pottery. In the south, NIOS places the Megalithic cultures between about 1200 and 300 BC: burials marked by large stones, found from the Nagpur area to the southern tip, always with similar iron tools.',
revise:['Copper added to stone tools → better farming tools → rural Chalcolithic villages in Rajasthan, Malwa and Maharashtra.','Regional cultures (Banas → Kayatha → Malwa → Jorwe) → each with its own pottery and houses → shows regional diversity, not one uniform culture.','No large surplus and no cities → these remained village cultures, unlike the Harappans.','In the south, Neolithic farmers → learnt iron → Megalithic burials with iron tools and Black-and-Red Ware.','Megalithic communities → enter the Sangam age → link prehistory to early historic south India.'],
analysis:['Why did Chalcolithic cultures stay rural? Copper was scarce and soft, ploughs and irrigation were limited, and there was no strong central authority to collect surplus.','Megaliths show a society with a belief in life after death and the ability to organise group labour to move big stones, hinting at chiefdoms.','Iron reached the south through the Megalithic people, which shows the south was not simply “borrowing” from the north; it had its own route to the Iron Age.'],
mind:['Chalcolithic and Megalithic',[['Banas',['Ahar','Gilund','2600–1900 BC']],['Kayatha',['Chambal','2100–2000 BC']],['Malwa',['Navdatoli','1700–1400 BC']],['Jorwe',['Inamgaon','Chandoli','1400–700 BC']],['Megaliths',['Stone-marked graves','Iron tools','1200–300 BC']]]],
table:['Chalcolithic cultures (NIOS dates)',['Culture','Region','Date','Key sites'],[['Banas','South-east Rajasthan','2600–1900 BC','Ahar, Gilund'],['Kayatha','Chambal, MP','2100–2000 BC','Kayatha'],['Malwa','Western MP','1700–1400 BC','Navdatoli'],['Jorwe','Maharashtra','1400–700 BC','Inamgaon, Chandoli, Daimabad'],['Megalithic','Deccan and south','1200–300 BC','Brahmagiri, Adichanallur, Nagpur area']]],
places:[['Ahar',73.73,24.58],['Gilund',74.15,25.03],['Kayatha',75.93,23.24],['Navdatoli',75.6,22.17],['Inamgaon',74.53,18.6],['Daimabad',74.7,19.5],['Brahmagiri',76.8,14.8],['Adichanallur',77.87,8.63]],
figs:['fig_6.3'],
qa:[['What were the main features of the non-Harappan Chalcolithic cultures?',150,'The non-Harappan Chalcolithic cultures flourished between about 2000 and 700 BC in Rajasthan, Malwa and Maharashtra. They used tools of copper together with stone, which gives them their name. Major cultures were Banas (Ahar, Gilund), Kayatha, Malwa (Navdatoli) and Jorwe (Inamgaon, Chandoli). People lived in villages of mud and wattle houses, grew wheat, barley, rice and pulses, and kept cattle, sheep and goats. Each culture had its own painted pottery, which helps archaeologists tell them apart. Unlike the Harappans, they built no cities, used no script and produced little surplus, so they remained rural. Their regional variety shows that India’s early farming societies developed in many local forms, and the Jorwe culture alone has more than 200 known sites. Sites like Inamgaon show houses with storage pits and child burials under floors, and Daimabad yielded bronze figures, proving skilled metalwork even without cities.'],
['Discuss the significance of the Megalithic culture in the history of south India.',250,'The Megalithic culture, dated by NIOS to about 1200–300 BC, marks south India’s entry into the Iron Age. Its name comes from the large stones used to mark graves: stone circles, dolmens and cists. Such burials are found from the Nagpur area in the north to the tip of the peninsula, including many sites in Andhra Pradesh and Telangana.\n\nThe first significance is technological. Every Megalithic grave contains similar iron tools and weapons: axes, sickles, swords and arrowheads. This shows that iron working was widespread and well developed, allowing people to clear forests and expand farming in the peninsula.\n\nSecond, the graves reveal society and belief. Grave goods such as pottery, tools and ornaments suggest belief in life after death. Moving and placing huge stones needed organised labour, which points to chiefs who could command people. Differences in grave size and goods hint at social differences.\n\nThird, the culture shows a distinct southern path. Black-and-Red Ware pottery and local burial customs show that the south built its own Iron Age traditions rather than simply copying the north.\n\nFinally, the Megalithic people form the base of the early historic south. Their villages and chiefdoms grew into the Chera, Chola and Pandya kingdoms described in Sangam literature, and the hero-stones (nadukal) of the Sangam age continue the Megalithic tradition of honouring the dead. In this way the Megalithic culture links prehistory with recorded history in south India.']]});

X('indus',{lesson:'NIOS Lesson 3: The Harappan Civilization',
brief:'NIOS calls it the Harappan civilization because Harappa (on the Ravi, excavated by D.R. Sahni) was the first site found, and because it spread far beyond the Indus valley. It grew gradually from Neolithic villages and has three phases: Early (3500–2600 BC), Mature (2600–1900 BC) and Late (1900–1400 BC). Its heartland was the Harappa–Kalibangan–Mohenjodaro axis, but it reached Rajasthan, Punjab, Haryana, Gujarat, Maharashtra, western UP, Pakistan and parts of Afghanistan. Towns had planned streets and elaborate drains; Mohenjodaro had the Great Bath, Lothal a dockyard, and several sites had granaries. Copper came from the Khetri mines of Rajasthan and lapis lazuli from Badakhshan in Afghanistan; trade reached Mesopotamia. The famous seal shows a horned deity in a yogic posture surrounded by an elephant, tiger, rhinoceros and buffalo. The script has about 400 signs, written right to left, and is still not read. NIOS concludes that no single cause explains the decline, though growing dryness after 2000 BC was important; the old “Aryan invasion” theory is not accepted.',
revise:['Neolithic villages + better farming on Indus plains → surplus food → artisans, traders and rulers could be fed → cities.','Cities need order → grid streets, drains, standard bricks and weights → shows strong civic control.','Surplus + crafts (beads, seals, pottery) → trade with Rajasthan (copper), Afghanistan (lapis) and Mesopotamia (Meluhha).','Trade + seals → seals used as trade marks → script on seals, still undeciphered.','Dryness, river shifts and falling trade after c. 1900 BC → cities abandoned → Late Harappan rural phase.','Decline → urban life disappears in the north-west until the second urbanisation in the Ganga valley (6th century BC).'],
analysis:['We know Harappans only from archaeology because the script is unread; ideas about rulers, religion and society are therefore educated guesses.','Uniform bricks, weights and town plans suggest some central authority, yet no palaces or royal tombs have been found. Was it ruled by priests, merchants or a council? This remains debated.','The “Aryan invasion” explanation (Wheeler) is rejected: there is no evidence of large-scale massacre. Climate change, river shifts (the Ghaggar-Hakra drying), floods and declining trade together explain the decline better.','Continuities: fire altars at Kalibangan and Lothal, the proto-Shiva seal, and mother goddess figures suggest some links with later Indian religion, but these should be stated cautiously.'],

qa:[['Describe the town planning of the Harappan cities.',150,'Harappan cities, dated to the mature phase of 2600–1900 BC, were remarkably well planned. Most were divided into a raised citadel in the west, holding public buildings, and a larger lower town where people lived. Streets ran in a grid, crossing at right angles, and divided the town into blocks. Houses of burnt bricks of standard size opened onto side lanes and had wells and bathrooms. Covered drains ran along the streets, with manholes for cleaning, showing great concern for hygiene. Large public structures included the Great Bath at Mohenjodaro, granaries at Harappa and Mohenjodaro, and a dockyard at Lothal. Such uniformity across distant sites suggests a strong civic authority that set standards for bricks, weights and layouts. This planning makes the Harappans India’s first urban culture.'],
['“There is no single cause for the decline of the Harappan civilization.” Discuss.',250,'The Harappan civilization flourished until about 1900 BC. Then, in the Late Harappan phase (1900–1400 BC), cities were abandoned, trade disappeared and settlements shrank and moved east and south. Historians have offered several explanations.\n\nThe oldest view, the Aryan invasion theory, held that invaders from the north-west destroyed the cities around 1500 BC. It is now rejected: the decline began before the Aryans arrived, and the skeletons once cited as massacre victims belong to different periods.\n\nEnvironmental explanations are stronger. Studies point to increasing aridity around 2000 BC, which would have reduced crops. The Ghaggar-Hakra river system dried up, and tectonic changes may have shifted rivers or caused floods, as suggested by silt layers at Mohenjodaro. Over-use of land and cutting forests for brick kilns may have degraded the environment.\n\nEconomic factors also mattered. Trade with Mesopotamia declined around the same period, cutting off a source of wealth for the cities and their craftsmen.\n\nEach theory explains some sites but not all. Floods may explain Mohenjodaro but not Kalibangan; dryness explains the Ghaggar region but not Gujarat, where settlements continued. That is why NIOS concludes that no single cause explains the decline in totality.\n\nThe best answer combines these factors: climate change, river shifts, ecological stress and falling trade together weakened the urban economy. The civilization did not vanish suddenly; it changed into rural, regional cultures, and urban life in India revived only in the Ganga valley more than a thousand years later.']]});

X('vedic',{lesson:'NIOS Lesson 4: The Vedic Age (1500 BC–600 BC); Lesson 29: Towards the Formation of the State',
brief:'NIOS divides the Vedic age into the Early Vedic period (1500–1000 BC), known from the Rigveda’s 1,028 hymns in 10 mandalas, and the Later Vedic period (1000–600 BC). The Aryans came from the steppes between southern Russia and Central Asia, where horses, spoked wheels, fire cults and cremation are found. They first settled in Sapta Sindhu, the land of seven rivers (Sindhu, Jhelum, Chenab, Ravi, Beas, Sutlej and Sarasvati). Early Vedic people were mainly cattle herders with some farming; society was simple and largely egalitarian, and assemblies such as the sabha and samiti limited the chief. The use of iron from about 1000 BC changed everything: forests of the Ganga–Yamuna doab were cleared, farming expanded, population grew and settlements like Hastinapur and Kaushambi grew large. The varna system hardened, chiefship became hereditary, rituals like rajasuya and vajapeya raised the king, and sacrifices became larger. In reaction, the Upanishads recommended knowledge, good conduct and self-sacrifice instead of ritual.',
revise:['Pastoral Aryans in Sapta Sindhu → cattle as wealth → wars over cattle (gavishti) → tribal chiefs elected or chosen, checked by sabha and samiti.','Iron from c. 1000 BC → clearing Ganga forests → plough farming → surplus.','Surplus → bigger villages and towns (Hastinapur, Kaushambi) → larger territories (janapadas).','Territory and wealth → hereditary kings + rituals (rajasuya, ashvamedha) → priests and kings rise above common people → varna becomes rigid.','Costly rituals and rigid varna → reaction in the Upanishads → later Buddhism and Jainism in the 6th century BC.'],
analysis:['The Aryan migration debate: NIOS follows the migration view based on language and archaeology (horses, spoked wheels); some scholars argue for indigenous origins. Present both sides briefly in Mains.','Early Vedic society was more equal than later Indian society: the hymn “I am a poet, my father a physician, my mother grinds grain” shows occupations were not fixed by birth.','Women’s status declined from the Early to the Later Vedic period, along with the decline of popular assemblies; this links economic change to social change.','The Vedic period lays the base of the state: from tribal chief (gopati, protector of cattle) to territorial king (rashtra) with officials and taxes (bali).'],
mind:['Vedic Age',[['Texts',['Rigveda 1,028 hymns','Sama, Yajur, Atharva','Upanishads']],['Early Vedic 1500–1000',['Sapta Sindhu','Cattle wealth','Sabha, samiti','Equal society']],['Later Vedic 1000–600',['Iron','Ganga doab','Hereditary king','Rigid varna']],['Religion',['Indra, Agni, Varuna','Rita','Yajnas','No temples or idols']],['Change',['Pastoral → farming','Tribe → territory','Ritual → reaction']]]],
table:['Early vs Later Vedic period',['Aspect','Early Vedic (1500–1000 BC)','Later Vedic (1000–600 BC)'],[['Region','Sapta Sindhu (Punjab, Haryana)','Ganga–Yamuna doab and beyond'],['Economy','Cattle herding, some farming','Plough farming with iron'],['Polity','Tribal chief, sabha and samiti strong','Hereditary king, rituals, assemblies weaken'],['Society','Flexible, largely equal','Four varnas fixed, ashramas'],['Women','Attended assemblies','Status declined'],['Religion','Indra, Agni, Varuna; simple yajnas','Prajapati, Vishnu, Rudra; elaborate sacrifices; Upanishads']]],
places:[['Sapta Sindhu (Punjab)',74.8,31.2],['Kurukshetra',76.85,29.97],['Hastinapur',78.0,29.16],['Kaushambi',81.39,25.34],['Ganga–Yamuna doab',79.5,27.0]],
figs:['map_4.1','map_4.2'],
qa:[['What changes did the use of iron bring in the Later Vedic period?',150,'Iron came into use around 1000 BC, the beginning of the Later Vedic period, and it transformed Vedic life. Iron axes made it possible to clear the thick forests of the Ganga–Yamuna doab, and iron ploughshares, drawn by oxen, allowed deeper ploughing. Agriculture therefore replaced cattle herding as the main occupation, and people began to grow rice and wheat on a larger scale. Surplus food supported a growing population, larger permanent villages and the first towns such as Hastinapur and Kaushambi. Wealth now lay in land and grain, so territory mattered more than cattle: tribes turned into janapadas, and chiefs became hereditary kings who collected taxes and performed grand rituals. In short, iron laid the material base for the Mahajanapadas and the second urbanisation of the 6th century BC.'],
['Compare the political and social life of the Early and Later Vedic periods.',250,'The Vedic age, 1500–600 BC, saw a shift from tribal to territorial society, and both politics and society changed with it.\n\nIn the Early Vedic period (1500–1000 BC) the Aryans lived in Sapta Sindhu as cattle-keeping tribes. The chief (rajan) was a leader in war, especially in cattle raids, and protector of the tribe. His post was not hereditary, and he was checked by assemblies: the sabha, a council of elders, and the samiti, a wider assembly of the people. There was no regular tax system; people gave voluntary gifts called bali.\n\nIn the Later Vedic period (1000–600 BC) the use of iron and farming in the Ganga plains produced surplus and fixed territories. Tribes became janapadas, and chiefship became hereditary. Kings performed grand rituals such as the rajasuya, vajapeya and ashvamedha to proclaim their power, supported by priests. A small administration and army appeared, bali became a regular tax, and the assemblies lost influence.\n\nSocial life changed in parallel. Early Vedic society was simple and largely equal; occupations were not fixed by birth, as one hymn shows a poet whose mother ground grain. Women attended assemblies and took part in rituals. In the Later Vedic period the four varnas became rigid, with brahmanas and kshatriyas at the top and shudras at the bottom. The ashrama system of life stages took shape, and the position of women declined.\n\nThus the Vedic age moved from tribal equality towards monarchy and hierarchy, a change that later provoked the reform movements of the 6th century BC.']]});

X('sixth',{lesson:'NIOS Lesson 5: From Janapadas to Empire; Lesson 29 (Mahajanapadas, gana-sanghas)',
brief:'In the 6th century BC the centre of activity moved from Haryana and western UP to eastern UP and Bihar, which had more rain and fertile land. Iron tools (a ploughshare of about 500 BC was found at Jakhera) and cattle power raised farm output. NIOS calls this the era of “second urbanisation”: more than sixty towns, including Pataliputra, Rajagriha, Sravasti, Varanasi, Vaishali, Champa, Kaushambi and Ujjaini, grew between 600 and 300 BC, and punch-marked coins (about 550 types, mostly silver) show trade. Sixteen Mahajanapadas arose, most monarchies but some gana-sanghas ruled by councils. New religions answered the new society: Mahavira (born 599 BC near Vaishali) taught strict non-violence and anekantavada, the idea that truth has many sides; the Buddha (born 566 BC at Lumbini, died 486 BC) taught the Middle Path in Pali, the people’s language. Magadha rose under Bimbisara (544–492 BC), Ajatashatru, Udayin (who fortified Pataliputra), the Shishunagas and the Nandas.',
revise:['Iron + rain-fed fertile land in the middle Ganga → surplus → towns and trade (second urbanisation).','Trade → punch-marked coins → merchants (setthis) and money-lending → new rich class wanting social respect.','New wealth vs old Vedic order → rituals, animal sacrifice and varna rigidity questioned → Buddhism and Jainism.','Buddhism: Middle Path, Pali language, open to all → supported by traders and kings → spread widely.','Many Mahajanapadas compete → Magadha wins (iron mines, fertile land, rivers, capitals Rajagriha and Pataliputra, elephants, able kings) → base for the Mauryan empire.'],
analysis:['Why did Magadha win? Combine geography (iron of Chota Nagpur, fertile plains, river routes, safe capitals) with politics (marriage alliances of Bimbisara, aggressive Ajatashatru, Nanda wealth) and military use of elephants.','Buddhism and Jainism were not the only challengers: Ajivikas and Charvakas also rejected Vedic authority, showing an age of debate.','Jainism’s strict discipline limited its mass appeal, while Buddhism’s Middle Path, use of Pali and monastic organisation made it spread faster; but Jainism survived longer in India through trader support.','Gana-sanghas such as the Vajjis show that early India had non-monarchical, council-based governments; the Buddha’s sangha borrowed from them.'],
mind:['6th century BC',[['Economy',['Iron ploughs','Second urbanisation','Punch-marked coins']],['Mahajanapadas',['16 states','Monarchies','Gana-sanghas']],['Buddhism',['Four Noble Truths','Eightfold Path','Pali','Sangha']],['Jainism',['Mahavira','Ahimsa','Anekantavada','Triratna']],['Rise of Magadha',['Bimbisara','Ajatashatru','Udayin','Nandas']]]],
table:['Buddhism and Jainism compared',['Point','Buddhism','Jainism'],[['Founder','Gautama Buddha (566–486 BC)','Vardhamana Mahavira (born 599 BC), 24th Tirthankara'],['Path','Middle Path, Eightfold Path','Strict austerity, triratna'],['Key idea','Four Noble Truths, nirvana','Anekantavada / syadavada, kaivalya'],['Non-violence','Moderate','Extreme'],['Language','Pali','Prakrit (Ardhamagadhi)'],['Texts','Tripitakas, Jatakas','Angas'],['Spread','Asia-wide','Mostly within India, traders']]],

qa:[['Why is the 6th century BC called the age of second urbanisation?',150,'The first urbanisation in India was the Harappan civilization, which ended around 1900 BC. After a gap of more than a thousand years, towns reappeared in the Ganga valley in the 6th century BC, so this phase is called the second urbanisation. Iron tools and ox-drawn ploughs in the fertile, rain-fed middle Ganga plain produced a surplus that could feed people who did not farm. As a result more than sixty towns, such as Pataliputra, Rajagriha, Sravasti, Varanasi, Vaishali, Kaushambi and Ujjain, grew between 600 and 300 BC. Crafts and long-distance trade flourished, and punch-marked coins of silver and copper came into use. Towns became capitals of the Mahajanapadas and centres of new religions. This urban growth created new classes such as merchants, whose rise shaped both politics and religion.'],
['Why did Magadha emerge as the most powerful Mahajanapada?',250,'Of the sixteen Mahajanapadas of the 6th century BC, Magadha in south Bihar grew into an empire. Several factors explain this.\n\nGeography came first. Magadha lay in the fertile middle Ganga plain with good rainfall, so it produced a large food surplus. It was close to the rich iron deposits of the Chota Nagpur region, which supplied better tools and weapons. Its early capital Rajagriha was protected by five hills, and its later capital Pataliputra stood at the meeting of the Ganga and the Son, safe and well placed for river trade. Its forests supplied elephants, which it used in war.\n\nAble and ambitious rulers used these advantages. Bimbisara (544–492 BC) expanded through marriage alliances; his Kosalan queen brought Kashi as dowry, worth a revenue of a lakh of coins, and he conquered Anga. Ajatashatru defeated Kosala and the Vajji confederacy, using new war engines. Udayin fortified Pataliputra. The Shishunagas defeated Avanti, and the Nandas built a huge army and treasury.\n\nEconomic strength supported this power. Trade on the Ganga, punch-marked coins and taxes from farmers gave Magadha the resources to maintain a standing army.\n\nMagadha also faced a divided field: gana-sanghas like the Vajjis and rival monarchies such as Kosala and Avanti weakened each other.\n\nFinally, Magadha was relatively open to new ideas, supporting Buddhist and Jain teachers, which gave its rulers prestige. These advantages allowed Chandragupta Maurya to build the first Indian empire on the base Magadha had created.']]});

X('maurya',{lesson:'NIOS Lesson 5: From Janapadas to Empire; Lesson 30: Early States (Mauryan state)',
brief:'NIOS dates Chandragupta Maurya to 321–297 BC, Bindusara to 297–269 BC and Ashoka to 269–232 BC. Chandragupta inherited the Nanda army and conquered most of the north, the north-west and much of the peninsula; the empire even included Kandahar. The main sources are Kautilya’s Arthashastra, Megasthenes’ Indica and Ashoka’s inscriptions. The king was supreme, helped by a council of ministers (mantriparishad); the samaharta was the chief revenue officer. Besides Magadha, the empire had four provinces with capitals at Taxila, Suvarnagiri, Tosali and Ujjain. Megasthenes says Pataliputra was run by six committees of five members each, and the Greek writer Justin gives Chandragupta 6,00,000 infantry. Ashoka’s Dhamma stressed compassion, charity, truthfulness, purity and gentleness, tolerance between sects, and welfare. NIOS rejects the idea that Ashoka disbanded his army; weak successors, oppressive provincial officers and the cost of a huge army and bureaucracy explain the decline by about 187 BC.',
revise:['Magadha’s resources + Nanda army + Kautilya’s planning → Chandragupta builds the first all-India empire.','Large empire → needs control → provinces, officials, spies, standing army (Arthashastra’s model).','Kalinga war (c. 261 BC) → huge suffering → Ashoka turns to Dhamma → edicts across the empire in Brahmi (and Kharosthi, Greek, Aramaic in the north-west).','Dhamma → tolerance and welfare → holds together a diverse empire; Dhamma Mahamattas spread it.','After Ashoka → weak successors + costly army and bureaucracy + distant provinces break away → Pushyamitra Shunga ends the dynasty (c. 187 BC).'],
analysis:['Was Ashoka’s Dhamma a religion or a policy? Most historians see it as a moral and social code above sects, used also to unite a diverse empire; Ashoka was personally Buddhist.','Did Dhamma cause the decline? NIOS answers no: Ashoka warned forest tribes and kept his army. Economic strain, weak heirs and over-centralisation matter more.','How centralised was the empire? The Arthashastra shows an ideal of tight control, but in practice outer provinces probably had more local freedom than Pataliputra.','Megasthenes’ account must be read carefully: his claims of seven castes and no slavery do not match Indian sources.'],
mind:['Mauryan Empire',[['Rulers',['Chandragupta 321–297','Bindusara 297–269','Ashoka 269–232 BC']],['Sources',['Arthashastra','Indica','Edicts','Mudrarakshasa']],['Administration',['Mantriparishad','Samaharta','4 provinces','6 city committees']],['Dhamma',['Tolerance','Welfare','Non-violence','Mahamattas']],['Decline',['Weak heirs','Costly army','Provinces break','c. 187 BC']]]],

qa:[['Explain the main features of Mauryan administration.',150,'The Mauryan empire (c. 321–187 BC) had a highly organised administration. The king was the supreme authority, advised by a council of ministers called the mantriparishad. A large body of officials ran departments; the samaharta was in charge of revenue collection and the sannidhata of the treasury. The empire was divided into provinces with capitals at Taxila, Ujjain, Tosali and Suvarnagiri, usually ruled by princes, besides the central region of Magadha with Pataliputra as capital. According to Megasthenes, Pataliputra was managed by six committees of five members each, looking after industry, foreigners, births and deaths, trade, manufacture and taxes. A huge standing army and a network of spies kept control. Courts worked from villages to provinces. This system, described in the Arthashastra, made the Mauryas the first strongly centralised state in India.'],
['Examine Ashoka’s policy of Dhamma and its role in the decline of the Mauryan empire.',250,'Ashoka (269–232 BC) is remembered above all for his Dhamma. After the Kalinga war, whose killing and suffering he regretted in his 13th Rock Edict, he gave up conquest by war and adopted conquest by Dhamma.\n\nDhamma was a moral code rather than a religion. Its main ideas, according to his edicts, were compassion (daya), charity (dana), truthfulness, purity and gentleness. He asked people to respect parents, elders and teachers, treat slaves and servants kindly, avoid killing animals, and respect all sects, praising one’s own sect without condemning others. He did welfare works: wells, rest houses, shade trees and hospitals for people and animals.\n\nTo spread it he appointed Dhamma Mahamattas, toured his empire, and inscribed edicts on rocks and pillars in Brahmi, and in Kharosthi, Greek and Aramaic in the north-west. He also sent missionaries abroad, including to Sri Lanka.\n\nDhamma had a political purpose too. The empire contained many peoples, sects and regions; a shared ethic of tolerance helped hold it together and reduced tensions between groups.\n\nSome historians blamed Dhamma for the empire’s fall, arguing that non-violence weakened the army and that favour to Buddhism angered brahmanas. NIOS rejects this: Ashoka kept his army and warned forest tribes of punishment.\n\nThe real causes lay elsewhere: weak successors after Ashoka, the heavy cost of a huge army and bureaucracy, oppressive officials in distant provinces, and the difficulty of controlling such a large area. By about 187 BC the last ruler was killed by Pushyamitra Shunga. Dhamma was thus a bold experiment in moral rule, not the cause of decline.']]});

X('postmaurya',{lesson:'NIOS Lesson 6: Post-Mauryan Developments; Lesson 30 (post-Mauryan states)',
brief:'After the Mauryas fell (c. 187 BC), the Shungas ruled the Ganga region until their last king was killed by his minister Vasudeva, who founded the Kanva dynasty. From the north-west came the Indo-Greeks (Menander the most famous), Shakas (Rudradaman, mid-2nd century AD), Parthians (Takht-i-Bahi inscription near Peshawar) and the Kushanas from western China; Kanishka probably came to the throne in AD 78 and began the Shaka era, ruling from Central Asia to Varanasi. Kalinga revived under Kharavela (Hathigumpha inscription, 1st century BC). The Satavahanas ruled the Deccan from Pratishthana, with districts called aharas, until the early 3rd century AD, when the Ikshvakus followed. Trade boomed: the Dakshinapatha linked north and south, the Greek sailor Hippalus’s use of monsoon winds (AD 45) sped up sea voyages, and the Periplus of the Erythraean Sea describes ports; Rome paid in gold and silver for spices, textiles and jewels. Three art schools grew: Gandhara (Greek style, blue-grey schist), Mathura (first Buddha images, red sandstone) and Amaravati (Krishna–Godavari region, 150 BC–AD 350). In the south, the Sangam age (300 BC–AD 300) had five eco-zones (tinais), hero stones (nadukal), women poets, Murugan worship and the Pandya port of Korkai.',
revise:['Mauryan decline → political vacuum → regional dynasties (Shunga, Kanva, Satavahana, Kalinga) + foreign dynasties from Central Asia.','Foreign rulers (Indo-Greeks, Shakas, Kushanas) → new coins with portraits, gold coins, new cavalry and dress → Indianised over time.','Kushana empire links Central Asia and India → Silk Route trade → wealth for Buddhist monasteries → Mahayana grows (Kanishka’s council).','Monsoon winds known (AD 45) → direct sea trade with Rome → gold flows into south India and the Deccan → ports like Arikamedu, Muziris, Korkai.','Wealth + Buddhism + foreign contact → Gandhara, Mathura and Amaravati art schools → first images of the Buddha.','South: Megalithic chiefdoms → Sangam kingdoms (Chera, Chola, Pandya) → Tamil literature describing a prosperous, unequal society.'],
analysis:['Is this a “dark age” after the Mauryas? No: political division came with growth in trade, crafts, coins, art and literature.','Foreign rulers were absorbed into Indian society: Menander became a Buddhist, Rudradaman wrote in Sanskrit, Kushana kings took Indian titles. This shows India’s capacity to assimilate.','Indo-Roman trade: Pliny complained of Roman gold drain to India; finds of Roman coins in the south support this. But the trade benefited mainly merchants and rulers.','Sangam society: varna was known but less rigid than in the north; yet poems also show war, inequality and dependence on chiefs.'],

qa:[['What was the significance of Indo-Roman trade?',150,'Trade between India and the Roman empire peaked in the 1st and 2nd centuries AD. After the Greek sailor Hippalus showed how to use the monsoon winds around AD 45, ships could cross the Arabian Sea directly, avoiding Persian-controlled land routes. The Periplus of the Erythraean Sea, written in the 1st century AD, lists Indian ports and goods. Rome wanted Indian spices, especially pepper, perfumes, jewels, ivory and fine textiles, and paid largely in gold and silver; hoards of Roman coins found in south India confirm this. The trade enriched ports such as Arikamedu, Muziris and Korkai, encouraged crafts like textiles and bead-making, and funded donations to Buddhist monasteries. It also spread ideas and goods, and the Roman writer Pliny complained that it drained Rome of gold.'],
['Compare the Gandhara, Mathura and Amaravati schools of art.',250,'The post-Mauryan period produced three great schools of sculpture, supported by trade wealth and by Buddhism.\n\nThe Gandhara school grew in the north-west, around Peshawar and Taxila, under the Kushanas. It was strongly influenced by Greek and Roman art. Sculptures in blue-grey schist and stucco show the Buddha with wavy hair, a realistic face, muscular body and heavy, folded robes like a Greek toga. Its themes were almost entirely Buddhist.\n\nThe Mathura school developed at Mathura, also under Kushana patronage, but it was rooted in Indian tradition. It used red spotted sandstone. Its Buddha images are more Indian: a shaven or knotted head, smiling face, broad shoulders and thin, clinging robes. NIOS notes that Mathura probably carved the first images of the Buddha. Unlike Gandhara, it served all faiths, producing Jain tirthankaras, Hindu deities and even portrait statues of Kushana kings.\n\nThe Amaravati school flourished in the lower Krishna and Godavari valleys of Andhra Pradesh between about 150 BC and AD 350, under the Satavahanas and Ikshvakus. Working in white limestone, its artists excelled at narrative relief panels on stupas, showing scenes from the Buddha’s life and Jataka stories with lively, crowded figures in motion. Its influence spread to Sri Lanka and South-East Asia.\n\nIn sum, Gandhara shows foreign influence, Mathura shows indigenous strength and religious variety, and Amaravati shows narrative skill. Together they mark the creation of the Buddha image and a high point in Indian sculpture, reflecting the cultural mixing of the age.']]});

X('gupta',{lesson:'NIOS Lesson 7: The Guptas and their Successors (AD 300–750); Lesson 30 (nature of the Gupta state)',
brief:'NIOS gives Chandragupta I (AD 319–334) as the real founder; his marriage to a Lichchhavi princess, recorded on gold coins, brought legitimacy and strength, and he ruled Magadha, Saket and Prayaga from Pataliputra. Samudragupta (335–375) and Chandragupta II (375–414) expanded the empire; the Chinese pilgrim Fa-Hien (AD 404–411) left a vivid account. Guptas took the title Maharajadhiraja; provinces were called desa or bhukti. Land taxes increased and the judicial system developed, but land grants to brahmanas and officials began a slow decentralisation. Society saw more castes, a slightly better position for shudras, but chandalas treated as untouchables, fifteen types of slaves listed by Narada, and declining status of women: the first evidence of sati is an inscription of AD 510 at Eran. Trade declined compared with earlier times, though Guptas issued many gold dinaras. Culture flourished: the Puranas began, the epics were completed, Kalidasa wrote, Nagara and Dravida temples began, Ajanta paintings were made, Aryabhata stated that the earth rotates, Varahamihira wrote the Panchasiddhantika, and metallurgy produced the rust-free iron pillar.',
revise:['Lichchhavi marriage + Gangetic resources → Chandragupta I founds the empire (c. 319–320).','Samudragupta’s wars (Prayag inscription) → Chandragupta II’s alliance with Vakatakas and victory over Shakas → empire from Bengal to Gujarat → western ports and trade.','Political stability + royal patronage of Sanskrit → Kalidasa, Puranas, science (Aryabhata, Varahamihira) → “golden age” of culture.','Land grants to brahmanas and officials → local power grows → feudal tendencies → weaker centre.','Hun invasions + weak successors + feudatories breaking away → empire ends c. 550 → regional kingdoms (Maitrakas, Maukharis, Pushyabhutis).'],
analysis:['“Golden age” for whom? It was golden for art, literature and science and for the elite, but not for shudras, chandalas, slaves and women, whose condition worsened (sati at Eran, AD 510).','Gupta polity was less centralised than the Mauryan: samantas, land grants and hereditary offices show early feudal features.','Trade decline (end of Roman trade, Hun disruption) and fewer towns contrast with the cultural brilliance; the economy turned more agrarian.','The Gupta age shaped Hindu religion as we know it: Puranic gods, temples, image worship, Bhagavatism and the avatara idea.'],

qa:[['Why is the Gupta period called a golden age? Is the description justified?',150,'The Gupta period (c. AD 320–550) is called a golden age because of its cultural achievements. Kalidasa wrote Abhijnanashakuntalam and Meghaduta; the Ramayana and Mahabharata were completed and the Puranas begun. Aryabhata said the earth rotates on its axis, Varahamihira wrote on astronomy, and metallurgy produced the rust-free Mehrauli iron pillar. Temples in Nagara and Dravida styles began, Ajanta paintings were created, and beautiful gold dinaras were minted. Strong rulers like Samudragupta and Chandragupta II gave peace and patronage. Yet the label needs care. Trade and towns declined, land grants weakened the centre, castes multiplied, chandalas were treated as untouchables, slavery continued, and women’s status fell, as the first sati inscription at Eran (AD 510) shows. So it was a golden age of elite culture, not of the whole society.'],
['Describe the social and economic conditions of the Gupta period.',250,'The Gupta period brought both cultural brilliance and important social and economic changes.\n\nEconomically, agriculture was the base, and the state raised land taxes considerably. Kings increasingly granted land, often with revenue and administrative rights, to brahmanas and officials. These grants extended farming into new areas but also created powerful local landholders and began a slow move towards decentralisation. Trade declined compared with the post-Mauryan age: Roman trade ended, and Hun invasions disrupted Central Asian routes, though India still exported silk and spices to the eastern Roman empire until about AD 550. Many towns shrank. Even so, the Guptas issued a large number of gold coins called dinaras, which show royal wealth rather than everyday trade. Guilds of artisans and merchants remained important.\n\nSocially, the varna order remained central, but castes multiplied as new groups and tribes were absorbed. The position of shudras improved somewhat, as some became peasants, but chandalas were treated as untouchables and lived outside villages, as Fa-Hien noted. Law books mention slavery, and Narada lists fifteen types of slaves.\n\nThe status of women declined further. They could not inherit property, child marriage was encouraged, and the first evidence of sati appears in an inscription of AD 510 at Eran in Madhya Pradesh. Only women of high families received education.\n\nReligion changed too: Puranic Hinduism, temple worship and devotion to Vishnu and Shiva grew, while Buddhism declined slowly.\n\nThus Gupta society was prosperous at the top but increasingly hierarchical, with agrarian expansion and feudal tendencies replacing the trade-based economy of earlier centuries.']]});

X('postgupta',{lesson:'NIOS Lesson 7: The Guptas and their Successors (Maitrakas, Maukharis, Pushyabhutis, Chalukyas, Pallavas)',
brief:'After the Guptas, NIOS describes several regional powers: the Maitrakas of Valabhi in Saurashtra (Valabhi became a centre of learning), the Maukharis of Kanauj (Kanauj replaced Pataliputra as the political centre of the north), and the Pushyabhutis of Thanesar. Harshavardhana (606–647) united his kingdom with that of his widowed sister Rajyashri, moved to Kanauj and was called “lord of the north” (sakalauttarapathanatha). Banabhatta’s Harshacharita and Hsuan Tsang’s account are the main sources; Hsuan Tsang was robbed twice, so law and order was weaker than under the Guptas. After Harsha’s death came confusion until the Gurjara-Pratiharas rose. In the Deccan, the Chalukyas of Badami peaked under Pulakesin II (610–642), who defeated Harsha around 630 and took the title “lord of the south” (dakshinapatheshvara), but was killed by the Pallava Narasimhavarman I around 642. The Pallavas rose under Mahendravarman (600–630) and Narasimhavarman I (630–668), who built stone temples; their feudatories, the Rashtrakutas, overthrew the Badami Chalukyas around 757. In the Tamil land, Alvars and Nayanars spread bhakti.',
revise:['Gupta collapse → regional kingdoms (Maitrakas, Maukharis, Pushyabhutis) → Kanauj becomes the prize city of the north.','Harsha unites Thanesar and Kanauj → “lord of the north” → but cannot cross the Narmada (Pulakesin II, c. 630).','Chalukya–Pallava rivalry → Pulakesin II killed by Narasimhavarman I (c. 642) → rivalry continues for a century.','Royal patronage in the south → rock-cut and stone temples (Mahabalipuram, Badami, Aihole) → Dravida temple style develops.','Tamil bhakti saints (Alvars, Nayanars) → devotion in the people’s language → later Bhakti movement across India.','Chalukyas weakened → Rashtrakutas (c. 757) → Eastern Chalukyas continue in Vengi (Andhra).'],
analysis:['Harsha’s greatness is partly a product of his court poet; Pulakesin II’s Aihole inscription shows his limits. This is a good example of cross-checking sources.','Harsha’s empire was a loose federation of feudatories, unlike the Gupta or Mauryan centralised state.','The Chalukya–Pallava rivalry was not only military: it pushed both dynasties to compete in temple building and patronage, enriching culture.','Bhakti in the south (7th century onwards) is the root of the later all-India Bhakti movement.'],

qa:[['Assess the reign of Harshavardhana.',150,'Harshavardhana (606–647) of the Pushyabhuti dynasty was the last great ruler of north India before the Rajputs. After his brother’s death he united Thanesar with Kanauj, the kingdom of his widowed sister Rajyashri, and made Kanauj his capital, earning the title “lord of the north”. He controlled much of north India and held grand assemblies at Kanauj and Prayag, where he gave away wealth. He supported Buddhism and Nalanda, and was himself a writer of plays. Our knowledge comes mainly from Banabhatta’s Harshacharita and Hsuan Tsang’s account. Yet his limits are clear: Pulakesin II defeated him on the Narmada around 630, his empire was a loose union of feudatories, and Hsuan Tsang was robbed twice, showing weak law and order. After his death in 647 the empire broke up.'],
['Discuss the Chalukya–Pallava rivalry and its cultural significance.',250,'From the 6th to the 8th century, the Chalukyas of Badami and the Pallavas of Kanchi were the two great powers of the Deccan and the south, and their rivalry shaped the region.\n\nThe main causes were control of the fertile land between the Krishna and Tungabhadra and of trade routes and ports. The conflict peaked under Pulakesin II (610–642), who defeated Harsha around 630 and took the title lord of the south. He attacked the Pallava kingdom and nearly reached Kanchi under Mahendravarman I. The Pallava Narasimhavarman I (630–668) struck back, captured Badami and killed Pulakesin II around 642, taking the title Vatapikonda. The struggle continued under their successors until the Rashtrakutas, Chalukya feudatories, overthrew the Badami Chalukyas around 757. A branch, the Eastern Chalukyas of Vengi, survived in Andhra.\n\nThe rivalry had a rich cultural side. Both dynasties competed in building temples. The Pallavas created the rock-cut rathas and the Shore Temple at Mahabalipuram and the Kailasanatha temple at Kanchi, shaping the Dravida style. The Chalukyas built temples at Badami, Aihole and Pattadakal, where Nagara and Dravida styles stand side by side and the Vesara style began.\n\nLiterature and religion flourished too. Ravikirti’s Aihole inscription is fine Sanskrit poetry. In the Pallava land, Alvar and Nayanar saints sang devotional hymns in Tamil, spreading bhakti among ordinary people.\n\nThus a long political struggle, though costly, encouraged both dynasties to display power through art, leaving south India some of its finest early temples and the roots of the Bhakti movement.']]});

X('earlymed',{lesson:'NIOS Lesson 8: India between AD 750–1200; Lesson 30 (Chola administration)',
brief:'NIOS calls AD 750–1200 the early medieval period and insists it is no longer a “dark phase”. In the first part, three powers fought over the Gangetic region and Kanauj: the Gurjara-Pratiharas (founded by Nagabhatta I in Malwa; praised by the Arab Sulaiman for keeping his empire safe), the Palas of Bengal (founded by Gopala) and the Rashtrakutas of the Deccan (founded by Dantidurga). After the Pratiharas declined, Rajput states such as the Chauhans, Chandellas and Paramaras arose and faced the Turkish raids of Mahmud Ghaznavi and Muhammad Ghori. In the south, the Imperial Cholas, founded by Vijayalaya, peaked under Rajaraja I (985–1014) and Rajendra I (1014–1044), with Kulottunga (1070–1120) the last important king. The state was decentralised: kings were assisted by samantas and land grants to brahmanas spread. Castes multiplied and the Rajputs rose, perhaps linked to farming expansion in Rajasthan. Trade declined in 750–1000 but revived after 1000, helped by Arab merchants (Sind from 712). Regional languages grew (the Telugu Mahabharata was completed by Tikkana in the 13th century), Kalhana wrote the Rajatarangini, Jayadeva the Gita Govinda, temples took Nagara, Dravida and Vesara forms, and Indian culture spread to South-East Asia (Shailendra empire).',
revise:['Kanauj = control of the Ganga valley → tripartite struggle (Palas, Pratiharas, Rashtrakutas) → all three exhausted.','Land grants to brahmanas and samantas → local lords grow strong → decentralised (feudal) polity.','Decentralised north + rival Rajput states → no united defence → Mahmud’s raids (1000–1026) and Ghori’s conquest (1192).','South: Chola navy and strong village assemblies → stable empire → overseas trade and expeditions to South-East Asia.','Trade revival after 1000 + temple building + regional languages → strong regional cultures (Telugu, Kannada, Tamil, Bengali).','Cultural contact through trade → Hinduism and Buddhism in South-East Asia (Shailendras, Angkor).'],
analysis:['“Indian feudalism” debate: R.S. Sharma saw decline of trade, land grants and serfdom; others (e.g. B.D. Chattopadhyaya) see integration of local regions and growth of agrarian society rather than decline.','Why did the Turks succeed? Rajput rivalry, outdated tactics (elephants vs mounted archers), and a decentralised military system, not lack of bravery.','The Chola model shows that decentralised local government (Uttaramerur) can coexist with a strong central army and navy.','Rajput origins are debated: foreign descent theory vs local tribes and landholders raised to kshatriya status; NIOS links them with agrarian expansion.'],

qa:[['What were the main features of the Chola administration?',150,'The Imperial Cholas (c. 850–1200) combined a strong centre with lively local government. The king, assisted by ministers and officials, commanded a large army and a powerful navy, which Rajendra I used for expeditions to South-East Asia. The empire was divided into mandalams (provinces), valanadus, nadus and villages. Land revenue was assessed through careful surveys. The most distinctive feature was village self-government. The ur was an assembly of ordinary villagers, the sabha of brahmana villages, and the nagaram of merchants. The Uttaramerur inscriptions of Parantaka I describe how sabha members were chosen by lot (kudavolai) from qualified candidates, and how committees (variyams) managed tanks, gardens, temples and justice. This system kept local affairs efficient and gave stability to a large empire. Revenue came mainly from land, assessed through careful surveys, and temples like Brihadeeswara acted as centres of economy, employment and culture, linking the royal court with village life.'],
['Examine the view that the period AD 750–1200 was a “dark age” in Indian history.',250,'Older historians called AD 750–1200 a dark age, between the Gupta golden age and the Delhi Sultanate. NIOS and modern historians reject this view.\n\nThe dark age view rests on three points. Politically, there was no all-India empire; the Palas, Pratiharas and Rashtrakutas fought endlessly over Kanauj, and Rajput states quarrelled, which made the Turkish conquest easier. Economically, trade and towns declined in 750–1000 and fewer coins circulated. Socially, land grants created powerful local lords, castes multiplied and the position of women and lower groups worsened. Some historians call this Indian feudalism.\n\nHowever, the evidence also shows growth. Regional kingdoms brought stability within their areas and extended farming into forests and new lands. After about 1000, trade revived, with Arab merchants on the western coast and Chola ships in the Bay of Bengal. The Cholas built a strong empire with efficient village assemblies and overseas expeditions.\n\nCulture flourished remarkably. Temple architecture reached great heights in the Nagara, Dravida and Vesara styles, at Khajuraho, Thanjavur and Pattadakal. Regional languages developed: Telugu, Kannada, Bengali and Marathi literature took shape, while Sanskrit produced the Rajatarangini of Kalhana and the Gita Govinda of Jayadeva. Bhakti movements spread in the south, and Indian religion and art travelled to South-East Asia.\n\nTherefore the period is better seen as one of regional growth and cultural creativity. Political division was real, but it was the rise of regions, not the darkness of India, that marks these centuries.']]});

X('c13',{lesson:'NIOS Lesson 9: Establishment and Expansion of the Delhi Sultanate; Lesson 12: Administration; Lesson 31: The Medieval State',
brief:'NIOS gives five Sultanate dynasties: Mamluks (1206–1290), Khaljis (1290–1320), Tughlaqs (1320–1412), Sayyids (1412–1451) and Lodis (1451–1526). The background includes the rise of Islam, the Arab conquest of Sind under Muhammad bin Qasim (712), Mahmud of Ghazni’s 17 raids (1000–1026, including Somnath in 1025) and Muhammad Ghori, who lost to the Chalukya ruler of Gujarat at Anhilwara (1178) and at the first battle of Tarain (1191) but won the second (1192). Aibak (1206–10) was a former slave general; Iltutmish (1210–36) consolidated the state, got a letter of investiture from the Caliph (1229) and shaped the iqta, army and currency (silver tanka of 175 grains). Raziya (1236–40) was resisted by the Turkish nobles (Chahalgani), whom Balban (1266–87) crushed. Jalaluddin Khalji’s rise in 1290 was a “dynastic revolution”. Alauddin (1296–1316) controlled markets and conquered Gujarat, Ranthambore, Chittor, Malwa and, through Malik Kafur after 1309, the Deccan, including Warangal. Muhammad bin Tughlaq shifted the capital to Daulatabad (1326–27). Mongol attacks and Timur’s raid (1398) weakened the Sultanate. NIOS quotes a scholar: the Sultanate was born at Tarain in 1192 and died at Panipat in 1526.',
revise:['Rajput disunity + Turkish cavalry → Tarain (1192) → Turkish rule in north India.','New state needs control → iqta system (revenue assignments for nobles and soldiers) + tanka and jital coins (Iltutmish).','Strong nobles (Chahalgani) vs Sultan → Raziya overthrown → Balban crushes nobles and raises royal prestige (sijda, paibos).','Mongol threat → need for a large army → Alauddin’s market control and revenue reforms → expansion into Rajasthan and the Deccan.','Over-expansion + experiments (Daulatabad, token currency) → revolts under Muhammad bin Tughlaq → new states (Vijayanagara 1336, Bahmani 1347).','Weakened centre + Timur (1398) → Sayyids and Lodis rule a small kingdom → Babur at Panipat (1526).'],
analysis:['Was the Sultanate a theocracy? Sultans sought caliphal legitimacy and followed Islamic law in name, but in practice policy was guided by state needs (zawabit, secular regulations); Alauddin said he did what was good for the state.','The Sultanate was not a “slave” regime in the modern sense: mamluks were trained military slaves who became nobles and kings.','Muhammad bin Tughlaq: brilliant but impractical? His ideas (token currency, a central capital) were bold, but poor execution and timing caused failure.','The Sultanate created an Indo-Islamic culture: Persian administration, new architecture (true arch, dome), Urdu/Hindavi, and Sufi movements.'],

qa:[['Explain the market reforms of Alauddin Khalji.',150,'Alauddin Khalji (1296–1316) controlled markets to maintain a large army against the Mongols without raising salaries. He fixed low prices for grain, cloth, horses, cattle and slaves, and set up separate markets for each. Grain was collected as land revenue in kind and stored in royal granaries, so supply never failed. Merchants were registered and had to sell at fixed rates; peasants had to sell surplus to registered traders at the field. Officers called shahna-i-mandi supervised markets, spies reported on them, and cheating was punished severely, even by cutting flesh for short weight. The reforms kept prices stable even during droughts and allowed Alauddin to pay soldiers modestly. However, they depended on strict enforcement and his personal authority, and they ended soon after his death.'],
['Assess the achievements and failures of Muhammad bin Tughlaq.',250,'Muhammad bin Tughlaq (1325–1351) is one of the most debated rulers of medieval India. He was learned, imaginative and ambitious, but many of his projects failed.\n\nAs prince Ulugh Khan he conquered Warangal (1323) and later annexed much of the south, so the Sultanate reached its largest extent under him. He wanted to rule the whole of India effectively.\n\nHis first famous experiment was shifting the capital from Delhi to Devagiri, renamed Daulatabad, around 1326–27. Daulatabad was central to his large empire and safe from Mongols. But forcing the population of Delhi to move over a long distance caused great suffering, and he soon had to return.\n\nSecond, he issued token currency of bronze or copper, to be valued like silver coins. The idea was modern, but without control over minting, people forged the coins, and the treasury had to redeem them, causing heavy losses.\n\nThird, raising taxes in the Doab during a famine led to peasant flight and revolt, although he later gave loans (taqavi) and created an agriculture department. He also planned expeditions to Khurasan and Qarachil (in the Himalaya) that failed and wasted resources.\n\nAs a result revolts broke out across the empire. The south broke away: Vijayanagara (1336) and the Bahmani kingdom (1347) were founded, and Bengal became independent.\n\nIn sum, his plans were often rational and ahead of their time, but poor planning, bad timing and a harsh temperament turned them into failures. His reign marks both the greatest extent of the Sultanate and the start of its decline.']]});

X('c14',{lesson:'NIOS Lesson 11: Emergence of Regional States (12th–18th century); Lesson 9 (later Sultanate)',
brief:'NIOS explains that regional states arose from the internal weakness of the Delhi Sultanate and later the Mughal decline. After Firuz Tughlaq, Timur’s invasion (1398) gave the final blow, and many provinces became independent. Jaunpur (Sharqi dynasty, “master of the east”) became a centre of culture; Kashmir got its first Muslim ruler, Shamsuddin Shah, in 1339, and its greatest ruler Zainul Abidin (1420–1470) was known for tolerance; Bengal was united by Ilyas Shah in 1342; Gujarat became independent under Zafar Khan (Muzaffar Shah), Ahmad Shah founded Ahmedabad (1413), and Mahmud Begarha fought the Portuguese (1507). In the Deccan, the Bahmani kingdom divided its nobles into Deccanis and Afaqis (newcomers), and minister Mahmud Gawan tried to end their quarrels. The Vijayanagara empire was founded in 1336 by Harihara and Bukka, who had served Muhammad bin Tughlaq; it fought the Bahmanis over the Raichur doab. Both kingdoms used firearms and foreign experts, and bankers (mahajans) grew influential. Note: NIOS calls Krishnadevaraya the founder of the Tuluva dynasty; most texts give Vira Narasimha as founder and Krishnadevaraya as its greatest king.',
revise:['Tughlaq decline + Timur (1398) → governors declare independence → regional kingdoms (Jaunpur, Bengal, Gujarat, Malwa, Kashmir).','Regional courts patronise local languages and architecture → regional cultures flourish (Bengali, Gujarati, Kashmiri, Deccani styles).','Deccan: Bahmanis (1347) vs Vijayanagara (1336) → Raichur doab wars → constant military spending, use of firearms.','Bahmani noble conflict (Deccanis vs Afaqis) + Mahmud Gawan’s execution (1481) → split into five Deccan Sultanates.','Five Sultanates unite → defeat Vijayanagara at Talikota (1565).','Weak Lodis → regional states and nobles invite Babur → Mughal conquest absorbs regional states one by one.'],
analysis:['Regional states should not be seen only as “breakaways”; they reflected regional identities, languages and economies that grew under them.','Religious policy varied: Zainul Abidin (Kashmir) and Hussain Shah (Bengal) were tolerant patrons of local culture, showing the diversity of Muslim rule.','The Vijayanagara–Bahmani conflict was about land and trade (Raichur doab, horse trade, ports), not only religion; both employed soldiers of other faiths.','Firearms and foreign mercenaries changed warfare in the Deccan before the Mughals arrived.'],

qa:[['Why did regional kingdoms emerge in the 14th and 15th centuries?',150,'Regional kingdoms rose mainly because the Delhi Sultanate weakened. Muhammad bin Tughlaq’s failed experiments, revolts and the difficulty of controlling distant provinces encouraged governors to break away; Vijayanagara (1336), the Bahmani kingdom (1347) and Bengal (1342) became independent. After Firuz Tughlaq, weak successors could not hold the empire, and Timur’s sack of Delhi in 1398 destroyed its prestige and wealth. Governors in Gujarat, Malwa and Jaunpur then declared independence. Distance and poor communication made control from Delhi hard, while provinces had their own resources and local supporters. Regional rulers also gained support by patronising local languages, saints and architecture. These states lasted until the Mughals, from 1526, gradually absorbed them into their empire. Regional states also reflected regional identities: their courts promoted local languages, saints and architecture, such as Bengali literature under Hussain Shah, Gujarat’s Ahmedabad mosques and Kashmir’s tolerant rule under Zainul Abidin.'],
['Explain the causes and consequences of the conflict between the Vijayanagara and Bahmani kingdoms.',250,'From their foundation in the mid-14th century, Vijayanagara (1336) and the Bahmani kingdom (1347) fought almost continuously for about two centuries.\n\nThe main cause was geography. Both kingdoms could expand only across the Tungabhadra, so they clashed over the fertile Raichur doab between the Krishna and Tungabhadra, and over the Krishna–Godavari delta with its rich farmland and ports. Control of the western coast mattered too, because ports like Goa handled the import of horses from Arabia and Persia, vital for cavalry. Diamond mines such as those near Golconda added to the stakes. Religion was sometimes used to rally soldiers, but it was not the root cause: Vijayanagara’s Devaraya II enrolled Muslim archers, and the Bahmanis also used Hindu chiefs.\n\nThe conflict had important consequences. First, both states built large armies and adopted firearms, employing Turkish and Portuguese experts, which changed Deccan warfare. Second, the cost of war pushed both states to raise revenue and rely on bankers and military chiefs, the nayakas in Vijayanagara and the nobles in the Bahmani state. Third, it weakened the Bahmanis internally: rivalry between Deccani and Afaqi nobles and the execution of Mahmud Gawan in 1481 led to the kingdom splitting into five Deccan Sultanates.\n\nFinally, these Sultanates united against Vijayanagara and defeated it at Talikota in 1565, ending its imperial phase. The long conflict thus exhausted the Deccan and made it easier for the Mughals, and later the Europeans, to extend their power there. It also produced a rich mixed culture, seen in Deccani architecture and Telugu–Persian court life.']]});

X('mughal',{lesson:'NIOS Lesson 10: Establishment of the Mughal Rule; Lesson 12: Administrative System; Lesson 13: Economy; Lesson 31: The Medieval State',
brief:'Babur, who became ruler of Farghana at twelve (1494), moved towards India from 1517, took Bhira, Sialkot and Lahore, and defeated Ibrahim Lodi at Panipat (1526) with about 12,000 men against 1,00,000, using artillery and tactics; he beat Rana Sanga at Khanwa (1527) and Medini Rai at Chanderi (1528). Humayun faced the Afghans and Bahadur Shah of Gujarat and lost to Sher Shah, who founded the second Afghan empire (1540–1555). Humayun regained Delhi in 1555 and died in 1556. Bairam Khan was regent until 1560. Akbar took Rajasthan by 1570, Gujarat (1572), Bengal (1576), Kashmir (1586) and Qandahar (1595), and pressed into the Deccan. Shah Jahan signed treaties with Bijapur and Golconda (1636), and Aurangzeb annexed them by 1687, while fighting the Marathas until 1707. NIOS’s administration lesson explains the mansab system: zat (personal rank and pay) and sawar (horsemen to maintain), with Jahangir adding du-aspa sih-aspa. Revenue came from kharaj (one-sixth to one-third of produce); jagirs replaced iqtas; the cavalry was the army’s backbone.',
revise:['Lodi weakness + Babur’s artillery and tulughma tactics → Panipat 1526 → Mughal rule begins.','Humayun’s divided resources + Afghan strength → Sher Shah (1540) → his reforms (rupiya, roads, land survey) later used by Akbar.','Akbar’s conquests need a loyal ruling class → mansabdari (zat and sawar) + jagirs that were transferable → nobles depend on the emperor.','Rajput alliances + sulh-i-kul (peace with all) + abolition of jizya → wide support and a stable empire.','Revenue (zabt, Todar Mal) → steady income → art, architecture and courts flourish (Shah Jahan).','Aurangzeb’s Deccan wars + jagir crisis + revolts → empire overstretched → decline after 1707.'],
analysis:['Akbar’s religious policy (Ibadat Khana, Din-i-Ilahi, sulh-i-kul) was partly political: it united a diverse nobility and won Rajput loyalty.','The jagirdari crisis (too many mansabdars, too few productive jagirs) is a key structural explanation of Mughal decline, beyond Aurangzeb’s personal policies.','Aurangzeb’s policies are debated: religious orthodoxy (jizya 1679) vs political necessity; his Deccan wars drained resources more than religion did.','The Mughal state was a “patrimonial-bureaucratic” empire: highly centralised in theory but dependent on negotiating with zamindars and local chiefs.'],
mind:['Mughal Empire',[['Founding',['Babur','Panipat 1526','Khanwa 1527']],['Afghan interlude',['Sher Shah 1540–45','Rupiya','GT Road']],['Akbar',['Mansabdari','Zabt','Rajput policy','Sulh-i-kul']],['Expansion',['Gujarat 1572','Bengal 1576','Deccan','Golconda 1687']],['Economy',['Kharaj 1/6–1/3','Jagirs','Indigo, cotton','Trade']],['Decline',['Deccan wars','Jagir crisis','1707']]]],

qa:[['Explain the mansabdari system of the Mughals.',150,'The mansabdari system, organised by Akbar, was the backbone of Mughal administration. Every officer, civil or military, was given a mansab, a numerical rank ranging from 10 to 10,000. From about 1595 the rank had two parts: zat, which fixed the officer’s personal status and salary, and sawar, which fixed the number of horsemen he had to maintain for the emperor. Mansabdars were paid either in cash or through a jagir, the right to collect revenue from an area. Jagirs were transferred often so that officers could not build local power. Appointment, promotion and dismissal depended on the emperor, which made nobles loyal to him. Jahangir added the du-aspa sih-aspa provision for extra horses. The system gave the empire a disciplined ruling class, but later too many mansabdars chasing too few jagirs created a crisis.'],
['Discuss the causes of the decline of the Mughal empire.',250,'The Mughal empire, at its height under Akbar and Shah Jahan, declined rapidly after Aurangzeb’s death in 1707. Historians explain this by combining several causes.\n\nFirst, Aurangzeb’s long Deccan wars, from 1682 until 1707, drained the treasury and kept the emperor away from north India for decades. The annexation of Bijapur and Golconda (1686–87) brought new territories but also endless war with the Marathas.\n\nSecond, there was a structural crisis in the jagirdari system. The number of mansabdars grew, especially with Deccani nobles, but productive land for jagirs did not. Nobles competed for good jagirs and squeezed peasants for quick income, since they could be transferred, which led to peasant flight and revolts by Jats, Satnamis and Sikhs.\n\nThird, religious and political policies alienated groups. Aurangzeb reimposed jizya in 1679, quarrelled with Rajput houses such as Marwar, and executed Guru Tegh Bahadur. Whether motivated by faith or politics, these steps reduced support from important allies.\n\nFourth, the later Mughals were weak. Wars of succession, puppet emperors such as Farrukhsiyar controlled by the Sayyid brothers, and court factions destroyed central authority.\n\nFifth, provincial governors created their own states: Hyderabad (Nizam-ul-Mulk, 1724), Bengal and Awadh. The Marathas expanded north.\n\nFinally, foreign invasions by Nadir Shah (1739) and Ahmad Shah Abdali emptied the treasury, and the European companies, especially the English, used the vacuum to gain power.\n\nThus decline was not due to one ruler but to over-expansion, institutional crisis, weak successors and external blows working together.']]});

X('maratha',{lesson:'NIOS Lesson 10 (Shivaji) and Lesson 15: Understanding Eighteenth Century India (Marathas, Sikhs)',
brief:'NIOS describes Shivaji starting his campaigns in 1656 by taking Javli, raiding Bijapur and Mughal lands, signing the Treaty of Purandar (1665) with the Mughals, escaping from Agra to Raigarh (1666), plundering Surat again (1670), and being crowned Chhatrapati at Raigarh in 1674; he died in 1680. His son Sambhaji was executed by Aurangzeb in 1689, and Rajaram died in 1700. Under Shahu (from 1708, ruling about four decades) the Peshwas became the real power, and Maratha chiefs built their own states: the Bhonsles of Nagpur, the Gaikwads of Baroda, the Holkars of Indore (Ahalya Bai ruled 1765–1794) and the Sindhias of Gwalior (Mahadaji, 1761–1794, an innovative military commander who later controlled Delhi). Defeat at the third battle of Panipat (1761) was a setback; Daulat Rao Sindhia lost to the British in 1803. For the Sikhs, NIOS notes Guru Nanak’s rejection of caste, the Khalsa (1699), Banda Bahadur’s struggle against the Mughals, and the rise of Sikh chiefs like Jassa Singh Ahluwalia after Abdali’s invasions.',
revise:['Deccan Sultanate service + hilly forts + Bhakti-inspired regional pride → Shivaji builds an independent Maratha state.','Small state + strong forts and navy + chauth and sardeshmukhi from neighbours → resources for war against Mughals.','Aurangzeb’s Deccan wars (1681–1707) → Marathas survive by guerrilla war → Mughals exhausted.','Shahu + Peshwas → Maratha confederacy expands north → chiefs (Sindhia, Holkar, Gaikwad, Bhonsle) become semi-independent.','Panipat 1761 (Abdali) → huge loss → recovery under Mahadaji Sindhia → but internal rivalry → British victories (1803, 1818).','Sikhs: Guru Nanak’s teaching → Khalsa (1699) → resistance under Banda Bahadur → misls → Ranjit Singh’s kingdom.'],
analysis:['Were the Marathas only raiders? Their chauth system was predatory to neighbours, but they also built a revenue administration and a political identity (Hindavi Swarajya).','The confederacy structure gave flexibility but made unity difficult; this explains both rapid expansion and defeat by the British.','Panipat (1761) did not end Maratha power; within a decade they were back in Delhi. The real end came with internal disunity and British subsidiary treaties.','The Sikh movement changed from a religious community to a military-political power because of Mughal repression; this shows how state policy shapes religious movements.'],
mind:['Marathas and Sikhs',[['Shivaji',['Javli 1656','Purandar 1665','Coronation 1674','Ashtapradhan']],['Peshwas',['Balaji Vishwanath','Baji Rao I','Nana Saheb','Panipat 1761']],['Confederacy',['Sindhia','Holkar','Gaikwad','Bhonsle']],['Sikhs',['Nanak','Arjan','Khalsa 1699','Banda Bahadur']],['End',['Anglo-Maratha wars','1818','Punjab 1849']]]],
