<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="75%">
      <stop offset="0" stop-color="#f4ead2"/>
      <stop offset="1" stop-color="#d9c39a"/>
    </radialGradient>
    <linearGradient id="leaf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5f9d47"/>
      <stop offset="1" stop-color="#2f5a25"/>
    </linearGradient>
    <radialGradient id="idli" cx="45%" cy="35%" r="70%">
      <stop offset="0" stop-color="#fffdf7"/>
      <stop offset=".7" stop-color="#f6eedb"/>
      <stop offset="1" stop-color="#e3d3ad"/>
    </radialGradient>
    <radialGradient id="chutney" cx="40%" cy="35%" r="70%">
      <stop offset="0" stop-color="#d4e6b3"/>
      <stop offset="1" stop-color="#9fbf74"/>
    </radialGradient>
    <radialGradient id="redchutney" cx="40%" cy="35%" r="70%">
      <stop offset="0" stop-color="#e58a4e"/>
      <stop offset="1" stop-color="#b8552a"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#bg)"/>
  <!-- wooden table lines -->
  <g stroke="#c4a77a" stroke-width="2" opacity=".45">
    <path d="M0 120 H800"/><path d="M0 260 H800"/><path d="M0 400 H800"/><path d="M0 540 H800"/>
  </g>

  <!-- jowar stalks -->
  <g transform="translate(70 40) rotate(-12)">
    <path d="M40 0 C42 120 44 220 48 330" stroke="#a8823f" stroke-width="5" fill="none"/>
    <g fill="#d9a441">
      <ellipse cx="30" cy="20" rx="13" ry="7" transform="rotate(-35 30 20)"/>
      <ellipse cx="52" cy="30" rx="13" ry="7" transform="rotate(35 52 30)"/>
      <ellipse cx="29" cy="42" rx="13" ry="7" transform="rotate(-35 29 42)"/>
      <ellipse cx="53" cy="52" rx="13" ry="7" transform="rotate(35 53 52)"/>
      <ellipse cx="30" cy="64" rx="13" ry="7" transform="rotate(-35 30 64)"/>
      <ellipse cx="54" cy="74" rx="13" ry="7" transform="rotate(35 54 74)"/>
      <ellipse cx="40" cy="4" rx="7" ry="11"/>
    </g>
    <path d="M46 180 C80 160 110 170 130 150" stroke="#6f9a4a" stroke-width="6" fill="none" stroke-linecap="round"/>
  </g>

  <!-- shadow -->
  <ellipse cx="420" cy="420" rx="330" ry="120" fill="#7a5330" opacity=".28" filter="url(#soft)"/>

  <!-- banana leaf -->
  <path d="M110 360 C160 220 420 170 700 230 C740 300 700 440 520 480 C330 520 150 470 110 360 Z" fill="url(#leaf)"/>
  <path d="M130 360 C330 330 520 300 690 245" stroke="#9cc77d" stroke-width="4" fill="none" opacity=".8"/>
  <g stroke="#3f7330" stroke-width="2" opacity=".55" fill="none">
    <path d="M200 345 C210 300 230 270 250 250"/><path d="M290 335 C300 290 320 250 345 225"/>
    <path d="M380 322 C395 280 415 240 445 212"/><path d="M470 308 C485 270 510 235 540 212"/>
    <path d="M560 290 C575 262 600 240 625 225"/>
    <path d="M220 350 C240 400 270 430 300 455"/><path d="M320 340 C345 395 375 430 410 465"/>
    <path d="M420 325 C450 385 480 420 520 455"/><path d="M520 305 C550 360 580 395 620 420"/>
  </g>

  <!-- idlis -->
  <g>
    <g transform="translate(300 330)">
      <ellipse cx="0" cy="18" rx="88" ry="38" fill="#cdb88c"/>
      <ellipse cx="0" cy="0" rx="88" ry="40" fill="url(#idli)"/>
      <g fill="#d4c39c"><circle cx="-30" cy="-6" r="3"/><circle cx="12" cy="-14" r="2.5"/><circle cx="34" cy="6" r="2.5"/><circle cx="-6" cy="12" r="2"/><circle cx="-50" cy="8" r="2"/></g>
    </g>
    <g transform="translate(470 310)">
      <ellipse cx="0" cy="18" rx="88" ry="38" fill="#cdb88c"/>
      <ellipse cx="0" cy="0" rx="88" ry="40" fill="url(#idli)"/>
      <g fill="#d4c39c"><circle cx="-24" cy="-8" r="3"/><circle cx="20" cy="-12" r="2.5"/><circle cx="40" cy="8" r="2"/><circle cx="0" cy="14" r="2.5"/></g>
    </g>
    <g transform="translate(390 250)">
      <ellipse cx="0" cy="18" rx="84" ry="36" fill="#cdb88c"/>
      <ellipse cx="0" cy="0" rx="84" ry="38" fill="url(#idli)"/>
      <g fill="#d4c39c"><circle cx="-28" cy="-4" r="3"/><circle cx="14" cy="-12" r="2.5"/><circle cx="36" cy="4" r="2"/><circle cx="-4" cy="12" r="2"/></g>
    </g>
  </g>

  <!-- steam -->
  <g stroke="#fffdf7" stroke-width="6" fill="none" stroke-linecap="round" opacity=".75">
    <path d="M360 190 C340 160 380 140 360 105"/>
    <path d="M405 180 C385 145 430 125 410 85"/>
    <path d="M450 190 C430 160 470 140 452 110"/>
  </g>

  <!-- coconut chutney bowl -->
  <g transform="translate(600 400)">
    <ellipse cx="0" cy="22" rx="70" ry="22" fill="#5e3f24" opacity=".5"/>
    <path d="M-68 0 Q0 80 68 0 Z" fill="#94693d"/>
    <ellipse cx="0" cy="0" rx="68" ry="20" fill="#7a5330"/>
    <ellipse cx="0" cy="2" rx="58" ry="15" fill="url(#chutney)"/>
    <g fill="#2f5a25"><circle cx="-16" cy="-1" r="3"/><circle cx="8" cy="4" r="2.5"/><circle cx="24" cy="-2" r="2"/></g>
    <g fill="#3a2a1a"><circle cx="-4" cy="-3" r="2"/><circle cx="16" cy="2" r="1.8"/><circle cx="-28" cy="3" r="1.8"/></g>
    <path d="M-30 -4 q8 -6 16 0" stroke="#3f7330" stroke-width="3" fill="none"/>
  </g>

  <!-- red chutney bowl -->
  <g transform="translate(205 455)">
    <ellipse cx="0" cy="18" rx="58" ry="18" fill="#5e3f24" opacity=".5"/>
    <path d="M-56 0 Q0 66 56 0 Z" fill="#94693d"/>
    <ellipse cx="0" cy="0" rx="56" ry="17" fill="#7a5330"/>
    <ellipse cx="0" cy="2" rx="47" ry="12" fill="url(#redchutney)"/>
    <g fill="#3a2a1a"><circle cx="-10" cy="0" r="2"/><circle cx="12" cy="3" r="1.8"/></g>
  </g>

  <!-- curry leaves -->
  <g fill="#3f7330">
    <ellipse cx="690" cy="300" rx="22" ry="9" transform="rotate(-25 690 300)"/>
    <ellipse cx="720" cy="318" rx="20" ry="8" transform="rotate(15 720 318)"/>
    <ellipse cx="120" cy="520" rx="20" ry="8" transform="rotate(20 120 520)"/>
  </g>
  <!-- jowar grains -->
  <g fill="#e2ad45">
    <circle cx="680" cy="520" r="6"/><circle cx="700" cy="530" r="5.5"/><circle cx="690" cy="545" r="6"/>
    <circle cx="712" cy="512" r="5"/><circle cx="668" cy="538" r="5"/><circle cx="725" cy="540" r="5.5"/>
  </g>
</svg>
