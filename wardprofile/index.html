<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<title>Ward Profile – Guntakal</title>

<meta name="theme-color" content="#0f5c5c">

<style>
:root{--c:#0f5c5c;--c2:#167b7b;--acc:#f29d38;--bg:#f2f6f6;--card:#fff;--ink:#1d2a2a;--mute:#5f6f6f;--line:#d8e3e3;--ok:#1f8a4c;--warn:#b5660c;--bad:#b3261e}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Telugu",sans-serif;background:var(--bg);color:var(--ink);font-size:16px;line-height:1.5}
a{color:var(--c2)}
button,input,select,textarea{font:inherit}
header{position:sticky;top:0;z-index:1000;background:linear-gradient(100deg,#0b4747,var(--c) 55%,#1d8a8a);color:#fff;box-shadow:0 3px 10px rgba(0,0,0,.2)}
.bar{margin:auto;display:flex;align-items:center;gap:8px;padding:9px 12px}
.brand{flex:1;color:#fff;text-decoration:none;font-weight:800;font-size:18px;line-height:1.2}
.brand small{display:block;font-weight:500;font-size:12px;opacity:.85}
.lang{display:flex;border:1px solid rgba(255,255,255,.6);border-radius:20px;overflow:hidden}
.lang button{background:none;border:0;color:#fff;padding:4px 10px;cursor:pointer;font-size:14px}
.lang button.on{background:#fff;color:var(--c);font-weight:700}
.hbtn{background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.5);color:#fff;border-radius:20px;padding:4px 10px;cursor:pointer;font-size:14px;white-space:nowrap}
main{max-width:980px;margin:auto;padding:12px 12px 40px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:0 0 12px;box-shadow:0 1px 3px rgba(0,0,0,.04)}
h1{font-size:22px;margin:4px 0 8px}h2{font-size:18px;margin:0 0 8px;color:var(--c)}h3{font-size:16px;margin:10px 0 6px}
.mute{color:var(--mute);font-size:14px}
.btn{display:inline-flex;align-items:center;gap:6px;background:var(--c);color:#fff;border:0;border-radius:10px;padding:10px 14px;cursor:pointer;text-decoration:none;font-weight:600}
.btn.alt{background:#fff;color:var(--c);border:1.5px solid var(--c)}
.btn.sm{padding:6px 10px;font-size:14px;border-radius:8px}
.btn.red{background:var(--bad)}
.btn.orange{background:var(--acc);color:#222}
.btn:disabled{opacity:.5}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.stat{background:#f6fafa;border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center}
.stat b{display:block;font-size:24px;color:var(--c)}
.stat span{font-size:13px;color:var(--mute)}
label{display:block;font-size:14px;font-weight:600;margin:10px 0 4px}
input,select,textarea{width:100%;padding:10px;border:1.5px solid var(--line);border-radius:10px;background:#fff}
input:focus,select:focus,textarea:focus{outline:2px solid #9fd3d3;border-color:var(--c2)}
textarea{min-height:70px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
@media(max-width:520px){.two{grid-template-columns:1fr}}
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 12px}
.tabs button{flex:none;border:1.5px solid var(--c);background:#fff;color:var(--c);border-radius:20px;padding:6px 14px;cursor:pointer;font-weight:600}
.tabs button.on{background:var(--c);color:#fff}
.map{height:340px;border-radius:12px;border:1px solid var(--line);margin:8px 0;background:#e9f0f0}
.map.small{height:240px}
.list .it{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.list .it:last-child{border-bottom:0}
.it .grow{flex:1;min-width:0}
.it .nm{font-weight:700}
.bar2{height:8px;border-radius:6px;background:#e3ecec;overflow:hidden;margin-top:4px}
.bar2 i{display:block;height:100%;background:linear-gradient(90deg,var(--acc),var(--ok))}
.pill{display:inline-block;font-size:12px;padding:2px 8px;border-radius:10px;background:#e6f2f2;color:var(--c);font-weight:600}
.pill.g{background:#e5f4ea;color:var(--ok)}.pill.o{background:#fdf0dc;color:var(--warn)}.pill.r{background:#fbe6e4;color:var(--bad)}
.thumbs{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.thumbs img{width:76px;height:76px;object-fit:cover;border-radius:8px;border:1px solid var(--line);cursor:pointer}
.thumbs .t{position:relative}
.thumbs .t button{position:absolute;top:-6px;right:-6px;background:var(--bad);color:#fff;border:0;border-radius:50%;width:22px;height:22px;cursor:pointer;line-height:20px}
.av{width:56px;height:56px;border-radius:50%;object-fit:cover;background:#dfeaea;flex:none;display:flex;align-items:center;justify-content:center;font-size:24px}
.msg{padding:10px 12px;border-radius:10px;margin:8px 0;font-size:15px}
.msg.ok{background:#e5f4ea;color:#14502d}.msg.err{background:#fbe6e4;color:#7a1a14}.msg.info{background:#e8f1fb;color:#1b3f66}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:7px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{background:#eef5f5;position:sticky;top:0}
.tw{overflow:auto;max-height:70vh;border:1px solid var(--line);border-radius:10px}
.hero{background:linear-gradient(135deg,#e2f3f3,#fff6ea);border-color:#cfe5e5}
.steps{margin:6px 0 0;padding-left:20px}
.lb{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:3000;display:flex;align-items:center;justify-content:center}
.lb img{max-width:96vw;max-height:90vh;border-radius:8px}
.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:#1d2a2a;color:#fff;padding:10px 16px;border-radius:10px;z-index:4000;max-width:90vw}
.selbig{font-weight:700;font-size:16px;border-color:var(--c2)}
.emo{font-size:22px;width:34px;text-align:center;flex:none}
/* side menu */
.shell{display:flex;align-items:flex-start}
#side{flex:none;width:78px;position:sticky;top:var(--hh,58px);height:calc(100vh - var(--hh,58px));overflow-y:auto;z-index:900;
 background:linear-gradient(180deg,#062a2a 0%,#0b4747 45%,#14385a 100%);border-right:3px solid #d4a017;box-shadow:3px 0 12px rgba(0,0,0,.25);padding-bottom:30px}
#side .ni{display:flex;flex-direction:column;align-items:center;gap:3px;width:100%;padding:11px 3px;color:#d9ecec;text-decoration:none;font-size:11px;line-height:1.15;text-align:center;
 background:none;border:0;border-left:4px solid transparent;border-bottom:1px solid rgba(255,255,255,.07);cursor:pointer;word-break:break-word;font-family:inherit}
#side .ni .ic{font-size:22px;filter:drop-shadow(0 1px 1px rgba(0,0,0,.4))}
#side .ni:hover{background:rgba(255,255,255,.06)}
#side .ni.on{background:linear-gradient(90deg,rgba(242,193,78,.28),rgba(242,193,78,.06));border-left-color:#f2c14e;color:#fff;font-weight:700}
#side .grp>.ni.on{background:rgba(242,193,78,.12)}
#side .sub{display:none;background:rgba(0,0,0,.22);box-shadow:inset 0 3px 6px rgba(0,0,0,.25)}
#side .grp.open>.sub{display:block}
#side .sub .ni{font-size:10px;padding:8px 2px}
#side .sub .ni .ic{font-size:18px}
#side .cap{color:#f2c14e;font-size:10px;text-align:center;padding:8px 2px 4px;letter-spacing:.5px;text-transform:uppercase}
.shell>main{flex:1;min-width:0;margin:0 auto}
@media(min-width:900px){
 #side{width:236px}
 #side .ni{flex-direction:row;gap:12px;font-size:15px;text-align:left;padding:12px 16px}
 #side .ni .ic{font-size:20px;width:26px;text-align:center}
 #side .sub .ni{font-size:14px;padding:9px 16px 9px 30px}
 #side .sub .ni .ic{font-size:17px}
 #side .cap{text-align:left;padding:12px 18px 4px;font-size:11px}
}
.hbtn.ic{font-size:18px;padding:3px 10px;position:relative}
.hbtn:disabled{opacity:.4}
.hbtn sup{position:absolute;top:-6px;right:-6px;background:#f2c14e;color:#222;border-radius:10px;font-size:11px;padding:0 5px;font-weight:700}
@media(max-width:560px){.brand small{display:none}.brand{font-size:15px}.acnm{display:none}.lang button{padding:4px 7px}}
.secttl{display:flex;align-items:center;gap:8px;margin:2px 0 10px}
.secttl h1{margin:0}
/* report */
.rep h2{border-bottom:2px solid var(--c);padding-bottom:4px;margin-top:6px}
.rep table{font-size:13px}
.rep td,.rep th{border:1px solid #c9d6d6}
.rep .kv th{width:42%;background:#f1f6f6}

 .shell{display:block}
 main{max-width:none;padding:0}
 body{background:#fff;font-size:12px}
 .card{box-shadow:none;border:0;padding:4px 0;break-inside:avoid}
 .rep table{break-inside:auto}.rep tr{break-inside:avoid}
 th{position:static}
}
footer{text-align:center;color:var(--mute);font-size:13px;padding:20px 10px 30px}
.chk{display:flex;align-items:center;gap:6px;font-weight:500;margin:4px 12px 4px 0}
.chk input{width:auto}
.spin{display:inline-block;width:18px;height:18px;border:3px solid #cfe2e2;border-top-color:var(--c);border-radius:50%;animation:sp 1s linear infinite;vertical-align:middle}
@keyframes sp{to{transform:rotate(360deg)}}
.leaflet-div-icon.emoji{background:none;border:0;font-size:24px;line-height:24px;text-shadow:0 1px 2px #fff}
.secpin{background:var(--c);color:#fff;border-radius:50%;width:26px;height:26px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.4)}
</style>
</head>

async function rpc(fn,args){
  let r;
  try{r=await fetch(SB+'/rest/v1/rpc/'+fn,{method:'POST',headers:{apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':'application/json'},body:JSON.stringify(args||{})})}
  catch(e){throw new Error('network')}
  const tx=await r.text();let j=null;try{j=tx?JSON.parse(tx):null}catch(e){}
  if(!r.ok){
    let m=(j&&j.message)||'error';
    if(!TX['e_'+m]) m='error';
    if((m==='not_signed_in'||m==='pending')&&args&&args.p_token){logoutLocal();setTimeout(()=>{location.hash='#login'},50)}
    throw new Error(m);
  }
  return j;
}

function maskA(a){a=String(a||'').replace(/\D/g,'');return a.length>4?'XXXX XXXX '+a.slice(-4):a}
function privLine(s){const p=s.private||{};const parts=[];if(p.hrms)parts.push('HRMS '+esc(p.hrms));if(p.cfms)parts.push('CFMS '+esc(p.cfms));if(p.aadhaar)parts.push('Aadhaar '+esc(maskA(p.aadhaar)));return parts.length?'<div class="mute">🔒 '+parts.join(' · ')+'</div>':''}
function parseClusters(cl,hh){
  const sp=v=>String(v==null?'':v).split(/[+,;\/&]|\s{2,}/).map(x=>x.trim()).filter(Boolean);
  const a=sp(cl),h=sp(hh);const out=[];
  a.forEach((x,i)=>{const m=x.match(/^([^:\-(]+)\s*[:\-(]\s*(\d+)/);if(m)out.push({no:m[1].trim(),households:+m[2]});else out.push({no:x,households:h[i]!=null&&!isNaN(+h[i])?+h[i]:null})});
  return out;
}

function mkMap(id,center,zoom){
  const el=$(id);if(!el)return null;
  if(!window.L){el.innerHTML='<p class="mute" style="padding:10px">'+t('mapOff')+'</p>';return null}
  const m=L.map(id,{scrollWheelZoom:false}).setView(center||CENTER,zoom||14);
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(m);
  setTimeout(()=>m.invalidateSize(),200);
  return m;
}

/* ---------- photos ---------- */
function compress(file){
  return new Promise((res,rej)=>{
    const fr=new FileReader();
    fr.onerror=()=>rej(new Error('error'));
    fr.onload=()=>{const img=new Image();img.onerror=()=>rej(new Error('error'));img.onload=()=>{
      let max=1280,q=.72,out='';
      for(let i=0;i<4;i++){
        const sc=Math.min(1,max/Math.max(img.width,img.height));
        const c=document.createElement('canvas');c.width=Math.round(img.width*sc);c.height=Math.round(img.height*sc);
        c.getContext('2d').drawImage(img,0,0,c.width,c.height);
        out=c.toDataURL('image/jpeg',q);
        if(out.length<850000)break;max=Math.round(max*.8);q-=.1;
      }
      res(out);
    };img.src=fr.result};
    fr.readAsDataURL(file);
  });
}
async function uploadPhoto(file,code){
  const data=await compress(file);
  let r;try{r=await fetch(SB+'/functions/v1/wp-photo',{method:'POST',headers:{apikey:KEY,'Content-Type':'application/json'},body:JSON.stringify({token:S.token,code:code,image:data})})}catch(e){throw new Error('network')}
  const j=await r.json().catch(()=>({}));
  if(!r.ok||!j.url)throw new Error(j.error==='not_allowed'?'not_allowed':'error');
  return j.url;
}
function photoPicker(holderId,list,max,code,onChange){
  const h=$(holderId);
  const draw=()=>{
    h.innerHTML='<div class="thumbs">'+list.map((u,i)=>'<div class="t"><img src="'+esc(safeUrl(u))+'" data-full="'+esc(safeUrl(u))+'" alt=""><button type="button" data-rm="'+i+'">×</button></div>').join('')+'</div>'+
      (list.length<max?'<label class="btn alt sm" style="display:inline-flex;margin-top:6px">'+t('addPhoto')+'<input type="file" accept="image/*" hidden></label>':'')+'<span class="mute" data-st></span>';
    h.querySelectorAll('[data-rm]').forEach(b=>b.onclick=()=>{list.splice(+b.dataset.rm,1);draw();onChange&&onChange()});
    const inp=h.querySelector('input[type=file]');
    if(inp)inp.onchange=async()=>{const f=inp.files[0];if(!f)return;const st=h.querySelector('[data-st]');st.innerHTML=' <span class="spin"></span> '+t('uploading');
      try{list.push(await uploadPhoto(f,code));draw();onChange&&onChange()}catch(e){st.textContent=' '+errText(e)}};
  };
  draw();
}
function gpsInto(latId,lngId,cb){
  if(!navigator.geolocation){toast(t('gpsFail'));return}
  toast(t('loading'));
  navigator.geolocation.getCurrentPosition(p=>{$(latId).value=p.coords.latitude.toFixed(6);$(lngId).value=p.coords.longitude.toFixed(6);toast(t('gpsOk'));cb&&cb()},
    ()=>toast(t('gpsFail')),{enableHighAccuracy:true,timeout:20000,maximumAge:0});
}
function pickMap(mapId,latId,lngId,center){
  const m=mkMap(mapId,center||CENTER,center?17:14);if(!m)return;
  let mk=null;
  const put=()=>{const la=num($(latId).value),ln=num($(lngId).value);if(la==null||ln==null)return;
    if(mk)mk.setLatLng([la,ln]);else mk=L.marker([la,ln]).addTo(m);m.setView([la,ln],17)};
  put();
  m.on('click',e=>{$(latId).value=e.latlng.lat.toFixed(6);$(lngId).value=e.latlng.lng.toFixed(6);put()});
  $(latId).onchange=put;$(lngId).onchange=put;
  return put;
}

        it('📄',t('report'),'#report/'+code,r==='report')];
      if(canEditProfile(code))ch.push(it('✏️',t('editShort'),'#edit/'+code,r==='edit'));
      const nm=secName(code);

    }

/* ----- import staff from SGSW attendance report ----- */
function matchDesig(txt){
  const x=String(txt||'').toLowerCase();
  const keys=[['administrative',0],['amenities',1],['sanitation',2],['education',3],['plan',4],['welfare',5],['energy',6],['health',7],['anm',7],['revenue',8],['women',9],['mahila',9]];
  for(const k of keys)if(x.includes(k[0]))return DESIG[k[1]][0];
  return String(txt||'').trim()||DESIG[10][0];
}
const titleCase=n=>String(n).trim().replace(/\s+/g,' ').toLowerCase().replace(/(^|[\s.])([a-z])/g,(m,a,b)=>a+b.toUpperCase());
function parseReport(text){
  const out=[];const idRe=/^\d{2,4}X{2,}\d{2,6}$/i;
  const lines=String(text).replace(/\r/g,'').split('\n');
  // 1) tab separated rows
  lines.forEach(l=>{const c=l.split('\t').map(x=>x.trim());
    if(c.length>=4){const i=c.findIndex(v=>idRe.test(v.replace(/\s/g,'')));if(i>=0&&c[i+1]&&c[i+2])out.push({name:c[i+1],designation:c[i+2]})}});
  if(out.length)return out;
  // 2) one cell per line
  const L=lines.map(x=>x.trim()).filter(Boolean);
  for(let i=0;i<L.length;i++){
    if(idRe.test(L[i].replace(/\s/g,''))){
      const name=L[i+1]||'';let des=[];let j=i+2;
      while(j<L.length&&!/^\d{1,2}:\d{2}/.test(L[j])&&!/^NA$/i.test(L[j])&&!idRe.test(L[j].replace(/\s/g,''))&&!/^\d+$/.test(L[j])){des.push(L[j]);j++}
      if(name)out.push({name:name,designation:des.join(' ')});
    }
  }
  return out;
}
function loadXLSX(){return window.XLSX?Promise.resolve():new Promise((res,rej)=>{const sc=document.createElement('script');sc.src='https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js';sc.onload=res;sc.onerror=()=>rej(new Error('error'));document.head.appendChild(sc)})}
function csvRows(text){const rows=[];let row=[],cur='',q=false;text=String(text).replace(/^﻿/,'');
  for(let i=0;i<text.length;i++){const c=text[i];
    if(q){if(c==='"'){if(text[i+1]==='"'){cur+='"';i++}else q=false}else cur+=c}
    else if(c==='"')q=true;else if(c===','){row.push(cur);cur=''}else if(c==='\n'){row.push(cur);rows.push(row);row=[];cur=''}else if(c!=='\r')cur+=c}
  if(cur||row.length){row.push(cur);rows.push(row)}return rows}
function rowsToStaff(rows){
  const hi=rows.findIndex(r=>r.some(c=>/name/i.test(String(c))));if(hi<0)return [];
  const H=rows[hi].map(c=>String(c).toLowerCase());
  const col=f=>H.findIndex(f);
  const ci={name:col(h=>/name/.test(h)&&!/desig/.test(h)),des:col(h=>/desig|post/.test(h)),ph:col(h=>/phone|mobile|cell|contact/.test(h)),aa:col(h=>/aadha|adha|uid/.test(h)),
    hr:col(h=>/hrms/.test(h)),cf:col(h=>/cfms/.test(h)),cl:col(h=>/cluster/.test(h)),hh:col(h=>/house|hh/.test(h)&&!/cluster/.test(h))};
  const g=(r,k)=>ci[k]<0?'':String(r[ci[k]]==null?'':r[ci[k]]).trim();
  return rows.slice(hi+1).filter(r=>g(r,'name')).map(r=>({name:g(r,'name'),designation:g(r,'des')?matchDesig(g(r,'des')):'',phone:g(r,'ph'),
    private:{aadhaar:g(r,'aa').replace(/\D/g,''),hrms:g(r,'hr'),cfms:g(r,'cf')},clusters:parseClusters(g(r,'cl'),g(r,'hh'))}));
}

  const keys=TYPES.map(x=>x[0]);
  const head=['Sl','Secretariat','Code','Complete %','Total population','Households','Men','Women','Above 60','Children','Pensioners','Ration cards','Voters','SHGs','Places','Photos','Staff','Logins','Office latitude','Office longitude'].concat(TYPES.map(x=>x[1]));
  const q=v=>{v=v==null?'':String(v);return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};
  const rows=ov.map(o=>{const p=(o.data&&o.data.population)||{};return [o.sl,o.name,o.code,completion(o),p.total,p.households,p.men,p.women,p.above60,p.children,p.pensions,p.ration_cards,p.voters,p.shgs,o.places,o.photos,o.staff,o.accounts,o.lat,o.lng].concat(keys.map(k=>typeCount(o.data,o.types,k)))});
  const blob=new Blob(['﻿'+[head].concat(rows).map(r=>r.map(q).join(',')).join('\n')],{type:'text/csv'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='ward-profile-guntakal.csv';a.click();
}
function copyLink(code){const u=location.origin+location.pathname+'#public/'+code;(navigator.clipboard?navigator.clipboard.writeText(u):Promise.reject()).then(()=>toast(t('copied'))).catch(()=>prompt('',u))}

/* ----- public ----- */
async function vPublicList(){const app=curApp;
  await loadSecs(true);
  const pub=S.secs.filter(s=>s.public_on);
  app.innerHTML='<div class="card"><h2>'+t('publicPages')+'</h2>'+(pub.length?'<div class="list">'+pub.map(s=>'<a class="it" style="text-decoration:none;color:inherit" href="#public/'+s.code+'"><div class="secpin">'+s.sl+'</div><div class="grow nm">'+esc(s.name)+'</div>→</a>').join('')+'</div>':'<p class="mute">'+t('publicNone')+'</p>')+'</div>';
}
async function vPublic(code){const app=curApp;
  app.innerHTML='<div class="card"><span class="spin"></span></div>';
  const w=await rpc('wp_public_ward',{p_code:code});
  const d=w.data||{};
  app.innerHTML='<div class="card hero"><h1>'+esc(w.sec.name)+'</h1><div class="mute">'+t('appSub')+' · '+esc(w.sec.code)+'</div>'+
   (safeUrl(d.office_photo)?'<img src="'+esc(safeUrl(d.office_photo))+'" data-full="'+esc(safeUrl(d.office_photo))+'" alt="" style="width:100%;max-height:240px;object-fit:cover;border-radius:10px;margin-top:8px">':'')+
   (d.office_address?'<p>'+esc(d.office_address)+'</p>':'')+(d.office_phone?'<a class="btn sm" href="tel:'+esc(String(d.office_phone).replace(/[^0-9+]/g,''))+'">'+t('call')+' '+esc(d.office_phone)+'</a> ':'')+
   (w.sec.lat!=null?'<a class="btn alt sm" target="_blank" rel="noopener" href="'+gmaps(w.sec.lat,w.sec.lng)+'">🗺 '+t('openGmaps')+'</a>':'')+'</div>'+
   '<div class="card"><h2>'+t('staff')+'</h2><div class="list">'+(w.staff.length?w.staff.map(s=>'<div class="it">'+(safeUrl(s.photo)?'<img class="av" src="'+esc(safeUrl(s.photo))+'" data-full="'+esc(safeUrl(s.photo))+'" alt="">':'<div class="av">👤</div>')+'<div class="grow"><div class="nm">'+esc(s.name)+'</div><div class="mute">'+esc(desigLabel(s.designation))+'</div></div>'+(s.phone?'<a class="btn sm" href="tel:'+esc(String(s.phone).replace(/[^0-9+]/g,''))+'">'+t('call')+'</a>':'')+'</div>').join(''):'<p class="mute">'+t('noStaff')+'</p>')+'</div></div>'+
   '<div class="card"><h2>'+t('places')+'</h2><div id="pm" class="map"></div><div class="list">'+w.places.map(p=>{const ti=typeInfo(p.type,d);return '<div class="it"><div class="emo">'+ti.emo+'</div><div class="grow"><div class="nm">'+esc(p.name)+'</div><div class="mute">'+esc(ti.label)+(p.address?' · '+esc(p.address):'')+'</div><div class="thumbs">'+(p.photos||[]).map(u=>'<img src="'+esc(safeUrl(u))+'" data-full="'+esc(safeUrl(u))+'" alt="" loading="lazy">').join('')+'</div></div>'+(p.lat!=null?'<a class="btn alt sm" target="_blank" rel="noopener" href="'+gmaps(p.lat,p.lng)+'">🗺</a>':'')+'</div>'}).join('')+'</div></div>';
  const m=mkMap('pm',w.sec.lat!=null?[w.sec.lat,w.sec.lng]:CENTER,15);
  if(m){const pts=[];if(w.sec.lat!=null){L.marker([w.sec.lat,w.sec.lng],{icon:emojiIcon('🏢')}).addTo(m);pts.push([w.sec.lat,w.sec.lng])}
    w.places.forEach(p=>{if(p.lat!=null){L.marker([p.lat,p.lng],{icon:emojiIcon(typeInfo(p.type,d).emo)}).addTo(m).bindPopup(esc(p.name));pts.push([p.lat,p.lng])}});
    if(pts.length>1)m.fitBounds(pts,{padding:[30,30],maxZoom:17})}
}

/* ---------- router ---------- */
async function route(){
  header();
  MAIN.innerHTML='';curApp=document.createElement('div');MAIN.appendChild(curApp);const app=curApp;
  const h=(location.hash||'#home').slice(1).split('/');
  window.scrollTo(0,0);
  try{
    switch(h[0]){
      case 'about':return vAbout();
      case 'login':return vLogin();
      case 'signup':return await vSignup();
      case 'account':return vAccount();
      case 'ward':S.filter='all';return await vWard(h[1],h[2]);
      case 'report':return await vReport(h[1]);
      case 'wards':return await vHome('wards');
      case 'edit':return await vEdit(h[1]);
      case 'place':return await vPlace(h[1],h[2]||'new');
      case 'staff':return await vStaff(h[1],h[2]||'new');
      case 'import':return await vImport(h[1]);
      case 'admin':return await vAdmin(h[1]);
      case 'public':return h[1]?await vPublic(h[1]):await vPublicList();
      default:return await vHome();
    }
  }catch(er){app.innerHTML='<div class="msg err">'+errText(er)+'</div><a class="btn" href="#home">'+t('back')+'</a>'}
}
window.addEventListener('hashchange',route);
route();
if(S.token)rpc('wp_me',{p_token:S.token}).then(me=>{S.me=me;localStorage.setItem('wp_me',JSON.stringify(me));header()}).catch(()=>{});
if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost'))navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
